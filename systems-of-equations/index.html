<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Systems of Equations</title>
<meta name="theme-color" content="#1b2450">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* ===== MIDNIGHT SCHOLAR - navy stage, white card, violet + mint accents ===== */
* { box-sizing: border-box; }
body {
    font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background:
        radial-gradient(900px 500px at 85% -10%, rgba(124, 58, 237, 0.28), transparent 60%),
        radial-gradient(800px 500px at -10% 110%, rgba(16, 185, 129, 0.18), transparent 55%),
        linear-gradient(160deg, #141b3d 0%, #1b2450 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px 12px;
    margin: 0;
}
.card {
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(8, 12, 40, 0.55);
    max-width: 720px;
    width: 100%;
    padding: 30px 24px 26px;
    position: relative;
    overflow: hidden;
}
.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #2e3d8f, #7c3aed, #10b981);
}
/* The heading box shrinks to its text so the rule below can match it. */
h1 {
    text-align: center;
    color: #1e2a5e;
    margin: 4px auto 6px;
    font-size: 24px;
    letter-spacing: 0.3px;
    width: fit-content;
    max-width: 100%;
}
/* The gradient rule is exactly as wide as the title text. */
h1::after {
    content: '';
    display: block;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    margin: 8px auto 14px;
    background: linear-gradient(90deg, #2e3d8f, #7c3aed, #10b981);
}
.equation {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
    color: #1e2a5e;
    background: #eef0fb;
    border: 2px solid #c7cdf0;
    border-radius: 14px;
    padding: 10px 12px;
    max-width: 100%;
    overflow-wrap: break-word;
}
.eq-pair { margin: 16px auto; display: flex; flex-direction: column; gap: 8px; }
.solve-instruction { text-align: center; font-size: 13.5px; font-weight: 700; color: #4a5480; margin: 6px 0 2px; }
.eq-write-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    font-size: 19px;
    font-weight: bold;
    color: #1e2a5e;
    margin: 14px 0;
    flex-wrap: wrap;
}
.eq-write-label { font-size: 13px; font-weight: 800; color: #2e3d8f; width: 100%; text-align: center; margin-bottom: -6px; }
.coef-input {
    width: 58px !important;
    font-size: 18px !important;
    padding: 8px 4px !important;
    text-align: center;
    border: 3px solid #7c3aed;
    border-radius: 10px;
    color: #1e2a5e;
    font-weight: bold;
}
.coef-input.locked-correct { border-color: #047857; background: #ecfdf5; color: #047857; }
/* a11y: the locked-correct border was mint #10b981 -- 2.54:1 on the white card
   and 2.23:1 on the #eef0fb grid panel, under the 3:1 WCAG 1.4.11 minimum for a
   meaningful UI indicator. #047857 is 5.33:1 and 4.70:1 on those two backdrops
   and is already the locked state's text colour, so the state reads as one
   piece. The mint fill behind it is unchanged. */
.story-box {
    background: #e8f8f0;
    border: 2px solid #8fd9b6;
    border-radius: 14px;
    padding: 14px;
    margin: 14px 0 10px;
    font-size: 15px;
    color: #1e6b46;
    line-height: 1.45;
}
.defs-line {
    text-align: center;
    font-size: 13px;
    color: #4a5480;
    font-style: italic;
    margin: 2px 0 10px;
}
.order-note {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #5b21b6;
    margin: 0 0 8px;
}
.your-equations-label {
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    color: #2e3d8f;
    margin: 12px 0 -4px;
    letter-spacing: 0.3px;
}
.input-area {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 18px;
    margin: 20px 0;
    flex-wrap: wrap;
}
.var-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.var-label { display: block; font-size: 13px; font-weight: 800; color: #2e3d8f; }
.var-input-row { display: flex; flex-direction: column; align-items: center; gap: 4px; }
input[type="number"], input[type="text"] {
    width: 100px;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    padding: 10px;
    border: 3px solid #7c3aed;
    border-radius: 12px;
    color: #1e2a5e;
    background: #ffffff;
}
/* Focus indicator (WCAG 1.4.11 / 2.4.11).
   This used to swap the violet border (#7c3aed, 5.16:1 against the white card)
   for mint #10b981, which is only 2.54:1 -- so taking focus actually LOWERED
   the contrast of the control's edge, and the 0.18-alpha ring was too faint to
   make up for it. Deep teal #0b7a70 is the substitute this suite already uses
   where mint fails: 5.12:1 on white and 4.52:1 on the #eef0fb panels the
   guided grid sits on. The ring is opaque enough to be seen on both. */
input[type="number"]:focus, input[type="text"]:focus,
.coef-input:focus, .eq-grid .box-input:focus {
    outline: none;
    border-color: #0b7a70;
    box-shadow: 0 0 0 4px rgba(11, 122, 112, 0.45);
}
input.locked-correct {
    border-color: #047857; /* a11y: see .coef-input.locked-correct */
    background: #ecfdf5;
    color: #047857;
}
button {
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 800;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    /* Never `transition: all` on a focusable control -- it animates the focus
       outline too, which makes the ring fade in late or not paint at all. */
    transition: background 0.2s, filter 0.2s, transform 0.2s, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}
/* An explicit, palette-safe focus ring for every button. #0b7a70 clears 3:1
   against the white card, the mint chips and the navy buttons alike, and the
   white inner line keeps it visible where the button itself is dark. */
button:focus-visible {
    outline: 3px solid #0b7a70;
    outline-offset: 2px;
    box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.9);
}
.switch:focus-visible {
    outline: 3px solid #0b7a70;
    outline-offset: 3px;
}
button:active { transform: scale(0.95); }
button:disabled { opacity: 0.5; cursor: default; }
.submit-btn {
    background: linear-gradient(135deg, #2e3d8f, #4b3bbd);
    color: white;
    box-shadow: 0 6px 16px rgba(46, 61, 143, 0.35);
}
.submit-btn:hover { filter: brightness(1.1); }
.sign-btn {
    background: #e6e9f6;
    color: #2e3d8f;
    padding: 5px 16px;
    font-size: 14px;
    font-weight: 800;
    border-radius: 10px;
}
.method-btns, .level-btns {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}
/* All three category buttons carry the same teal gradient; the selected one is
   marked by a perimeter, not by a different fill.
   ONE gradient now runs through every control a student presses to move around
   the game -- the three categories, the selected level, and the Check buttons:
   navy #2e3d8f into teal #0b7a70. White clears 9.63:1 at the navy end and
   5.21:1 at the teal end, so the label holds up across the whole ramp.
   The selected button is marked by a soft mint rim on its own edge rather than
   by a bright halo or a dark outline. A transparent rim of the same
   width on the unselected buttons keeps all three exactly the same size, so
   nothing shifts when the selection moves. */
.method-btn {
    background: linear-gradient(135deg, #2e3d8f, #0b7a70);
    color: #ffffff;
    border: 3px solid transparent;
    border-radius: 999px;
    padding: 9px 17px;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 4px 10px rgba(10, 107, 97, 0.28);
}
.method-btn:hover { filter: brightness(1.08); }
/* Deliberately quiet. The spreading halo is gone; what marks the selection is
   a soft mint rim on the button's own edge, with only a whisper of a ring
   outside it. #9ad9c4 is muted enough not to glare but still clears 3.25:1
   against the teal end of the fill and 6.01:1 against the navy end, so the
   indicator carries its own contrast rather than leaning on the shadow. */
.method-btn.active {
    border-color: #9ad9c4;
    box-shadow:
        0 0 0 2px rgba(154, 217, 196, 0.30),
        0 4px 12px rgba(20, 27, 61, 0.25);
}
/* Levels follow the categories exactly: a quiet neutral pill when not chosen,
   the same teal fill and the same green glow when chosen. They used to be a
   THIRD green (#047857) alongside the teal buttons and the mint status chips,
   which is most of why the header read as busy. */
.level-btn {
    background: #eef0fb;
    color: #2e3d8f;
    border: 3px solid transparent;
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
}
.level-btn:hover { background: #dfe4f7; }
/* Same treatment as a selected category, at a smaller radius. Two glows of
   equal weight stacked one above the other competed with each other; the level
   row is secondary, so its halo is tighter and dimmer. Neither pulses -- a
   permanently animating element in the header is exactly the kind of noise
   this pass is removing. */
.level-btn.active {
    background: linear-gradient(135deg, #2e3d8f, #0b7a70);
    color: #ffffff;
    border-color: #9ad9c4;
    box-shadow: 0 2px 8px rgba(20, 27, 61, 0.22);
}
.feedback {
    text-align: center;
    font-size: 19px;
    font-weight: 800;
    margin: 14px 0 6px;
    min-height: 30px;
}
.correct { color: #059669; }
/* Design item 14: the wrong-answer message was orange #b45309, which broke
   two rules at once (no orange anywhere; incorrect feedback is ink navy).
   Orange was also the only thing separating a grading verdict from the
   royal-blue .partial input prompts, so the verdict now additionally sits in
   a chip-bg box - a difference of shape, not just of shade. */
.incorrect { color: #1e2a5e; font-size: 18px; font-weight: 700; }
/* :not(:empty) matters: showStats() and generateProblem() clear the text but
   leave the class on, so an unguarded box would linger as an empty slab. */
.feedback.incorrect:not(:empty) {
    background: #eef0fb;
    border: 2px solid #c7cdf0;
    border-radius: 10px;
    padding: 8px 14px;
}
.partial { color: #2e3d8f; font-size: 16px; font-weight: 700; }
.victory {
    text-align: center;
    font-size: 24px;
    color: #7c3aed;
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}
.info {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
}
/* Neutral, not mint. Mint now means one thing only in this game -- an answer
   confirmed correct -- so a permanently-green "Problem: 1" chip was spending
   the success colour on a counter. #2e3d8f on #eef0fb is 8.10:1. */
.info-item {
    font-size: 11.5px;
    font-weight: 800;
    background: #eef0fb;
    color: #2e3d8f !important;
    padding: 6px 12px;
    border-radius: 999px;
}
/* Design item 6: a hot streak is good news but was printed as red-on-pink,
   i.e. as a warning. It is now a violet chip, which reads as a highlight and
   stays clearly apart from the mint default chip. #5b21b6 on #ede9fe is
   7.57:1 (needs 4.5 at 11.5px). */
.info-item.hot {
    background: #ede9fe;
    color: #5b21b6 !important;
    box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.35);
}
.hint-btn, .answer-btn, .skip-btn, .solution-btn, .stats-btn {
    background: #f3eefe;
    color: #6d28d9;
    margin: 4px;
    font-size: 13px;
}
.hint-btn:hover, .answer-btn:hover, .skip-btn:hover, .solution-btn:hover, .stats-btn:hover {
    background: #e9defc;
}
/* The muted indigo #3b3568 measured 10:1 but read as washed out next to the
   ink navy used everywhere else. Same box, the suite's own text colour, and a
   size that matches the rest of the card. */
.hint-box, .answer-box, .solution-box {
    background: #f7f5ff;
    border: 2px solid #c3b2f0;
    border-radius: 14px;
    padding: 15px;
    margin: 14px 0;
    color: #1e2a5e;
    font-size: 15px;
    line-height: 1.5;
}
.reveal-val {
    font-size: 19px;
    font-weight: 800;
    color: #2e3d8f;
    font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
}
.progress-cups {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 4px 0 14px;
    flex-wrap: wrap;
}
.cup-container { text-align: center; }
.cup-label { font-size: 10px; font-weight: 800; color: #4a5480; margin-bottom: 3px; }
.cup {
    width: 34px;
    height: 34px;
    border: 2px solid #2e3d8f;
    border-radius: 0 0 10px 10px;
    position: relative;
    overflow: hidden;
    background: #f4f6fd;
    margin: 0 auto;
}
.cup-fill { position: absolute; bottom: 0; left: 0; right: 0; transition: height 0.5s ease; }
/* Two states only, since the cup now reports progress rather than accuracy:
   royal navy while it is filling, mint once the pattern is complete. The old
   violet "done, but with errors" fill is retired -- the .half rule is kept so
   any saved markup referring to it still renders sensibly. */
.cup-fill.full { background: linear-gradient(to top, #059669, #34d399); }
.cup-fill.half { background: linear-gradient(to top, #059669, #34d399); }
.cup-fill.partial { background: linear-gradient(to top, #2e3d8f, #8b96d8); }
.cup-stats { font-size: 9px; color: #5d6798; margin-top: 2px; } /* a11y: #6a74a8 is 4.49:1 on white */
.scaffold-container {
    background: #f7f8fe;
    border: 2px solid #c7cdf0;
    border-radius: 18px;
    padding: 16px 14px;
    margin: 14px 0;
}
.step-title { font-size: 15px; font-weight: 800; color: #2e3d8f; margin-bottom: 6px; }
.stack-add {
    font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
    font-size: 17px;
    font-weight: bold;
    color: #1e2a5e;
    background: #eef0fb;
    border: 2px solid #c7cdf0;
    border-radius: 10px;
    padding: 10px 14px;
    margin: 10px auto;
    display: grid;
    grid-template-columns: auto auto auto auto auto;
    gap: 2px 6px;
    width: fit-content;
    max-width: 100%;
}
.stack-add .op { text-align: left; }
.stack-add .term { text-align: right; white-space: nowrap; }
.stack-add .eqs { text-align: center; }
.stack-add .stack-line {
    grid-column: 1 / -1;
    border-top: 2px solid #2e3d8f;
    margin: 4px 0 2px;
}
.step-question { font-size: 15.5px; color: #1e2a5e; margin: 8px 0; line-height: 1.5; }
.completed-steps {
    background: #ecfdf5;
    border: 2px solid #34d399;
    border-radius: 14px;
    padding: 12px 14px;
    margin: 12px 0;
    /* The running record of what has been established so far is the thing a
       student re-reads most while working the next step, so it is set at
       reading size rather than as fine print. */
    font-size: 15.5px;
    color: #14532d;
}
.completed-steps .row { padding: 6px 0; border-top: 1px dashed rgba(0,0,0,0.18); line-height: 1.45; }
.completed-steps .row:first-child { border-top: none; }
.step-hint {
    background: #f3eefe;
    border-left: 4px solid #7c3aed;
    border-radius: 0 10px 10px 0;
    padding: 10px 14px;
    margin: 10px 0;
    font-size: 15px;
    color: #4c1d95;
}
.stats-panel { font-size: 14px; color: #1e2a5e; }
.stat-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.stat-name { width: 130px; font-size: 12.5px; font-weight: 800; color: #2e3d8f; flex-shrink: 0; }
.stat-bar-wrap { flex: 1; background: #eef0fb; border-radius: 8px; height: 14px; overflow: hidden; }
.stat-bar { height: 100%; border-radius: 8px; transition: width 0.4s ease; }
/* Design item 18: orange mid tier and red low tier gone. Same cool ramp as
   the cups and as Signed Numbers - royal navy, violet, mint - so the tiers
   remain three distinguishable colours without telling a beginner in red
   that they are failing. The percentage in .stat-num carries the number. */
.stat-bar.good { background: linear-gradient(90deg, #059669, #34d399); }
.stat-bar.mid { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
.stat-bar.low { background: linear-gradient(90deg, #2e3d8f, #8b96d8); }
.stat-bar.none { background: #d9def2; }
/* widened from 92px so design item 11's "not tried yet" fits on one line */
.stat-num { font-size: 12px; color: #4a5480; width: 104px; text-align: right; flex-shrink: 0; }
.recommend {
    background: #eef0fb;
    border: 2px solid #8b96d8;
    border-radius: 12px;
    padding: 10px 12px;
    margin: 14px 0;
    font-size: 13px;
    color: #2e3d8f;
}
/* ===== Per-variable check controls (independent x / y checking) ===== */
/* Navy into teal: the same family as the category pills, one step deeper, so a
   Check reads as the primary action of the panel it sits in.
   White on #2e3d8f is 9.63:1 and on #0b7a70 is 5.21:1. */
.check-one-btn {
    background: linear-gradient(135deg, #2e3d8f, #0b7a70);
    color: #ffffff;
    padding: 7px 20px;
    font-size: 13px;
    border-radius: 10px;
    margin-top: 2px;
    box-shadow: 0 4px 12px rgba(46, 61, 143, 0.3);
}
.check-one-btn:hover { filter: brightness(1.1); }
.var-status {
    font-size: 12px;
    font-weight: 800;
    min-height: 16px;
    text-align: center;
    color: #4a5480;
}
input[readonly] { cursor: default; }
.var-status.ok { color: #047857; }   /* 5.48:1 on white */
.var-status.no { color: #5b21b6; }   /* 8.79:1 on white */

/* A box the student filled in incorrectly. Red and orange are both out of the
   palette, so a wrong box is marked in deep violet - border, tint and a short
   shake - and never by colour alone: every check also writes a count and the
   offending term into the assertive feedback line, and sets aria-invalid. */
/* Option D2: the violet border stays as the outer edge, a thin rose line is
   drawn just inside it, and the number itself stays purple. Rose #be185d is
   6.04:1 against the white field, so the inner perimeter is a real boundary
   rather than a tint; the digits at #5b21b6 are 8.98:1. No red, no orange. */
input.box-error, input.coef-input.box-error {
    border-color: #7c3aed !important;
    background: #ffffff !important;
    color: #5b21b6 !important;
    box-shadow: inset 0 0 0 3px #be185d;
    animation: box-shake 0.3s ease-in-out;
}
@keyframes box-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
}

/* ===== Guided step: rewrite-the-equation and sum-the-columns grids ===== */
.eq-grid {
    font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
    font-size: 17px;
    font-weight: bold;
    color: #1e2a5e;
    background: #eef0fb;
    border: 2px solid #c7cdf0;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 12px auto;
    display: grid;
    grid-template-columns: auto auto auto auto auto auto;
    gap: 6px 6px;
    align-items: center;
    width: fit-content;
    max-width: 100%;
}
/* display:contents lets a row be one element for assistive tech while its six
   cells stay direct participants in the parent grid's column tracks. */
.eq-grid .grid-row { display: contents; }
.eq-grid .op { text-align: left; min-width: 14px; }
/* The joining sign between the x-column and the y-column. Left-aligned it sat
   hard against the right-aligned x-terms and a long way from the y-terms; it
   is centred in a column of its own so the sign reads as being BETWEEN the two
   terms it joins. */
.eq-grid .op-mid { text-align: center; min-width: 30px; padding: 0 8px; }
.eq-grid .term { text-align: right; white-space: nowrap; }
.eq-grid .eqs { text-align: center; }
.eq-grid .stack-line {
    grid-column: 1 / -1;
    border-top: 2px solid #2e3d8f;
    margin: 4px 0 2px;
}
.eq-grid .box-input {
    width: 56px;
    font-size: 16px;
    padding: 6px 2px;
    text-align: center;
    border: 3px solid #7c3aed;
    border-radius: 9px;
    color: #1e2a5e;
    font-weight: bold;
    background: #ffffff;
}
.eq-grid .box-input.locked-correct {
    border-color: #047857; /* a11y: see .coef-input.locked-correct */
    background: #ecfdf5;
    color: #047857;
}
.eq-grid .var-tag { font-size: 16px; padding-left: 2px; }
/* Teal is the navigation colour; inside the working area the banner uses the
   same navy-on-periwinkle as every other piece of instruction, so it reads as
   part of the problem rather than as another button. */
.goal-banner {
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    color: #1e2a5e;
    background: #eef0fb;
    border: 2px solid #8b96d8;
    border-radius: 999px;
    padding: 7px 16px;
    margin: 12px auto 4px;
    width: fit-content;
    max-width: 100%;
}
@media (max-width: 480px) {
    .eq-grid { font-size: 15px; padding: 10px 8px; gap: 5px 3px; }
    .eq-grid .box-input { width: 46px; font-size: 14px; }

}

/* ===== Confetti ===== */
.confetti { position: fixed; opacity: 0; pointer-events: none; z-index: 9999; }
@keyframes confetti-fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 1; }
}
@keyframes confetti-fall-slow {
    0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(115vh) rotate(1080deg) scale(0.85); opacity: 1; }
}
.sparkle {
    position: fixed;
    width: 20px; height: 20px;
    background: radial-gradient(circle, #fff 0%, #ffd700 50%, transparent 70%);
    border-radius: 50%;

    pointer-events: none;
    z-index: 100;
}

    0%, 100% { opacity: 1; transform: scale(1); }

}

   from the design system instead (white on #4a5480 is 7.31:1, hover 9.34:1).
   The two-tap "Tap again to confirm" rearm is what marks it destructive. */
.reset-btn { background: #4a5480; color: #ffffff; }
.reset-btn:hover { background: #3c4569; }

   toggle, persisted per device) ===== */
.settings-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 16px 0 0;
    padding-top: 14px;
    border-top: 1px solid #e6e9f6;
}
.settings-label { font-size: 13px; font-weight: 700; color: #4a5480; }
.switch {
    position: relative;
    flex: 0 0 44px;
    width: 44px;
    height: 24px;
    padding: 0;
    border-radius: 999px;
    background: #d5d9e8;
    /* Cross-cutting ruling B: the specified track is 1.41:1 against the white
       card when off and 2.54:1 when on, so the control's own edge fails WCAG
       1.4.11. A 1px rim fixes that in both states without touching the 44x24
       geometry or the mint fill: #8a93b8 = 3.02:1 off, #0b7a70 = 5.21:1 on. */
    border: 1px solid #8a93b8;
    cursor: pointer;
    transition: background 0.2s;
}

    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;

.switch[aria-pressed="true"] .switch-knob { transform: translateX(20px); }
.sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;

    clip: rect(0, 0, 0, 0);

    border: 0;
}
@media (prefers-reduced-motion: reduce) {

    .victory { animation: none !important; }
}
/* ===== Polar Rose Studio insignia (design system section 1) ===== */
.insignia { display: block; margin: 20px auto 4px; width: 62px; opacity: 0.9; }
.insignia-caption {
    text-align: center;
    font-size: 6.5px;
    letter-spacing: 1.2px;

    color: #5d6798;

@media (max-width: 480px) {
    .card { padding: 22px 12px 18px; }

    .method-btn { padding: 8px 12px; font-size: 12px; }
    .level-btn { padding: 7px 10px; font-size: 11px; }

<body>

    </div>

<script>
/* =====================================================================

(function () {
    var d = '', steps = 240;

/* =====================================================================

   ===================================================================== */

    function row(op, a, b, d) {
        var yTerm = (b < 0 ? '- ' : '+ ') + fmtCoefVar(Math.abs(b), dvY);
        return '<div class="op">' + escHtml(op) + '</div>' +
            '<div class="term">' + escHtml(fmtCoefVar(a, dvX)) + '</div>' +

   Level 1: target variable coefficient is +-1 in BOTH equations (direct add/subtract)

    // look like the same trivial "x + y / x - y" pattern.

}
function genElim1_() {
    var x = nz(-9, 9), y = nz(-9, 9);
    var elimVar = Math.random() < 0.5 ? 'x' : 'y';
    var c1 = pick([1, -1]), c2 = pick([1, -1]);
    var other1 = otherCoefL1(), other2 = otherCoefL1();
    var a1, b1, a2, b2;
    if (elimVar === 'x') { a1 = c1; b1 = other1; a2 = c2; b2 = other2; }
    else { a1 = other1; b1 = c1; a2 = other2; b2 = c2; }

    if (a1 * b2 - a2 * b1 === 0) return null;
    return { method: 'elim', level: 1, elimVar: elimVar, x: x, y: y, a1: a1, b1: b1, d1: d1, a2: a2, b2: b2, d2: d2 };

function genElimCombined_() {

   ===================================================================== */
var SKINS_COUNTVALUE = [
    { name: 'show', xLabel: 'Adult tickets', yLabel: 'Student tickets',
      xRange: [15, 60], yRange: [10, 50], priceXOptions: [12, 15, 18], priceYOptions: [7, 8, 9],

/* ---- Mixed: shuffled decks rather than independent random draws ----
   Drawing each problem independently at 25% a type reliably produces runs, and
   three investment problems back to back is exactly the discouraging stretch
   this game is built to avoid. It also produces droughts, where a type simply
   does not appear for a dozen problems.
   Instead Mixed deals from a shuffled deck and only reshuffles when the deck
   runs out, so every deck contains a known mix in an unpredictable order:
     opening deck   2 rectangle, 2 tickets, 2 coins          (investment absent)
     every deck after   the same six, plus 1 investment
   Investment therefore cannot appear before problem 7, and settles at one in
   seven after that -- often enough to stay familiar, rare enough not to
   dominate. A student who wants more can simply pick the Investment category. */

    coins: genAppCoins_, investment: genAppInvestment_

function shuffleInPlace(a) {
    for (var i = a.length - 1; i > 0; i--) {

    mixedDecksDealt++;
    shuffleInPlace(deck);
    /* Within a deck a type appears at most twice, but a deck ENDING on two of a
       type and the next deck OPENING on the same two gives four in a row. If
       the fresh deck starts on the type just dealt, swap that card deeper in,
       which caps any run at two. */
    if (deck[0] === mixedLastDealt) {
        for (var i = 1; i < deck.length; i++) {

/* =====================================================================
   LEVEL 0 GUIDED SCAFFOLD BUILDERS

   (see buildSolutionStrings below).

function buildSubScaffold(p) {
    var steps = [], eq1Str, eq2Str;

        if (p.isolateY) {
            eq1Str = fmtIsolated('y', p.m, 'x', p.c);
            eq2Str = fmtEq(p.a2, p.b2, 'x', 'y', p.d2);
            var isolatedRHS = fmtIsolatedRHS(p.m, 'x', p.c);
            var b2m = p.b2 * p.m;
            var bc = p.b2 * p.c;
            var combinedCoef = p.a2 + b2m;
            steps.push({
                informational: true,
                label: 'Substitute into the second equation',
                question: 'Since Equation 1 already tells us y, substitute (' + isolatedRHS + ') in place of y into the second equation. It becomes:',
                resultEquation: p.a2 + 'x + ' + p.b2 + '(' + isolatedRHS + ') = ' + p.d2
            });
            steps.push({
                label: 'Distribute',
                question: 'Distribute the ' + p.b2 + ' across (' + isolatedRHS + '). What is ' + p.b2 + ' \u00d7 ' + p.m + ' (the new x-term)?',
                correctAnswer: b2m,
                hint: p.b2 + ' x ' + p.m + ' = ' + b2m,
                resultEquation: fmtCoefVar(p.a2, 'x') + ' ' + signed(b2m) + 'x ' + signed(bc) + ' = ' + p.d2
            });
            steps.push({
                label: 'Combine into a single equation',
                question: 'Combine the two x-terms (' + p.a2 + 'x and ' + fmtCoefVar(b2m, 'x') + ') into one. What is the combined coefficient of x?',
                correctAnswer: combinedCoef,
                hint: p.a2 + ' + (' + b2m + ') = ' + combinedCoef,
                resultEquation: fmtCoefVar(combinedCoef, 'x') + ' ' + signed(bc) + ' = ' + p.d2
            });
            steps.push({
                label: 'Move the constant to the other side',
                question: 'Move the constant to the other side. What is ' + p.d2 + ' ' + (bc >= 0 ? '-' : '+') + ' ' + Math.abs(bc) + '?',
                correctAnswer: p.d2 - bc,
                hint: p.d2 + ' ' + (bc >= 0 ? '-' : '+') + ' ' + Math.abs(bc) + ' = ' + (p.d2 - bc),
                resultEquation: combinedCoef + 'x = ' + (p.d2 - bc)

                correctAnswer: p.x,
                hint: (p.d2 - bc) + ' / ' + combinedCoef + ' = ' + p.x,
                resultEquation: 'x = ' + p.x

                correctAnswer: p.y,
                hint: 'y = ' + p.m + '(' + p.x + ')' + (p.c !== 0 ? ' ' + signed(p.c) : '') + ' = ' + p.y,
                resultEquation: 'y = ' + p.y
            });
        } else {
            eq1Str = fmtIsolated('x', p.m, 'y', p.c);
            eq2Str = fmtEq(p.a2, p.b2, 'x', 'y', p.d2);
            var isolatedRHSy = fmtIsolatedRHS(p.m, 'y', p.c);
            var a2m = p.a2 * p.m;
            var ac = p.a2 * p.c;
            var combinedCoefY = p.b2 + a2m;
            steps.push({
                informational: true,
                label: 'Substitute into the second equation',
                question: 'Since Equation 1 already tells us x, substitute (' + isolatedRHSy + ') in place of x into the second equation. It becomes:',
                resultEquation: p.a2 + '(' + isolatedRHSy + ') + ' + p.b2 + 'y = ' + p.d2
            });
            steps.push({
                label: 'Distribute',
                question: 'Distribute the ' + p.a2 + ' across (' + isolatedRHSy + '). What is ' + p.a2 + ' \u00d7 ' + p.m + ' (the new y-term)?',
                correctAnswer: a2m,
                hint: p.a2 + ' x ' + p.m + ' = ' + a2m,
                resultEquation: fmtCoefVar(a2m, 'y') + ' ' + signed(p.b2) + 'y ' + signed(ac) + ' = ' + p.d2
            });
            steps.push({
                label: 'Combine into a single equation',
                question: 'Combine the two y-terms (' + fmtCoefVar(a2m, 'y') + ' and ' + p.b2 + 'y) into one. What is the combined coefficient of y?',
                correctAnswer: combinedCoefY,
                hint: '(' + a2m + ') + ' + p.b2 + ' = ' + combinedCoefY,
                resultEquation: fmtCoefVar(combinedCoefY, 'y') + ' ' + signed(ac) + ' = ' + p.d2
            });
            steps.push({
                label: 'Move the constant to the other side',
                question: 'Move the constant to the other side. What is ' + p.d2 + ' ' + (ac >= 0 ? '-' : '+') + ' ' + Math.abs(ac) + '?',
                correctAnswer: p.d2 - ac,
                hint: p.d2 + ' ' + (ac >= 0 ? '-' : '+') + ' ' + Math.abs(ac) + ' = ' + (p.d2 - ac),
                resultEquation: combinedCoefY + 'y = ' + (p.d2 - ac)
            });
            steps.push({
                label: 'Divide both sides by ' + combinedCoefY,
                question: 'Solve for y: divide both sides by ' + combinedCoefY + '. What is y?',
                correctAnswer: p.y,
                hint: (p.d2 - ac) + ' / ' + combinedCoefY + ' = ' + p.y,
                resultEquation: 'y = ' + p.y
            });
            steps.push({
                label: 'Substitute back into Equation 1',
                question: 'Substitute y = ' + p.y + ' back into Equation 1 to find x. What is x?',
                correctAnswer: p.x,
                hint: 'x = ' + p.m + '(' + p.y + ')' + (p.c !== 0 ? ' ' + signed(p.c) : '') + ' = ' + p.x,
                resultEquation: 'x = ' + p.x
            });
        }
    }
    return { eq1: eq1Str, eq2: eq2Str, steps: steps, x: p.x, y: p.y };
}

       exact opposites. If one coefficient evenly divides the other, ONLY that
       one equation needs multiplying (mult = 1 for the other) -- regardless of
       whether the original signs happened to already be opposite or the same.
       Only when neither divides the other (true Level 3 case) do both need it. */
    var mult1 = 1, mult2 = 1;
    var c1IsInt = Math.abs(c1 - Math.round(c1)) < 1e-9;
    var c2IsInt = Math.abs(c2 - Math.round(c2)) < 1e-9;
    if (!c1IsInt || !c2IsInt) {
        // Decimal coefficients (e.g. money/rate equations) -- multiply whichever
        // equation has the clean integer coefficient, rather than scaling the
        // decimal equation up by a large, less intuitive factor.
        if (c2IsInt && !c1IsInt) {
            mult2 = cleanNum(-c1 / c2); mult1 = 1;
        } else {
            mult1 = cleanNum(-c2 / c1); mult2 = 1;
        }
    } else if (c1 % c2 === 0) {
        mult2 = -c1 / c2;
    } else if (c2 % c1 === 0) {
        mult1 = -c2 / c1;
    } else {
        var L = lcm(c1, c2);
        mult1 = L / Math.abs(c1);
        mult2 = -(c1 * mult1) / c2;
    }

    var curC1 = c1, curOc1 = oc1, curD1 = p.d1;
    var curC2 = c2, curOc2 = oc2, curD2 = p.d2;
    /* Reworded: "since it appears in both equations" said nothing useful --
       every variable appears in both equations. When no multiplying is needed
       the line now says WHY, which is the fact the student is meant to notice. */
    var noMultiply = (mult1 === 1 && mult2 === 1);
    var opposites = 'The ' + dElim + '-coefficients are already opposites (' +
        withSign(c1) + ' and ' + withSign(c2) + '), so we do not need to multiply either equation by anything. We just add them. ';
    var intro = 'Let\'s eliminate ' + dElim + '. ' + (noMultiply ? opposites : '');
    var solutionIntro = 'Let\'s eliminate ' + dElim + '. ' + (noMultiply ? opposites : '');

    if (mult1 !== 1) {
        var newOc1 = cleanNum(oc1 * mult1), newD1 = cleanNum(p.d1 * mult1), newC1 = cleanNum(c1 * mult1);
        var ab1 = toAB(elimVar, newC1, newOc1);
        steps.push({
            label: 'Multiply the first equation by ' + spellMult(mult1),
            solutionLabel: solutionIntro + 'Multiply the first equation by ' + spellMult(mult1) + ' so the ' + dElim + '-coefficients become opposites',
            question: intro + 'The first equation has ' + dElim + '-coefficient ' + c1 + ' and the second equation has ' + dElim + '-coefficient ' + c2 + '. Multiply the first equation by ' + spellMult(mult1) + ' so the ' + dElim + '-coefficients can become opposites. What is the new coefficient of ' + dOther + '?',
            correctAnswer: newOc1,
            hint: oc1 + ' x ' + mult1 + ' = ' + newOc1,
            resultEquation: fmtEq(ab1.a, ab1.b, dvX, dvY, newD1)
        });
        curC1 = newC1; curOc1 = newOc1; curD1 = newD1;
        intro = ''; solutionIntro = '';
    }
    if (mult2 !== 1) {
        var newOc2 = cleanNum(oc2 * mult2), newD2 = cleanNum(p.d2 * mult2), newC2 = cleanNum(c2 * mult2);
        var ab2 = toAB(elimVar, newC2, newOc2);
        steps.push({
            label: 'Multiply the second equation by ' + spellMult(mult2),
            solutionLabel: solutionIntro + 'Multiply the second equation by ' + spellMult(mult2) + ' so the ' + dElim + '-coefficients become opposites',
            question: intro + 'Multiply the second equation by ' + spellMult(mult2) + ' so the ' + dElim + '-coefficients become opposites (' + curC1 + ' and ' + newC2 + '). What is the new coefficient of ' + dOther + '?',
            correctAnswer: newOc2,
            hint: oc2 + ' x (' + mult2 + ') = ' + newOc2,
            resultEquation: fmtEq(ab2.a, ab2.b, dvX, dvY, newD2)
        });
        curC2 = newC2; curOc2 = newOc2; curD2 = newD2;
        intro = ''; solutionIntro = '';
    }

    var abFinal1 = toAB(elimVar, curC1, curOc1);
    var abFinal2 = toAB(elimVar, curC2, curOc2);
    var stackedHtml = buildStackAddHtml(abFinal1.a, abFinal1.b, curD1, abFinal2.a, abFinal2.b, curD2, dvX, dvY);
    var sumOtherCoef = cleanNum(curOc1 + curOc2);
    var sumD = cleanNum(curD1 + curD2);
    var addLead = noMultiply
        ? 'Add the two equations'
        : 'The ' + dElim + '-coefficients (' + curC1 + ' and ' + curC2 + ') are now opposites, so add the two equations';
    steps.push({
        label: 'Add the two equations',
        solutionLabel: solutionIntro + addLead,
        solutionDetail: stackedHtml,
        question: intro + addLead + ', one under the other:' + stackedHtml + 'The ' + dElim + '-terms cancel. What is the coefficient of ' + dOther + ' in the sum?',
        correctAnswer: sumOtherCoef,
        hint: '(' + curOc1 + ') + (' + curOc2 + ') = ' + sumOtherCoef,
        resultEquation: fmtCoefVar(sumOtherCoef, dOther) + ' = ' + sumD
    });
    steps.push({
        label: 'Solve for ' + dOther,
        question: 'Solve for ' + dOther + '. What is ' + dOther + '?',
        correctAnswer: otherVal,
        hint: sumD + ' / ' + sumOtherCoef + ' = ' + otherVal,
        resultEquation: dOther + ' = ' + otherVal
    });
    steps.push({
        label: 'Substitute back into the first equation',
        question: 'Substitute ' + dOther + ' = ' + otherVal + ' back into the ORIGINAL first equation to find ' + dElim + '. What is ' + dElim + '?',
        correctAnswer: elimVal,
        hint: 'From the first equation: ' + eq1Str + '  ->  ' + c1 + dElim + ' = ' + p.d1 + ' ' + signed(cleanNum(-oc1 * otherVal)) + '  ->  ' + dElim + ' = ' + elimVal,
        resultEquation: dElim + ' = ' + elimVal
    });

    return { eq1: eq1Str, eq2: eq2Str, steps: steps, x: p.x, y: p.y };
}

/* =====================================================================
   LEVEL 0 GUIDED SCAFFOLD (elimination)

   Rebuilt so the student makes the decisions a person actually makes when
   eliminating, in the order they make them:

     1. Which multiplier turns the second equation's coefficients into the
        opposite of the first's?          (they choose the number)
     2. Write the multiplied equation(s). (they fill every coefficient)
     3. Add the columns.                  (they give the x sum, the y sum and
                                           the right-hand sum -- entering 0 for
                                           the column that cancels)
     4. Divide to get the first variable.
     5. Substitute back for the second.

   The old version asked only for "the new coefficient of y" at each stage,
   which skipped the decision entirely and never showed the two equations
   stacked with a line under them.

   Three shapes, driven by how the coefficients relate:
     A  already opposites  -> no multiplying, straight to the sum
     B  one divides the other -> multiply the SECOND equation only
     C  neither divides the other -> multiply both, first multiplier given
   In shape B the rows are swapped when necessary so the equation needing the
   multiplier is always the second one the student sees.
   ===================================================================== */
function buildGuidedSteps(p) {
    var dvX = 'x', dvY = 'y';
    var elimVar = p.elimVar, otherVar = elimVar === 'x' ? 'y' : 'x';
    var r1 = { a: p.a1, b: p.b1, d: p.d1 };
    var r2 = { a: p.a2, b: p.b2, d: p.d2 };
    function cOf(r) { return elimVar === 'x' ? r.a : r.b; }

    var c1 = cOf(r1), c2 = cOf(r2);
    var m1 = 1, m2 = 1;
    if (c1 % c2 === 0) { m2 = -c1 / c2; }
    else if (c2 % c1 === 0) { m1 = -c2 / c1; }
    else { var L = lcm(c1, c2); m1 = L / Math.abs(c1); m2 = -(c1 * m1) / c2; }

    /* Shape B with the multiplier on the FIRST row: swap the rows so the
       student is always asked about "the second equation". */
    if (m1 !== 1 && m2 === 1) {
        var tr = r1; r1 = r2; r2 = tr;
        c1 = cOf(r1); c2 = cOf(r2);
        m1 = 1; m2 = -c1 / c2;
    }

    var s1 = { a: cleanNum(r1.a * m1), b: cleanNum(r1.b * m1), d: cleanNum(r1.d * m1) };
    var s2 = { a: cleanNum(r2.a * m2), b: cleanNum(r2.b * m2), d: cleanNum(r2.d * m2) };
    var sumA = cleanNum(s1.a + s2.a), sumB = cleanNum(s1.b + s2.b), sumD = cleanNum(s1.d + s2.d);
    var otherCoefSum = otherVar === 'x' ? sumA : sumB;
    var otherVal = otherVar === 'x' ? p.x : p.y;
    var elimVal = elimVar === 'x' ? p.x : p.y;

    var eq1Str = fmtEq(r1.a, r1.b, dvX, dvY, r1.d);
    var eq2Str = fmtEq(r2.a, r2.b, dvX, dvY, r2.d);
    var steps = [];
    var shape = (m1 === 1 && m2 === 1) ? 'A' : (m1 === 1 ? 'B' : 'C');

    if (shape === 'A') {
        steps.push({
            kind: 'note',
            label: 'Eliminate ' + elimVar,
            question: 'Let\'s get rid of the ' + elimVar + ' variable. The coefficients of the ' + elimVar + '-terms are ' +
                withSign(c1) + ' and ' + withSign(c2) +
                ' &mdash; already opposites, so neither equation has to be multiplied by anything. We can add them exactly as they are.',
            resultEquation: 'Get rid of ' + elimVar + ': the coefficients ' + withSign(c1) + ' and ' + withSign(c2) + ' are already opposites'
        });
    } else if (shape === 'B') {
        steps.push({
            kind: 'number',
            label: 'Get rid of ' + elimVar,
            question: 'Let\'s get rid of the ' + elimVar + ' variable. The ' + elimVar + '-coefficient is ' + c1 +
                ' in the first equation and ' + c2 + ' in the second. What should we multiply the <b>second equation</b> by, in order for the coefficients of the ' +
                elimVar + '-terms to be opposites?',
            correctAnswer: m2,
            hint: c2 + ' \u00d7 (' + m2 + ') = ' + cleanNum(c2 * m2) + ', which is the opposite of ' + c1 + '.',
            resultEquation: 'To get rid of ' + elimVar + ': multiply the second equation by ' + m2
        });
        steps.push({
            kind: 'grid',
            label: 'Rewrite the second equation',
            question: 'Now rewrite the second equation with every term multiplied by ' + m2 +
                '. The first equation is unchanged.',
            hint: 'Multiply every term of the second equation by ' + m2 +
                ' &mdash; the ' + dvX + '-term, the ' + dvY + '-term and the number on the right.',
            rows: [
                { type: 'static', op: '', a: r1.a, b: r1.b, d: r1.d },
                { type: 'input', op: '', key: 'r2', a: s2.a, b: s2.b, d: s2.d,
                  rowName: 'the second equation after multiplying each term by ' + m2,
                  rowShort: 'the second equation' }
            ],
            resultEquation: fmtEq(s2.a, s2.b, dvX, dvY, s2.d)
        });
    } else {
        steps.push({
            kind: 'number',
            label: 'Get rid of ' + elimVar,
            question: 'Let\'s get rid of the ' + elimVar + ' variable. The ' + elimVar + '-coefficients are ' + c1 + ' and ' + c2 +
                ', and neither one divides the other. So we multiply <b>each</b> equation by an appropriate constant, to give ' + elimVar +
                ' opposite coefficients. We will multiply the first equation by ' +
                m1 + '. What should we multiply the <b>second equation</b> by, in order for the coefficients of the ' +
                elimVar + '-terms to be opposites?',
            correctAnswer: m2,
            hint: c1 + ' \u00d7 ' + m1 + ' = ' + cleanNum(c1 * m1) + ', so the second equation needs ' + c2 +
                ' \u00d7 (' + m2 + ') = ' + cleanNum(c2 * m2) + '.',
            resultEquation: 'To get rid of ' + elimVar + ': multiply the first equation by ' + m1 + ' and the second by ' + m2
        });
        steps.push({
            kind: 'grid',
            label: 'Rewrite both equations',
            question: 'Now rewrite both equations: the first multiplied by ' + m1 + ', the second multiplied by ' + m2 + '.',
            hint: 'Multiply every term of each equation, including the number on the right. First equation \u00d7 ' +
                m1 + ', second equation \u00d7 ' + m2 + '.',
            rows: [
                { type: 'input', op: '', key: 'r1', a: s1.a, b: s1.b, d: s1.d,
                  rowName: 'the first equation after multiplying each term by ' + m1,
                  rowShort: 'the first equation' },
                { type: 'input', op: '', key: 'r2', a: s2.a, b: s2.b, d: s2.d,
                  rowName: 'the second equation after multiplying each term by ' + m2,
                  rowShort: 'the second equation' }
            ],
            resultEquation: fmtEq(s1.a, s1.b, dvX, dvY, s1.d) + '   and   ' + fmtEq(s2.a, s2.b, dvX, dvY, s2.d)
        });
    }

    steps.push({
        kind: 'grid',
        label: 'Add the columns',
        question: 'Add the two equations, column by column. The ' + elimVar +
            '-terms are now opposites, so that column adds to zero &mdash; enter 0 for it. That is how the ' +
            elimVar + ' variable disappears.',
        sumLine: true,
        hint: 'Work straight down each column: add the two ' + dvX + '-coefficients, then the two ' + dvY +
            '-coefficients, then the two numbers on the right.',
        rows: [
            { type: 'static', op: '', a: s1.a, b: s1.b, d: s1.d },
            { type: 'static', op: '+', a: s2.a, b: s2.b, d: s2.d },
            { type: 'input', op: '', key: 'sum', a: sumA, b: sumB, d: sumD,
              rowName: 'the sum of the two equations', rowShort: 'the sum' }
        ],
        resultEquation: fmtCoefVar(otherCoefSum, otherVar) + ' = ' + sumD
    });
    steps.push({
        kind: 'number',
        label: 'Solve for ' + otherVar,
        question: 'The ' + elimVar + '-terms cancelled, leaving ' + fmtCoefVar(otherCoefSum, otherVar) + ' = ' + sumD +
            '. Divide both sides by ' + otherCoefSum + '. What is ' + otherVar + '?',
        correctAnswer: otherVal,
        hint: sumD + ' \u00f7 ' + otherCoefSum + ' = ' + otherVal,
        resultEquation: otherVar + ' = ' + otherVal
    });
    steps.push({
        kind: 'number',
        label: 'Substitute back',
        question: 'Substitute ' + otherVar + ' = ' + otherVal + ' into the first equation, ' + eq1Str +
            ', and solve for ' + elimVar + '. What is ' + elimVar + '?',
        correctAnswer: elimVal,
        hint: eq1Str + ' with ' + otherVar + ' = ' + otherVal + ' gives ' + c1 + elimVar + ' = ' + r1.d + ' ' +
            signed(cleanNum(-(otherVar === 'x' ? r1.a : r1.b) * otherVal)) + ', so ' + elimVar + ' = ' + elimVal,
        resultEquation: elimVar + ' = ' + elimVal
    });

    /* The goal is stated ONCE in step 1 but has to stay true for the whole
       problem, so it is also pinned above every step. A student landing on
       step 3 must still be able to see which variable they are getting rid of
       and why they multiplied anything. */
    return { eq1: eq1Str, eq2: eq2Str, steps: steps, x: p.x, y: p.y, shape: shape,
             goal: 'Goal: get rid of the ' + elimVar + ' variable' };
}

/* Renders one guided grid step: static equation rows, optional sum line, and
   input rows whose every coefficient is a box the student fills in. Six
   columns keep the x-terms, the joining sign, the y-terms, the equals signs
   and the constants in straight vertical lines. */
function buildGuidedGridHtml(step) {
    var html = '<div class="eq-grid">';
    step.rows.forEach(function (row) {
        if (row.type === 'input' && step.sumLine) html += '<div class="stack-line" aria-hidden="true"></div>';
        /* Each row is wrapped so it can carry its own accessible name. The
           wrapper uses display:contents, so the six columns still line up in
           one grid while the row exists as a single thing in the
           accessibility tree. A static row is spoken as one equation
           (role="img"); an input row is a named group, so a student hears
           which equation they are filling in before reaching its boxes. */
        if (row.type === 'static') {
            var spoken = (row.op === '+' ? 'plus, ' : '') + speakEquation(fmtEq(row.a, row.b, 'x', 'y', row.d));
            html += '<div class="grid-row" role="img" aria-label="' + escHtml(spoken) + '">';
            html += '<div class="op">' + escHtml(row.op || '') + '</div>';
            html += '<div class="term">' + escHtml(fmtCoefVar(row.a, 'x')) + '</div>';
            html += '<div class="op op-mid">' + (row.b < 0 ? '&minus;' : '+') + '</div>';
            html += '<div class="term">' + escHtml(fmtCoefVar(Math.abs(row.b), 'y')) + '</div>';
            html += '<div class="eqs">=</div>';
            html += '<div class="term">' + escHtml(row.d) + '</div>';
            html += '</div>';
        } else {
            html += '<div class="grid-row" role="group" aria-label="' + escHtml(row.rowName) + '">';
            html += '<div class="op">' + escHtml(row.op || '') + '</div>';
            html += '<div class="term">' + gridBoxHtml(row.key, 'a', row.rowName, 'coefficient of x') + '<span class="var-tag" aria-hidden="true">x</span></div>';
            html += '<div class="op op-mid" aria-hidden="true">+</div>';
            html += '<div class="term">' + gridBoxHtml(row.key, 'b', row.rowName, 'coefficient of y') + '<span class="var-tag" aria-hidden="true">y</span></div>';
            html += '<div class="eqs" aria-hidden="true">=</div>';
            html += '<div class="term">' + gridBoxHtml(row.key, 'd', row.rowName, 'number on the right-hand side') + '</div>';
            html += '</div>';
        }
    });
    html += '</div>';
    return html;
}
function gridBoxHtml(key, part, rowName, partName) {
    var id = 'gb-' + key + '-' + part;
    /* The enclosing row is an aria group carrying the full row name, so the box
       itself only needs to say which term it is. */
    return '<input type="text" inputmode="decimal" class="box-input" id="' + id +
        '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="' +
        escHtml(partName) + '">';
}

/* =====================================================================
   CATEGORY / LEVEL SWITCHING
   ===================================================================== */
var appWarmupRemaining = 0;
var appPhase = 'eq'; // 'eq' (write the equations) -> 'solve' (find x and y)
var eqLocked = {};
/* Which of the two orderings the student's rows were matched against in part 1
   (1 = as generated, 2 = swapped). Pinned on the first successful match and
   reused when part 2 redisplays the equations. */
var eqOrder = null;
function setCategory(cat) {
    category = cat;
    document.querySelectorAll('.method-btn').forEach(function (btn, idx) {
        var order = ['sub', 'elim', 'app'];
        var isActive = order[idx] === cat;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
    level = 0;
    streak = 0;
    stopTimer();
    /* Set the Applications category BEFORE the row is drawn. Drawing first left
       the highlight on whatever category was selected last time, so the button
       marked as chosen was not the one actually generating problems. */
    if (cat === 'elim') resetTypeProgress(cat);
    if (cat === 'app') { appCategory = APP_CATEGORIES[0].key; resetMixedQueue(); }
    renderLevelButtons();
    generateProblem();
    updateDisplay();
}
function setLevel(newLevel) {
    level = newLevel;
    document.querySelectorAll('.level-btn').forEach(function (btn, idx) {
        var isActive = idx === newLevel;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
    streak = 0;
    stopTimer();
    if (newLevel === 0) resetTypeProgress(category);
    if (newLevel === 1 && category === 'elim') elimCombinedCount = 0;
    generateProblem();
    updateDisplay();
}
function resetTypeProgress(cat) {
    typeProgress[cat] = { 1: mkProg(), 2: mkProg(), 3: mkProg() };
}
function renderLevelButtons() {
    var container = document.getElementById('level-btns');
    if (category === 'app') {
        container.style.display = 'flex';
        container.setAttribute('aria-label', 'Word problem type');
        var ahtml = '';
        APP_CATEGORIES.forEach(function (c) {
            var on = c.key === appCategory;
            ahtml += '<button class="level-btn' + (on ? ' active' : '') + '" aria-pressed="' + (on ? 'true' : 'false') +
                '" onclick="setAppCategory(\'' + c.key + '\')">' + escHtml(c.label) + '</button>';
        });
        container.innerHTML = ahtml;
        return;
    }
    if (category !== 'elim') { container.innerHTML = ''; container.style.display = 'none'; return; }
    container.style.display = 'flex';
    container.setAttribute('aria-label', 'Difficulty level');
    var labels = LEVEL_LABELS[category];
    var html = '';
    for (var i = 0; i < labels.length; i++) {
        html += '<button class="level-btn' + (i === level ? ' active' : '') + '" aria-pressed="' + (i === level ? 'true' : 'false') + '" onclick="setLevel(' + i + ')">' + labels[i] + '</button>';
    }
    container.innerHTML = html;
}
function setAppCategory(key) {
    appCategory = key;
    streak = 0;
    stopTimer();
    /* The old four-problem rectangle warm-up is retired: Applications now opens
       on Rectangles anyway, and inside Mixed the opening deck does the same job
       without handing a student four of one type in a row. */
    resetMixedQueue();
    renderLevelButtons();
    generateProblem();
    updateDisplay();
}

/* =====================================================================
   PROBLEM GENERATION DISPATCH
   ===================================================================== */
var GEN_MAP = {
    elim: { 1: genElimCombined_, 2: genElim3_ }
};
/* Level 0's three patterns, in teaching order. Pattern 1 is now the guaranteed
   already-opposites generator, so the two problems a student owes that cup are
   both genuinely "just add" -- matching the cup's own label. */
var GUIDED_GEN_MAP = {
    elim: { 1: genElimOpposites_, 2: genElim2_, 3: genElim3_ }
};
function pickLevel0Type(cat) {
    var tp = typeProgress[cat];
    var order = [1, 2, 3];
    for (var pass = 0; pass < 2; pass++) {
        for (var i = 0; i < order.length; i++) {
            var t = order[i];
            var reqOk = tp[t].completed < tp[t].required;
            var shownOk = pass === 0 ? tp[t].shown < 3 : true;
            if (reqOk && shownOk) return t;
        }
    }
    return null; // all complete
}
function generateProblem() {
    problemToken++;
    xLocked = false; yLocked = false;
    scaffoldStepIndex = 0; solutionRevealed = 0; revealUsed = false;
    document.getElementById('hint').style.display = 'none';
    document.getElementById('answer-box').style.display = 'none';
    document.getElementById('solution-box').style.display = 'none';
    document.getElementById('next-problem-area').innerHTML = '';
    document.getElementById('helper-buttons').style.display = 'block';

    if (category === 'app') {
        currentProblem = genApp_();
        currentScaffold = null;
        appPhase = 'eq';
        eqLocked = { a1: false, b1: false, c1: false, a2: false, b2: false, c2: false };
        eqOrder = null;
        appContextShown[currentProblem.appType] = (appContextShown[currentProblem.appType] || 0) + 1;
        renderApp();
    } else if (category === 'sub') {
        currentProblem = genWithRetry(genSub1_);
        currentScaffold = null;
        renderPractice();
    } else if (level === 0) {
        var t = pickLevel0Type(category);
        if (t === null) { showLevel0Complete(); return; }
        typeProgress[category][t].shown++;
        var p = genWithRetry(GUIDED_GEN_MAP[category][t]);
        currentProblem = p;
        currentScaffold = buildGuidedSteps(p);
        renderGuided();
    } else {
        var p2 = genWithRetry(GEN_MAP[category][level]);
        currentProblem = p2;
        currentScaffold = null;
        renderPractice();
    }
    document.getElementById('feedback').textContent = '';
}
/* IRA, 2026-09-16 - the credit rule, one place, for every mode:
   a problem is recorded EXACTLY ONCE, at the moment it is finished.
   Wrong tries cost nothing anywhere - not in practice, not on a guided step,
   not in the equation half of a word problem. Neither does a hint, guided mode
   included. These systems are hard and the point is to keep the student
   working. Only Show Answer and Show Solution withhold the credit, and they do
   it by setting revealUsed, which the completion handlers read; a student who
   reveals and types the answer back is booked as an attempt without credit, so
   the old 1/1 loophole stays shut. Nothing books a stat in here: booking on the
   reveal AND again on completion counted one problem twice. */
function chargeReveal() {
    revealUsed = true;
    streak = 0;
    stopTimer();
    updateDisplay();
}

/* Converts an equation string like "-3x + 5y = 12" into words a screen reader
   speaks correctly, e.g. "negative 3 x plus 5 y equals 12". */
function speakEquation(s) {

    // Leading sign first, before any other minus handling.
    out = out.replace(/^-/, 'negative ');
    // Binary operators (spaces around them in every generated equation).
    out = out.replace(/\s*=\s*/g, ' equals ');
    out = out.replace(/\s+\+\s*/g, ' plus ');
    out = out.replace(/\s+-\s*/g, ' minus ');
    // A minus straight after "equals" is a sign on the constant, not an operation.
    out = out.replace(/equals\s+minus\s+/g, 'equals negative ');
    // Any remaining hyphen is a sign attached directly to a term, e.g. "-4y".
    out = out.replace(/-/g, 'negative ');
    // Separate coefficient from variable so "4x" is not read as one token.
    out = out.replace(/(\d)([A-Za-z])/g, '$1 $2');
