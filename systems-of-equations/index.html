        if (!el) return;
        if (eqLocked[f]) { correctCount++; return; }
        var val = parseNum(el.value);
        if (!isNaN(val) && isClose(val, targets[f])) {
            eqLocked[f] = true;
            lockInput(el, targets[f]);
            correctCount++;
        } else {
            el.classList.remove('box-error');
            void el.offsetWidth;
            el.classList.add('box-error');
            el.setAttribute('aria-invalid', 'true');
            wrongNames.push(EQ_NAMES[f]);
            if (isSignSlip(val, targets[f])) appSignSlip = true;
            if (!firstWrong) firstWrong = el;
        }
    });
    if (correctCount === fields.length) {
        /* No stat here. A word problem is ONE problem: it is booked once, when
           the system is finally solved in part 2. Booking part 1 as well made a
           single word problem cost two entries in the cup, and a slip while
           writing the equations then read as 1 of 2 even though the student
           went on to solve it. */
        /* Design item 7: this fired a burst on part 1 of every single word
           problem. Milestones only - the streak burst after part 2 covers it. */
        setFeedback('Both equations are correct. Now solve the system.', 'correct');
        var appTok = problemToken;
        setTimeout(function () {
            if (appTok !== problemToken || category !== 'app') return;
            appPhase = 'solve';
            /* The reveal boxes live outside #main-content, so they survive the
               redraw. A hint opened during part 1 was staying on screen through
               part 2 still showing part 1's advice -- telling a student how to
               write equations they had already written. Each part gets its own
               help. */
            closeRevealBoxes();
            renderApp();
            document.getElementById('feedback').textContent = '';
        }, 1100);
    } else {
        /* A wrong equation costs nothing but another try. */
        setFeedback(correctCount + ' of 6 correct. Take another look at ' + listPhrase(wrongNames) + '.' +
            (appSignSlip ? SIGN_NUDGE : ''), 'incorrect');
        if (firstWrong) { firstWrong.focus(); firstWrong.select(); }
    }
}
function closeRevealBoxes() {
    ['hint', 'answer-box', 'solution-box'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.style.display = 'none';
    });
}
function toggleSignOf(id) {
    var el = document.getElementById(id);
    if (!el || isLocked(el)) return;
    el.value = el.value.charAt(0) === '-' ? el.value.slice(1) : '-' + el.value;
    el.focus();
}

/* =====================================================================
   ANSWER CHECKING -- Level 0 guided steps
   ===================================================================== */
function checkGuidedStep() {
    var input = document.getElementById('step-answer');
    var val = parseNum(input.value);
    var feedback = document.getElementById('feedback');
    if (isNaN(val)) { feedback.textContent = 'Enter a number.'; feedback.className = 'feedback partial'; return; }
    var step = currentScaffold.steps[scaffoldStepIndex];
    if (isClose(val, step.correctAnswer)) {
        scaffoldStepIndex++;
        feedback.textContent = pick(['Correct!', 'Nice!', 'Got it!', 'Yes!']);
        feedback.className = 'feedback correct';
        if (scaffoldStepIndex >= currentScaffold.steps.length) {
            showGuidedProblemComplete();
        } else {
            var tok = problemToken;
            setTimeout(function () {
                if (tok !== problemToken || !currentScaffold || scaffoldStepIndex >= currentScaffold.steps.length) return;
                renderGuided();
                document.getElementById('feedback').textContent = '';
            }, 1100);
        }
    } else {
        typeProgress[category][currentProblem.level].errors++;
        /* A wrong step no longer costs the problem its credit - it only breaks
           the streak, which starts again from this problem's completion. */
        streak = 0;
        feedback.textContent = 'That is not correct. Try again' + HELP_POINTER_GUIDED +
            (isSignSlip(val, step.correctAnswer) ? SIGN_NUDGE : '');
        feedback.className = 'feedback incorrect';
        input.select();
    }
    updateDisplay();
}

/* =====================================================================
   ANSWER CHECKING -- dual x/y practice & application problems
   ===================================================================== */
function recordStat(cat, subKey, isFirstTry) {
    var bucket = subKey === null ? stats[cat] : stats[cat][subKey];
    if (!bucket) return;
    bucket.t++;
    if (isFirstTry) bucket.c++;
    saveState();
}
function currentStatKey() {
    if (category === 'app') return { cat: 'app', key: currentProblem.appType };
    if (category === 'sub') return { cat: 'sub', key: null };
    /* Guided is level 0, and stats.elim has no bucket 0 - a stat written there
       is silently discarded by recordStat. Guided work belongs to the practice
       level that teaches the same pattern, which is what guidedStatBucket maps. */
    if (isGuidedMode()) return { cat: category, key: guidedStatBucket(currentProblem ? currentProblem.level : 1) };
    return { cat: category, key: level };
}
/* Checks ONE variable, on its own, against its own target.
   Deliberately gentle: a wrong value costs nothing at all -- no stat miss, no
   broken streak, no spent chance, no forced reveal. Solving a system is a
   chain, so a slip on the first variable guarantees the second is wrong too;
   punishing that twice teaches nothing. Only chargeReveal() (Show Answer,
   Show Solution, Skip) withholds credit. The problem is judged once, when the
   second variable finally locks. */
/* A box holding a confirmed-correct value is locked with readOnly rather than
   disabled. A disabled input drops out of the tab order and most screen
   readers skip it, so a student using one could never go back and hear the
   answers they had already established -- exactly the values they need when
   substituting back. readOnly keeps it focusable and readable while still
   refusing edits. */
function lockInput(el, value) {
    if (!el) return;
    el.value = value;
    el.readOnly = true;
    el.setAttribute('aria-readonly', 'true');
    el.classList.remove('box-error');
    el.removeAttribute('aria-invalid');
    el.classList.add('locked-correct');
}
function isLocked(el) { return !!el && (el.readOnly || el.disabled); }
function varTarget(which) {
    return which === 'x' ? currentProblem.x : currentProblem.y;
}
function varSpokenName(which) {
    var p = currentProblem;
    if (category === 'app') return which === 'x' ? p.xLabel : p.yLabel;
    return which;
}
function checkOneVar(which) {
    var input = document.getElementById(which + '-input');
    if (!input || isLocked(input)) return;
    var status = document.getElementById(which + '-status');
    var target = varTarget(which);
    var name = varSpokenName(which);
    var raw = input.value.trim();

    if (raw === '') {
        input.classList.remove('box-error');
        input.removeAttribute('aria-invalid');
        if (status) { status.textContent = ''; status.className = 'var-status'; }
        setFeedback('Enter a value for ' + name + ' first.', 'partial');
        input.focus();
        return;
    }
    var val = parseNum(raw);
    if (isNaN(val)) {
        markVarWrong(which, input, status);
        setFeedback('That is not a number I can read. Enter a plain number or a fraction such as 3/4 for ' + name + '.', 'incorrect');
        return;
    }
    if (isClose(val, target)) {
        lockInput(input, target);
        if (which === 'x') xLocked = true; else yLocked = true;
        var cb = document.getElementById(which + '-check');
        if (cb) cb.style.display = 'none';
        if (status) { status.textContent = 'Correct'; status.className = 'var-status ok'; }
        if (xLocked && yLocked) {
            completeDualProblem();
        } else {
            var other = which === 'x' ? 'y' : 'x';
            setFeedback(name + ' is correct. Now find ' + varSpokenName(other) + '.', 'correct');
            var oi = document.getElementById(other + '-input');
            if (oi && !isLocked(oi)) oi.focus();
        }
    } else {
        markVarWrong(which, input, status);
        setFeedback('The ' + name + ' value is not correct. Try again' + HELP_POINTER +
            (isSignSlip(val, target) ? SIGN_NUDGE : ''), 'incorrect');
    }
    updateDisplay();
}
function markVarWrong(which, input, status) {
    input.classList.remove('box-error');
    /* Restart the shake: removing and re-adding in one frame is a no-op. */
    void input.offsetWidth;
    input.classList.add('box-error');
    input.setAttribute('aria-invalid', 'true');
    if (status) { status.textContent = 'Try again'; status.className = 'var-status no'; }
    input.focus();
    input.select();
}
/* Both variables are in and both are right. This is the ONLY place a dual
   problem is scored. */
function completeDualProblem() {
    var sk = currentStatKey();
    recordStat(sk.cat, sk.key, !revealUsed);
    if (revealUsed) streak = 0; else streak++;
    celebrateStreak(streak);
    setFeedback(pick(['Correct!', 'Excellent!', 'Nailed it!', 'Perfect!', 'Great work!']) +
        ' ' + varSpokenName('x') + ' = ' + currentProblem.x + ', ' + varSpokenName('y') + ' = ' + currentProblem.y + '.', 'correct');
    showNextProblemButton();
    updateDisplay();
}
/* Focuses an "advance" button without letting the key press that created it
   activate it. A button that is focused inside a keydown handler receives the
   rest of that same Enter, fires, and skips the screen the student was meant to
   read -- the "Correct!" line, or the guided panel listing the steps just
   completed. preventDefault in the input handlers stops the usual path; this
   guard is the belt to that pair of braces, and also covers a stray repeat from
   a held key. Focus still moves immediately, so keyboard flow is unchanged. */
function armAdvanceButton(btn, go) {
    if (!btn) return;
    var armed = false;
    btn.onclick = function () { if (armed) go(); };
    setTimeout(function () { armed = true; }, 300);
    btn.focus();
}
function advanceToNextProblem() { problemCount++; generateProblem(); updateDisplay(); }
function showNextProblemButton() {
    document.getElementById('helper-buttons').style.display = 'none';
    var area = document.getElementById('next-problem-area');
    area.innerHTML = '<button class="submit-btn">Next Problem</button>';
    armAdvanceButton(area.querySelector('button'), advanceToNextProblem);
}
/* =====================================================================
   HINT / ANSWER / SOLUTION (practice levels 1-3 and applications)
   ===================================================================== */
var PRACTICE_HINTS = {
    sub: 'One equation already tells you a variable in terms of the other. Substitute that whole expression into the other equation, then solve.',
    elim: {
        1: 'Pick the variable you want to get rid of and look at its coefficients in the two equations. If they are already opposites, add the equations as they are. Otherwise, multiply one equation by an appropriate constant so that the variable you are getting rid of has opposite coefficients, then add the two equations.',
        2: 'Multiply each equation by an appropriate constant so that the variable you are trying to get rid of will have opposite coefficients. Then add the two equations.'
    }
};
function buildHintText() {
    if (category === 'app') {
        var p = currentProblem;
        var dvX = p.varX || 'x', dvY = p.varY || 'y';
        if (appPhase === 'eq') {
            return 'Read the given problem carefully: one fact gives a simple total (count or sum), and the other fact involves the individual values, rates, or prices. Turn each fact into its own equation using ' + dvX + ' and ' + dvY + '.';
        }
        return 'Write two equations from the given problem: ' + fmtEq(p.a1, p.b1, dvX, dvY, p.d1) + '  and  ' + fmtEq(p.a2, p.b2, dvX, dvY, p.d2) + '. Then solve using substitution or elimination.';
    }
    if (category === 'sub') return PRACTICE_HINTS.sub;
    return PRACTICE_HINTS.elim[level];
}
function toggleHint() {
    var box = document.getElementById('hint');
    if (box.style.display === 'none') {
        /* IRA, 2026-09-16: the hint is free everywhere now, guided mode
           included. It does print the step's answer there, but a student who
           needed that nudge and then finished the problem has still done the
           work, and this game is hard enough that the encouragement is worth
           more than the precision of the statistic. */
        var text = isGuidedMode() ? currentScaffold.steps[scaffoldStepIndex].hint : buildHintText();
        box.className = 'hint-box';
        box.innerHTML = '<b>Hint:</b> ' + text;
        box.style.display = 'block';
    } else box.style.display = 'none';
}
function toggleAnswer() {
    var box = document.getElementById('answer-box');
    if (box.style.display === 'none') {
        chargeReveal();
        box.className = 'answer-box';
        if (category === 'app' && appPhase === 'eq') {
            var p = currentProblem;
            var dvX = p.varX || 'x', dvY = p.varY || 'y';
            var e1 = fmtEq(p.a1, p.b1, dvX, dvY, p.d1), e2 = fmtEq(p.a2, p.b2, dvX, dvY, p.d2);
            box.innerHTML = '<b>Answer:</b> <span class="reveal-val" aria-hidden="true">' + e1 + ' &nbsp; and &nbsp; ' + e2 + '</span>' +
                '<span class="sr-only">' + escHtml(speakEquation(e1)) + ', and ' + escHtml(speakEquation(e2)) + '</span>';
        } else {
            box.innerHTML = '<b>Answer:</b> <span class="reveal-val">x = ' + currentProblem.x +
                ', &nbsp; y = ' + currentProblem.y + '</span>';
        }
        box.style.display = 'block';
    } else box.style.display = 'none';
}
var currentSolutionLines = null; // [{label, eq}, ...] for the currently displayed problem
var currentSolutionStart = null; // [eq1Str, eq2Str] shown as "Start with:"
function toggleSolution() {
    var box = document.getElementById('solution-box');
    if (box.style.display === 'none') {
        chargeReveal();
        var p = currentProblem;
        var scaffold = category === 'sub' ? buildSubScaffold(p) : category === 'app' ? buildAppScaffold(p) : buildElimScaffold(p);
        currentSolutionStart = [scaffold.eq1, scaffold.eq2];
        currentSolutionLines = scaffold.steps.map(function (st) {
            return { label: st.solutionLabel || st.label || 'Next step', eq: st.resultEquation, detail: st.solutionDetail || null };
        });
        solutionRevealed = 1;
        renderSolutionBox();
    } else box.style.display = 'none';
}
function showNextSolutionStep() {
    solutionRevealed++;
    renderSolutionBox();
}
function renderSolutionBox() {
    var box = document.getElementById('solution-box');
    var total = currentSolutionLines.length;
    var shown = Math.min(solutionRevealed, total);
    var html = '<div style="font-weight:800;margin-bottom:8px;">Step-by-Step Solution (' + shown + ' of ' + total + ')</div>';
    html += '<div style="font-size:13px;">Start with:</div>';
    html += '<div class="eq-pair" style="margin:6px 0 10px;">' +
        '<div class="equation" role="img" aria-label="' + escHtml(speakEquation(currentSolutionStart[0])) + '" style="font-size:16px;padding:8px 10px;">' + currentSolutionStart[0] + '</div>' +
        '<div class="equation" role="img" aria-label="' + escHtml(speakEquation(currentSolutionStart[1])) + '" style="font-size:16px;padding:8px 10px;">' + currentSolutionStart[1] + '</div></div>';
    for (var i = 0; i < shown; i++) {
        html += '<div style="padding:8px 0 4px;border-top:1px dashed rgba(0,0,0,0.15);">';
        html += '<div><b>' + (i + 1) + '.</b> ' + currentSolutionLines[i].label + ':</div>';
        if (currentSolutionLines[i].detail) {
            html += currentSolutionLines[i].detail;
            html += '<div style="font-size:13px;margin:2px 0 4px 4px;">which gives:</div>';
        }
        html += '<div style="font-family:\'Consolas\',\'SF Mono\',\'Menlo\',monospace;font-weight:bold;font-size:16px;margin:5px 0 4px 18px;color:#1e2a5e;">' + currentSolutionLines[i].eq + '</div>';
        html += '</div>';
    }
    if (shown < total) {
        html += '<div style="text-align:center;margin-top:10px;"><button class="submit-btn" onclick="showNextSolutionStep()">Next Step</button></div>';
    } else {
        html += '<div style="text-align:center;margin-top:10px;font-weight:800;color:#047857;">That\'s the complete solution.</div>';
    }
    box.className = 'solution-box';
    box.innerHTML = html;
    box.style.display = 'block';
}

/* =====================================================================
   TIMER
   ===================================================================== */
function startTimer() {
    if (isTimerRunning) return;
    isTimerRunning = true;
    timerInterval = setInterval(function () {
        timer++;
        var td = document.getElementById('timer-display');
        if (td) td.textContent = 'Time: ' + timer + 's';
    }, 1000);
}
function stopTimer() {
    isTimerRunning = false;
    if (timerInterval) clearInterval(timerInterval);
    timer = 0;
    var td = document.getElementById('timer-display');
    if (td) td.textContent = '';
}

/* =====================================================================
   DISPLAY / STATS / PERSISTENCE
   ===================================================================== */
function updateDisplay() {
    var info = document.getElementById('info-bar');
    if (category === 'app') {
        info.innerHTML = '';
        return;
    }
    var html = '<div class="info-item">Problem: ' + (problemCount + 1) + '</div>';
    if (!isGuidedMode()) {
        html += '<div class="info-item' + (streak >= 5 ? ' hot' : '') + '">Streak: ' + streak + '</div>';
        html += '<div class="info-item" id="timer-display">Time: ' + timer + 's</div>';
        /* The "Chances" counter is gone. Wrong answers no longer cost anything,
           so a counter frozen at 2 would only imply a penalty that cannot
           happen. Retries are unlimited and the feedback line says so. */
    }
    info.innerHTML = html;
    if (streak === 1 && !isGuidedMode()) startTimer();
}
function showStats() {
    // Bumping the token invalidates any in-flight advance timer, so a queued
    // renderGuided()/renderApp() cannot paint a problem over the open panel.
    problemToken++;
    stopTimer();
    var html = '<div class="stats-panel"><h3 style="text-align:center;color:#1e2a5e;">Your Progress</h3>';
    function row(name, s) {
        // Coerce to numbers at the render boundary: these values originate from
        // localStorage and are interpolated into innerHTML.
        var t = Number(s && s.t) || 0, c = Number(s && s.c) || 0;
        if (t < 0) t = 0;
        if (c < 0) c = 0;
        if (c > t) c = t;
        var pct = t > 0 ? Math.round((c / t) * 100) : 0;
        var cls = t === 0 ? 'none' : pct >= 80 ? 'good' : pct >= 55 ? 'mid' : 'low';
        /* Design item 11: a mode that was never opened used to read "0/0",
           which looks like failing at it. Say so in words instead - the rule
           forbids implying mastery either way. */
        var num = t === 0 ? 'not tried yet' : c + '/' + t + ' (' + pct + '%)';
        return '<div class="stat-row"><div class="stat-name">' + escHtml(name) + '</div>' +
            '<div class="stat-bar-wrap"><div class="stat-bar ' + cls + '" style="width:' + pct + '%"></div></div>' +
            '<div class="stat-num">' + escHtml(num) + '</div></div>';
    }
    /* The panel had no overall/summary row; one is added here so the same
       "not tried yet" rule covers the top-line figure too. */
    function overallRow() {
        var t = 0, c = 0;
        [stats.sub, stats.elim[1], stats.elim[2], stats.app.countValue,
         stats.app.rectangle, stats.app.investment, stats.app.coins].forEach(function (s) {
            var st = Number(s && s.t) || 0, sc = Number(s && s.c) || 0;
            if (st < 0) st = 0;
            if (sc < 0) sc = 0;
            if (sc > st) sc = st;
            t += st; c += sc;
        });
        return row('All modes', { c: c, t: t });
    }
    html += '<div style="margin:10px 0 4px;font-weight:800;color:#2e3d8f;font-size:13px;">Substitution</div>';
    html += row('Direct Substitution', stats.sub);
    html += '<div style="margin:14px 0 4px;font-weight:800;color:#2e3d8f;font-size:13px;">Elimination</div>';
    html += row('Level 1', stats.elim[1]) + row('Level 2', stats.elim[2]);
    html += '<div style="margin:14px 0 4px;font-weight:800;color:#2e3d8f;font-size:13px;">Applications</div>';
    html += row('Count/Value', stats.app.countValue) + row('Rectangle', stats.app.rectangle) + row('Investment', stats.app.investment) + row('Coins', stats.app.coins);
    html += '<div style="margin:14px 0 4px;font-weight:800;color:#2e3d8f;font-size:13px;">Overall</div>';
    html += overallRow();
    html += '<div style="text-align:center;margin-top:16px;"><button class="submit-btn" onclick="hideStats()">Back to Practice</button> ' +
        '<button class="reset-btn" onclick="confirmReset()" id="reset-btn" style="margin-left:8px;">Reset Stats</button></div></div>';
    document.getElementById('main-content').innerHTML = html;
    document.getElementById('progress-display').innerHTML = '';
    document.getElementById('feedback').textContent = '';
    document.getElementById('helper-buttons').style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    document.getElementById('answer-box').style.display = 'none';
    document.getElementById('solution-box').style.display = 'none';
}
function hideStats() { generateProblem(); updateDisplay(); }
var resetArmed = false, resetTimer2 = null;
function confirmReset() {
    var btn = document.getElementById('reset-btn');
    if (!resetArmed) {
        resetArmed = true;
        btn.textContent = 'Tap again to confirm';
        resetTimer2 = setTimeout(function () { resetArmed = false; btn.textContent = 'Reset Stats'; }, 4000);
        return;
    }
    clearTimeout(resetTimer2);
    resetArmed = false;
    stats = {
        sub: { c: 0, t: 0 },
        elim: { 1: { c: 0, t: 0 }, 2: { c: 0, t: 0 } },
        app: { countValue: { c: 0, t: 0 }, rectangle: { c: 0, t: 0 }, investment: { c: 0, t: 0 }, coins: { c: 0, t: 0 } }
    };
    problemCount = 0; streak = 0;
    clearSavedState();
    showStats();
}
function saveState() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ stats: stats }));
    } catch (e) { /* storage unavailable */ }
}
/* Rebuilds the stats object from untrusted localStorage, keeping only known
   keys and coercing every value to a finite non-negative integer. Without this,
   a tampered storage entry could inject markup through the stats panel's
   innerHTML. */
function sanitizeStats(raw) {
    function cell(v) {
        var src = (v && typeof v === 'object') ? v : {};
        function num(n) {
            n = Number(n);
            if (!isFinite(n) || n < 0) return 0;
            return Math.floor(n);
        }
        var t = num(src.t);
        var c = num(src.c);
        if (c > t) c = t; // correct can never exceed total
        return { c: c, t: t };
    }
    var src = (raw && typeof raw === 'object') ? raw : {};
    var srcElim = (src.elim && typeof src.elim === 'object') ? src.elim : {};
    var srcApp = (src.app && typeof src.app === 'object') ? src.app : {};
    return {
        sub: cell(src.sub),
        elim: { 1: cell(srcElim[1]), 2: cell(srcElim[2]) },
        app: {
            countValue: cell(srcApp.countValue),
            rectangle: cell(srcApp.rectangle),
            investment: cell(srcApp.investment),
            coins: cell(srcApp.coins)
        }
    };
}
function loadState() {
    try {
        var raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        var data = JSON.parse(raw);
        stats = sanitizeStats(data && data.stats);
    } catch (e) {
        stats = sanitizeStats(null); // corrupt or hostile state -> clean slate
    }
}
function clearSavedState() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
}

/* =====================================================================
   INIT
   ===================================================================== */
loadState();
loadConfettiSetting();
syncConfettiSwitch();
renderLevelButtons();
generateProblem();
updateDisplay();
</script>
