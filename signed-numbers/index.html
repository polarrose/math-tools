<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signed Numbers Practice</title>
<meta name="theme-color" content="#1b2450">
<meta name="referrer" content="no-referrer">
<!-- Locks the page to its own inline code plus the Google Fonts stylesheet:
     no external scripts, frames, or form posts can be introduced. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    /* ===== MIDNIGHT SCHOLAR - navy stage, white card, violet + mint accents ===== */
    * { box-sizing: border-box; }
    body {
        font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
        background:
            radial-gradient(900px 500px at 85% -10%, rgba(124, 58, 237, 0.28), transparent 60%),
            radial-gradient(800px 500px at -10% 110%, rgba(16, 185, 129, 0.18), transparent 55%),
            linear-gradient(160deg, #141b3d 0%, #1b2450 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px 12px;
        margin: 0;
    }
    .card {
        background: #ffffff;
        border-radius: 22px;
        box-shadow: 0 24px 60px rgba(8, 12, 40, 0.55);
        max-width: 700px;
        width: 100%;
        padding: 30px 24px 26px;
        position: relative;
        overflow: hidden;
    }
    .card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 6px;
        background: linear-gradient(90deg, #2e3d8f, #7c3aed, #10b981);
    }
    /* The heading box shrinks to its text so the rule below can match it. */
    h1 {
        text-align: center;
        color: #1e2a5e;
        margin: 4px auto 6px;
        font-size: 25px;
        letter-spacing: 0.3px;
        width: fit-content;
        max-width: 100%;
    }
    /* The gradient rule is exactly as wide as the title text. */
    h1::after {
        content: '';
        display: block;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        margin: 8px auto 14px;
        background: linear-gradient(90deg, #2e3d8f, #7c3aed, #10b981);
    }
    .info {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }
    .info-item {
        font-size: 12px;
        font-weight: 800;
        background: #eef0fb;
        color: #2e3d8f;
        padding: 6px 14px;
        border-radius: 999px;
    }
    /* White on #10b981 is 2.54:1. Darkened to #047857 (5.48:1) wherever
       white text sits on mint; mint stays for rings, bars and borders. */
    .info-item.streak-hot {
        background: linear-gradient(135deg, #047857, #2e3d8f);
        color: white;
    }
    .mode-btns {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 18px;
        flex-wrap: wrap;
    }
    .mode-btn {
        background: #e6e9f6;
        color: #4a5480;
        border: none;
        border-radius: 999px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.15s;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
    }
    .mode-btn:hover { background: #d9def2; }
    .mode-btn.active {
        background: #047857 !important;   /* was #10b981 - white text was 2.54:1 */
        color: white !important;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25), 0 6px 14px rgba(16, 185, 129, 0.35);
    }
    .mode-btn.mixed {
        background: linear-gradient(135deg, #2e3d8f, #7c3aed);
        color: white;
    }
    .mode-btn.mixed:hover { filter: brightness(1.1); }
    .mode-btn.mixed.active {
        /* both stops carry white text: #047857 = 5.48:1, #065f46 = 7.68:1 */
        background: linear-gradient(135deg, #047857, #065f46) !important;
    }
    .problem {
        font-size: 34px;
        font-weight: 800;
        text-align: center;
        margin: 18px auto;
        font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
        color: #1e2a5e;
        background: #eef0fb;
        border: 2px solid #c7cdf0;
        border-radius: 14px;
        padding: 22px 14px;
        max-width: 100%;
        overflow-wrap: break-word;
        letter-spacing: 1px;
    }
    /* Design item 5: negatives used to be red #b91c1c. In the one game whose
       whole subject is negative numbers that made every CORRECT value look
       like a mistake. Ink navy was not usable here - .problem's own colour is
       already #1e2a5e, so navy negatives would be literally indistinguishable
       from the rest of the equation - so the sanctioned alternative, violet
       #7c3aed, is used (5.02:1 on the #eef0fb chip; needs 3 at 34px/800). */
    .problem .neg { color: #7c3aed; }
    .problem .op-sym { color: #6d28d9; margin: 0 6px; }
    .instructions {
        text-align: center;
        color: #5d6798;   /* #6a74a8 on white is 4.49:1 - just under AA */
        font-size: 14px;
        margin: 6px 0 12px;
    }
    .input-area {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 18px 0;
        flex-wrap: wrap;
    }
    .eq-label {
        font-size: 26px;
        font-weight: 800;
        color: #1e2a5e;
    }
    input[type="text"] {
        width: 110px;
        font-size: 26px;
        font-weight: 800;
        text-align: center;
        padding: 10px;
        border: 3px solid #7c3aed;
        border-radius: 12px;
        color: #1e2a5e;
        background: #ffffff;
        font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
    }
    input[type="text"]:focus {
        outline: none;
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
    }
    button {
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 800;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.15s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        font-family: inherit;
    }
    button:active { transform: scale(0.95); }
    .submit-btn {
        background: linear-gradient(135deg, #2e3d8f, #4b3bbd);
        color: white;
        box-shadow: 0 6px 16px rgba(46, 61, 143, 0.35);
    }
    .submit-btn:hover { filter: brightness(1.1); }
    .key-btn {
        background: #e6e9f6;
        color: #2e3d8f;
        padding: 12px 14px;
        font-size: 16px;
        border-radius: 12px;
    }
    .key-btn:hover { background: #d9def2; }
    .feedback {
        text-align: center;
        font-size: 21px;
        font-weight: 800;
        margin: 12px 0 8px;
        min-height: 32px;
    }
    .feedback:not(:empty) {
        padding: 8px 14px;
        border-radius: 10px;
    }
    .feedback.correct { background: #ecfdf5; border: 2px solid #34d399; }
    /* Sample item S2: incorrect feedback was a red box (#fef2f2 / #fca5a5).
       The system says incorrect feedback is ink navy, never red, so it now
       uses the chip-bg family. The two verdicts stay clearly different: mint
       tint + green text + mint border vs. blue tint + navy text + blue
       border, on top of the wording itself. */
    .feedback.incorrect { background: #eef0fb; border: 2px solid #c7cdf0; }
    .correct { color: #059669; }
    .incorrect { color: #1e2a5e; font-size: 18px; font-weight: 700; }
    .helper-row {
        text-align: center;
        margin: 14px 0 4px;
    }
    .hint-btn, .answer-btn, .skip-btn, .explain-btn, .stats-btn {
        background: #f3eefe;
        color: #6d28d9;
        margin: 4px;
        font-size: 13px;
        padding: 10px 16px;
    }
    .hint-btn:hover, .answer-btn:hover, .skip-btn:hover, .explain-btn:hover, .stats-btn:hover {
        background: #e9defc;
    }
    .stats-btn {
        background: #ecfdf5;
        color: #047857;
    }
    .stats-btn:hover { background: #d1fae5; }
    .hint-box, .answer-box, .explain-box {
        background: #f7f5ff;
        border: 2px solid #d8ccf7;
        border-radius: 14px;
        padding: 15px;
        margin: 14px 0;
        color: #3b3568;
        font-size: 15px;
        line-height: 1.55;
    }
    .hint-box b, .answer-box b, .explain-box b { color: #6d28d9; }
    .explain-box .rewrite {
        text-align: center;
        font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
        font-size: 22px;
        font-weight: 800;
        color: #1e2a5e;
        margin: 12px 0;
    }
    /* #94a3b8 was 2.38:1 even at 22px bold; #64748b is 4.41:1. */
    .explain-box .rewrite .old { color: #64748b; text-decoration: line-through; }
    .explain-box .rewrite .new { color: #059669; }
    .explain-box .rewrite .arrow { color: #7c3aed; margin: 0 10px; }
    .rules-card {
        background: #ffffff;
        border: 2px solid #c7cdf0;
        border-radius: 12px;
        padding: 14px;
        margin: 12px 0 6px;
    }
    .rules-card table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
        font-size: 16px;
    }
    .rules-card td {
        padding: 6px 8px;
        text-align: center;
        border-bottom: 1px solid #eef0fb;
    }
    .rules-card tr:last-child td { border-bottom: none; }
    .rules-card tr.highlight td {
        background: linear-gradient(90deg, rgba(16,185,129,0.15), rgba(124,58,237,0.15));
        font-weight: 800;
        color: #047857;   /* #059669 was 3.77:1 at 16px */
    }
    .rules-card .pos { color: #047857; }   /* was #059669 - 3.77:1 at 16px */
    /* Same ruling as .problem .neg - the sign-rules table is teaching that a
       negative result is a correct result, so it must not be printed in red.
       Violet on white is 5.70:1; the (+)/(-) glyphs still carry the meaning. */
    .rules-card .neg { color: #7c3aed; }
    /* Number line */
    .numline-wrap {
        background: #ffffff;
        border: 2px solid #c7cdf0;
        border-radius: 12px;
        padding: 12px 8px 8px;
        margin: 12px 0 6px;
        overflow-x: auto;
    }
    .numline-svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
    /* Stats view */
    .stats-view {
        background: #eef0fb;
        border: 2px solid #c7cdf0;
        border-radius: 14px;
        padding: 20px 18px;
    }
    .stats-view h2 {
        text-align: center;
        color: #1e2a5e;
        margin: 0 0 10px;
        font-size: 22px;
    }
    .stats-overall {
        text-align: center;
        margin-bottom: 18px;
    }
    .stats-overall .big {
        font-size: 42px;
        font-weight: 800;
        color: #059669;
    }
    .stats-overall .lbl {
        font-size: 13px;
        color: #4a5480;
        font-weight: 700;
    }
    .stat-row {
        background: #ffffff;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .stat-name {
        font-weight: 800;
        color: #2e3d8f;
        font-size: 15px;
        min-width: 88px;
    }
    .stat-bar-wrap {
        flex: 1;
        height: 14px;
        background: #eef0fb;
        border-radius: 7px;
        overflow: hidden;
        position: relative;
    }
    .stat-bar {
        height: 100%;
        border-radius: 7px;
        transition: width 0.4s ease;
    }
    /* Design item 18: the low tier was red (#b91c1c -> #f87171), which tells a
       beginner they are failing. The tiers are now a cool ramp - royal navy,
       then violet, then mint at the top - so the three stay clearly different
       from one another by hue AND lightness without red or orange anywhere.
       The percentage in .stat-num carries the number regardless. */
    .stat-bar.good { background: linear-gradient(90deg, #10b981, #34d399); }
    .stat-bar.mid  { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
    .stat-bar.low  { background: linear-gradient(90deg, #2e3d8f, #8b96d8); }
    .stat-bar.none { background: #d1d5db; }
    .stat-num {
        font-size: 13px;
        color: #4a5480;
        font-weight: 700;
        min-width: 96px;
        text-align: right;
        font-family: 'Consolas', monospace;
    }
    /* Design item 11: an operation the student never attempted said "0/0",
       which reads as a failed topic. The words go in the body font so the
       phrase still fits the reserved width at both breakpoints. */
    .stat-untried {
        font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
        font-weight: 700;
        color: #5d6798;
    }
    .stat-sub {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #5d6798;   /* was #6a74a8 - 3.95:1 on the #eef0fb panel */
        margin: 2px 88px 8px 0;
        padding: 0 14px;
    }
    .recommend {
        background: #f3eefe;
        border-left: 4px solid #7c3aed;
        border-radius: 0 10px 10px 0;
        padding: 12px 14px;
        margin-top: 10px;
        font-size: 14px;
        color: #5b21b6;
    }
    .stats-actions {
        text-align: center;
        margin-top: 16px;
    }
    .reset-btn {
        background: #4a5480;
        color: white;
        font-size: 13px;
        padding: 10px 18px;
    }
    .reset-btn:hover { background: #3c4569; }
    /* ===== Settings row (design item 9: confetti is always paired with a
       toggle, persisted per device) ===== */
    .settings-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 16px 0 0;
        padding-top: 14px;
        border-top: 1px solid #e6e9f6;
    }
    .settings-label { font-size: 13px; font-weight: 700; color: #4a5480; }
    .switch {
        position: relative;
        flex: 0 0 44px;
        width: 44px;
        height: 24px;
        padding: 0;
        border-radius: 999px;
        background: #d5d9e8;
        /* Cross-cutting ruling B: the specified track is 1.41:1 against the
           white card when off and 2.54:1 when on, so the control's own edge
           fails WCAG 1.4.11. A 1px rim fixes that in both states without
           touching the 44x24 geometry or the mint fill:
           #8a93b8 = 3.02:1 off, #0b7a70 = 5.21:1 on. */
        border: 1px solid #8a93b8;
        cursor: pointer;
        transition: background 0.2s;
    }
    .switch-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 3px rgba(8, 12, 40, 0.4);
        transition: transform 0.2s;
    }
    .switch[aria-pressed="true"] { background: #10b981; border-color: #0b7a70; }
    .switch[aria-pressed="true"] .switch-knob { transform: translateX(20px); }

    /* Visually hidden, still read by screen readers */
    .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    /* Confetti */
    .confetti {
        position: fixed;
        opacity: 0;
        pointer-events: none;
        z-index: 9999;
    }
    @keyframes confetti-fall {
        0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 1; }
    }
    @keyframes confetti-fall-slow {
        0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
        100% { transform: translateY(115vh) rotate(1080deg) scale(0.85); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
        .confetti { display: none !important; }
        * { transition-duration: 0.01ms !important; }
    }
    @media (max-width: 480px) {
        .card { padding: 24px 14px 20px; }
        h1 { font-size: 21px; }
        .problem { font-size: 26px; padding: 16px 8px; }
        .mode-btn { padding: 8px 12px; font-size: 12px; }
        input[type="text"] { width: 92px; font-size: 22px; }
        .stat-name { min-width: 74px; font-size: 13px; }
        .stat-num { min-width: 80px; font-size: 11px; }
    }
</style>
</head>
<body>
<main class="card" id="game-card">
    <h1>Signed Numbers Practice</h1>
    <div class="info">
        <div class="info-item">Problem: <span id="problemNum">1</span></div>
        <div class="info-item" id="streak-display">Streak: <span id="streak">0</span></div>
        <div class="info-item" id="acc-display">Accuracy: --</div>
    </div>
    <div class="mode-btns" role="group" aria-label="Operation">
        <button class="mode-btn active" aria-pressed="true" onclick="setMode('add')">Add</button>
        <button class="mode-btn" aria-pressed="false" onclick="setMode('sub')">Subtract</button>
        <button class="mode-btn" aria-pressed="false" onclick="setMode('mul')">Multiply</button>
        <button class="mode-btn" aria-pressed="false" onclick="setMode('div')">Divide</button>
        <button class="mode-btn mixed" aria-pressed="false" onclick="setMode('mix')">Mixed</button>
    </div>
    <div id="main-content"></div>
    <!-- The visual problem is aria-hidden, so this polite region is the only
         thing that announces it; it spells the problem out in words. -->
    <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>
    <div class="feedback" id="feedback" role="status" aria-live="assertive" aria-atomic="true"></div>
    <div id="input-content"></div>
    <div class="helper-row" id="helper-buttons">
        <button class="hint-btn" id="hint-toggle" aria-expanded="false" aria-controls="hint" onclick="toggleHint()">Show Hint</button>
        <button class="explain-btn" id="explain-toggle" aria-expanded="false" aria-controls="explain" onclick="toggleExplanation()">Show Explanation</button>
        <button class="answer-btn" id="answer-toggle" aria-expanded="false" aria-controls="answer-box" onclick="toggleAnswer()">Show Answer</button>
        <button class="skip-btn" onclick="skipProblem()">Skip</button>
        <button class="stats-btn" onclick="showStats()">My Stats</button>
    </div>
    <div id="hint" style="display:none;"></div>
    <div id="explain" style="display:none;"></div>
    <div id="answer-box" style="display:none;"></div>
    <div class="settings-row">
        <span class="settings-label" id="confetti-label">Confetti celebrations</span>
        <button type="button" class="switch" id="confetti-switch" aria-pressed="true"
                aria-label="Confetti celebrations" onclick="toggleConfettiSetting()"><span class="switch-knob" aria-hidden="true"></span></button>
    </div>
<!-- ===== Polar Rose Studio insignia =====================================
     Paste this block immediately BEFORE the closing  </main>  tag.
     Self-contained: its own styles, its own drawing code, no edits needed
     anywhere else in the file. Decorative by design - aria-hidden and
     focusable="false" - so it is seen but never read aloud or tabbed into.
     ===================================================================== -->
<style>
.insignia { display: block; margin: 20px auto 4px; width: 62px; opacity: 0.9; }
.insignia-caption {
    text-align: center;
    font-size: 6.5px;
    letter-spacing: 1.2px;
    color: #5d6798;
    opacity: 0.9;
    margin-top: 2px;
}
</style>
<svg class="insignia" viewBox="-28 -26 56 64" aria-hidden="true" focusable="false" role="presentation">
    <defs>
        <linearGradient id="pr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a5f"/>
            <stop offset="100%" stop-color="#0d9488"/>
        </linearGradient>
    </defs>
    <path id="pr-path" fill="none" stroke="url(#pr-grad)" stroke-width="1.7"/>
</svg>
<div class="insignia-caption" aria-hidden="true">POLAR ROSE STUDIO</div>
<script>
/* r = 2cos(3t/2), t from 0 to 4pi, 240 steps, scaled by 12 for the viewBox. */
(function () {
    var d = '', steps = 240, i, t, r;
    for (i = 0; i <= steps; i++) {
        t = (i / steps) * 4 * Math.PI;
        r = 2 * Math.cos(1.5 * t);
        d += (i === 0 ? 'M ' : 'L ') + (r * Math.cos(t) * 12).toFixed(2)
            + ' ' + (r * Math.sin(t) * 12).toFixed(2) + ' ';
    }
    var el = document.getElementById('pr-path');
    if (el) el.setAttribute('d', d.trim());
})();
</script>
<!-- ===== end insignia ================================================== -->
</main>

<script>
/* =====================================================================
   State
   ===================================================================== */
var mode = 'add';                 // add | sub | mul | div | mix
var currentProblem = null;
var streak = 0;
var bestStreak = 0;
var problemNum = 0;
var missRecorded = false;
// Cross-cutting ruling A: a revealed answer ends the streak, and typing the
// revealed value back in must NOT restart it at 1. Kept separate from
// missRecorded so the existing credit-withholding logic is untouched.
var answerRevealed = false;

// Per-operation stats. Each has:
//   c = correct on first try, t = total attempted
//   sameC/sameT = same-sign sub-stats, diffC/diffT = different-sign sub-stats
var stats = {
    add: { c:0, t:0, sameC:0, sameT:0, diffC:0, diffT:0 },
    sub: { c:0, t:0, sameC:0, sameT:0, diffC:0, diffT:0 },
    mul: { c:0, t:0, sameC:0, sameT:0, diffC:0, diffT:0 },
    div: { c:0, t:0, sameC:0, sameT:0, diffC:0, diffT:0 }
};

var SAVE_KEY = 'signedNumbersGame_v1';

// Locked while a correct answer is on screen and the next problem is
// pending, so extra taps cannot re-grade the same problem.
var locked = false;
var lastSubmitAt = 0;
var TOUCH_DEBOUNCE_MS = 350;
var ADVANCE_MS = 1100;
// Handle for the pending advance. Switching mode, skipping or opening the
// stats view while a correct answer is on screen used to let the old timer
// fire afterwards, clobbering whatever had replaced the problem.
var advanceTimer = null;
function cancelAdvance() {
    if (advanceTimer !== null) { clearTimeout(advanceTimer); advanceTimer = null; }
}
function prefersReducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
var opNames = { add: 'Addition', sub: 'Subtraction', mul: 'Multiplication', div: 'Division' };
var opShortNames = { add: 'Add', sub: 'Subtract', mul: 'Multiply', div: 'Divide' };

/* =====================================================================
   Utilities
   ===================================================================== */
function ri(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }
function nonZero(lo, hi) {
    var n = ri(lo, hi);
    while (n === 0) n = ri(lo, hi);
    return n;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// Format a number for display: negatives get parentheses when they appear
// as the SECOND operand (natural math notation).
function fmtTerm(n, isFirst) {
    if (n < 0 && !isFirst) return '(<span class="neg">' + n + '</span>)';
    if (n < 0) return '<span class="neg">' + n + '</span>';
    return String(n);
}

function opSymbol(op) {
    // HTML entities so encoding never breaks these
    if (op === 'add') return '+';
    if (op === 'sub') return '&minus;';   // U+2212, not U+2013
    if (op === 'mul') return '&times;';
    return '&divide;';
}
function opSymbolPlain(op) {
    // for use inside plain text (no HTML)
    if (op === 'add') return '+';
    if (op === 'sub') return '-';
    if (op === 'mul') return 'x';
    return '/';
}

// Spoken forms for the polite live region. A screen reader reading the raw
// markup would say "open paren minus seven close paren"; these say it the
// way the instructor would.
function spokenNum(v) { return v < 0 ? 'negative ' + Math.abs(v) : String(v); }
function spokenOp(op) {
    if (op === 'add') return ' plus ';
    if (op === 'sub') return ' minus ';
    if (op === 'mul') return ' times ';
    return ' divided by ';
}

/* =====================================================================
   Adaptive picker for Mixed mode
   Weight each op inversely to its accuracy so struggling categories
   come up more often. Early on (few attempts), keep it roughly even.
   ===================================================================== */
function pickAdaptiveOp() {
    var ops = ['add', 'sub', 'mul', 'div'];
    var weights = ops.map(function (o) {
        var s = stats[o];
        if (s.t < 3) return 1.0;
        var acc = s.c / s.t;
        return Math.max(0.2, 1 - acc);
    });
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < ops.length; i++) {
        r -= weights[i];
        if (r <= 0) return ops[i];
    }
    return ops[0];
}

/* =====================================================================
   Problem generation
   ===================================================================== */
function generateProblem() {
    var op = mode === 'mix' ? pickAdaptiveOp() : mode;
    var a, b, answer, sameSign;

    if (op === 'add') {
        a = nonZero(-15, 15);
        b = nonZero(-15, 15);
        answer = a + b;
        sameSign = (a > 0) === (b > 0);
    } else if (op === 'sub') {
        a = nonZero(-15, 15);
        b = nonZero(-15, 15);
        answer = a - b;
        // For subtraction we track "same sign" based on original a and b
        // (the interesting cases: a - (-b) which flips to addition, etc.)
        sameSign = (a > 0) === (b > 0);
    } else if (op === 'mul') {
        a = nonZero(-12, 12);
        b = nonZero(-12, 12);
        answer = a * b;
        sameSign = (a > 0) === (b > 0);
    } else { // div - build from a quotient so the answer is a clean integer
        var q = nonZero(-12, 12);
        b = nonZero(-12, 12);
        a = q * b;
        answer = q;
        sameSign = (a > 0) === (b > 0);
    }

    currentProblem = { op: op, a: a, b: b, answer: answer, sameSign: sameSign };
    missRecorded = false;
    answerRevealed = false;
    locked = false;
    renderProblem();
    // textContent alone left the previous verdict's coloured box behind,
    // because .feedback.correct / .feedback.incorrect are not :empty-gated.
    var fb = document.getElementById('feedback');
    fb.textContent = '';
    fb.className = 'feedback';
    setHelperState('hint', false);
    setHelperState('explain', false);
    setHelperState('answer-box', false);
}

// Keeps a disclosure box and its button's aria-expanded in step.
function setHelperState(boxId, open) {
    var box = document.getElementById(boxId);
    if (box) box.style.display = open ? 'block' : 'none';
    var btnId = boxId === 'answer-box' ? 'answer-toggle' : boxId + '-toggle';
    var btn = document.getElementById(btnId);
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function renderProblem() {
    var p = currentProblem;
    var problemHtml = '';
    // aria-hidden so the announcer is not doubled by the raw glyphs. The
    // box holds no focusable elements, so hiding it is safe.
    problemHtml += '<div class="problem" aria-hidden="true">';
    problemHtml += fmtTerm(p.a, true);
    problemHtml += ' <span class="op-sym">' + opSymbol(p.op) + '</span> ';
    problemHtml += fmtTerm(p.b, false);
    problemHtml += ' = ?</div>';

    var inputHtml = '';
    inputHtml += '<div class="instructions" aria-hidden="true">Enter your answer</div>';
    inputHtml += '<div class="input-area">';
    inputHtml += '<span class="eq-label" aria-hidden="true">= </span>';
    inputHtml += '<label class="sr-only" for="answer">Your answer</label>';
    inputHtml += '<input type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" id="answer" placeholder="?" onkeypress="if(event.key===\'Enter\')checkAnswer()">';
    inputHtml += '<button class="key-btn" aria-label="Change the sign of your answer" onclick="toggleSign()">+/-</button>';
    inputHtml += '<button class="submit-btn" onclick="checkAnswer()">Submit</button>';
    inputHtml += '</div>';

    document.getElementById('main-content').innerHTML = problemHtml;
    document.getElementById('input-content').innerHTML = inputHtml;
    document.getElementById('helper-buttons').style.display = 'block';

    document.getElementById('announcer').textContent =
        'Problem ' + (problemNum + 1) + '. ' + spokenNum(p.a) + spokenOp(p.op) +
        spokenNum(p.b) + ' equals what?';

    setTimeout(function () {
        var el = document.getElementById('answer');
        if (el) el.focus();
    }, 100);
}

function toggleSign() {
    var el = document.getElementById('answer');
    if (!el) return;
    el.value = el.value.charAt(0) === '-' ? el.value.slice(1) : '-' + el.value;
    el.focus();
}

/* =====================================================================
   Answer checking
   ===================================================================== */
function checkAnswer() {
    if (locked) return;                       // already right, advancing
    var now = Date.now();
    if (now - lastSubmitAt < TOUCH_DEBOUNCE_MS) return;
    lastSubmitAt = now;

    var el = document.getElementById('answer');
    if (!el) return;
    var raw = el.value.trim();
    if (raw === '') return;
    // parseInt accepted "5.9" and "5abc" as 5, so a wrong decimal answer
    // graded as correct. Whole numbers only, with an optional sign.
    if (!/^[+-]?\d+$/.test(raw)) {
        var fb = document.getElementById('feedback');
        fb.textContent = 'Enter a whole number (with a minus sign for negatives).';
        fb.className = 'feedback incorrect';
        el.select(); el.focus();
        return;
    }
    var userNum = parseInt(raw, 10);
    var correct = userNum === currentProblem.answer;
    var feedback = document.getElementById('feedback');

    if (correct) {
        locked = true;
        // Only credit the FIRST-try correct on the tallies -- if they missed
        // before this correct, it's still counted (t was incremented) but not
        // added to c. That matches how classroom quizzes usually work.
        if (!missRecorded) {
            var s = stats[currentProblem.op];
            s.c++;
            s.t++;
            if (currentProblem.sameSign) { s.sameC++; s.sameT++; }
            else { s.diffC++; s.diffT++; }
        }
        // Ruling A: after a reveal the streak stays at 0 rather than
        // restarting at 1. The tally logic above is unchanged.
        if (answerRevealed) {
            streak = 0;
        } else {
            streak++;
            if (streak > bestStreak) bestStreak = streak;
        }
        celebrateStreak(streak);
        feedback.textContent = pick(['Correct!', 'Nice!', 'Got it!', 'Perfect!', 'Nailed it!', 'Yes!']);
        feedback.className = 'feedback correct';
        updateDisplay();
        saveState();
        cancelAdvance();
        advanceTimer = setTimeout(function () {
            advanceTimer = null;
            problemNum++;
            generateProblem();
            updateDisplay();
        }, ADVANCE_MS);
    } else {
        // First wrong attempt on this problem: mark it as attempted (t++)
        // but do not increment c. Streak resets.
        if (!missRecorded) {
            missRecorded = true;
            var s2 = stats[currentProblem.op];
            s2.t++;
            if (currentProblem.sameSign) s2.sameT++;
            else s2.diffT++;
        }
        streak = 0;
        feedback.textContent = 'Not quite -- try again.';
        feedback.className = 'feedback incorrect';
        updateDisplay();
        saveState();
        el.select(); el.focus();
    }
}

/* =====================================================================
   Hint / Explanation / Answer
   ===================================================================== */
function toggleHint() {
    var box = document.getElementById('hint');
    if (box.style.display === 'none') {
        box.className = 'hint-box';
        box.innerHTML = '<b>Hint:</b> ' + buildHint(currentProblem);
        setHelperState('hint', true);
    } else {
        setHelperState('hint', false);
    }
}

function buildHint(p) {
    if (p.op === 'add') {
        if (p.sameSign) {
            return 'Both numbers have the SAME sign. Add their sizes (ignore signs), then keep that sign.';
        }
        return 'The signs are DIFFERENT. Subtract the smaller size from the larger size, then take the sign of the number with the larger size.';
    }
    if (p.op === 'sub') {
        return 'Rewrite subtraction as addition: keep the first number, change the minus to a plus, change the sign of the second number. Then use the addition rules.';
    }
    if (p.op === 'mul' || p.op === 'div') {
        return 'Same signs give a POSITIVE answer. Different signs give a NEGATIVE answer. Then work out the size ('
             + Math.abs(p.a) + ' ' + (p.op === 'mul' ? 'x' : '/') + ' ' + Math.abs(p.b) + ').';
    }
    return '';
}

function toggleAnswer() {
    var box = document.getElementById('answer-box');
    if (box.style.display === 'none') {
        // Revealing the answer records the problem as attempted, exactly like a
        // wrong try. Without this a student could reveal, type it back and take
        // full first-try credit, which quietly inflated every accuracy figure.
        // Ruling A: it also ends the streak, unless the problem was already
        // answered correctly (locked), in which case nothing is charged.
        if (!locked) {
            answerRevealed = true;
            streak = 0;
        }
        recordMiss();
        updateDisplay();
        saveState();
        box.className = 'answer-box';
        box.innerHTML = '<b>Answer:</b> ' + escapeHtml(currentProblem.answer);
        setHelperState('answer-box', true);
    } else {
        setHelperState('answer-box', false);
    }
}

function recordMiss() {
    // `locked` means this problem was already answered correctly and its
    // tallies are in; adding an attempt now would double-count it.
    if (missRecorded || locked || !currentProblem) return;
    missRecorded = true;
    var s = stats[currentProblem.op];
    s.t++;
    if (currentProblem.sameSign) s.sameT++;
    else s.diffT++;
    updateDisplay();
    saveState();
}

function toggleExplanation() {
    var box = document.getElementById('explain');
    if (box.style.display === 'none') {
        box.className = 'explain-box';
        box.innerHTML = buildExplanation(currentProblem);
        setHelperState('explain', true);
    } else {
        setHelperState('explain', false);
    }
}

function buildExplanation(p) {
    var html = '';
    if (p.op === 'mul' || p.op === 'div') {
        html += '<b>' + opNames[p.op] + ' sign rules:</b>';
        html += rulesTable(p);
        var sizeA = Math.abs(p.a);
        var sizeB = Math.abs(p.b);
        var sizeAns = Math.abs(p.answer);
        var sym = p.op === 'mul' ? 'x' : '/';
        html += '<div style="margin-top:10px;">Size: ' + sizeA + ' ' + sym + ' ' + sizeB + ' = ' + sizeAns + '.';
        html += ' Sign: <b>' + (p.answer < 0 ? 'negative' : 'positive') + '</b>';
        html += (p.sameSign ? ' (same signs)' : ' (different signs)') + '.';
        html += ' So the answer is <b>' + p.answer + '</b>.</div>';
        return html;
    }

    // Addition / Subtraction: number line + (for sub) rewrite step
    if (p.op === 'sub') {
        html += '<b>Step 1 - Rewrite subtraction as addition.</b>';
        html += '<div style="font-size:14px;margin:6px 0;">Keep the first number. Change the minus to plus. Change the sign of the second number.</div>';
        html += '<div class="rewrite">';
        html += '<span class="old">' + p.a + ' &minus; ' + (p.b < 0 ? '(' + p.b + ')' : p.b) + '</span>';
        html += '<span class="arrow">&rarr;</span>';
        html += '<span class="new">' + p.a + ' + ' + (-p.b < 0 ? '(' + (-p.b) + ')' : (-p.b)) + '</span>';
        html += '</div>';
        html += '<b>Step 2 - Add on the number line.</b>';
    } else {
        html += '<b>Add on the number line.</b>';
    }

    // For the number line we always show it as an addition
    var jumpFrom = p.a;
    var jumpBy = (p.op === 'sub') ? -p.b : p.b;
    var jumpTo = jumpFrom + jumpBy;
    html += numberLineSVG(jumpFrom, jumpBy, jumpTo);

    // Verbal reasoning
    var arule;
    var absA = Math.abs(jumpFrom);
    var absB = Math.abs(jumpBy);
    var effectiveSameSign = (jumpFrom > 0) === (jumpBy > 0);
    if (effectiveSameSign) {
        arule = 'Same signs: add the sizes (' + absA + ' + ' + absB + ' = ' + (absA + absB)
              + '), then keep the sign. ';
    } else if (absA === absB) {
        // Naming a sign here was wrong: equal sizes cancel and the answer is 0,
        // which has no sign. Roughly 1.7% of add/sub problems land on this.
        arule = 'Different signs and the sizes are equal (' + absA + ' and ' + absB
              + '), so they cancel out. ';
    } else {
        var larger = absA >= absB ? absA : absB;
        var smaller = absA >= absB ? absB : absA;
        var sign = absA >= absB ? (jumpFrom >= 0 ? '+' : '-') : (jumpBy >= 0 ? '+' : '-');
        arule = 'Different signs: subtract the sizes (' + larger + ' &minus; ' + smaller + ' = ' + (larger - smaller)
              + '), then use the sign of the bigger size (' + sign + '). ';
    }
    html += '<div style="margin-top:10px;">' + arule + 'So the answer is <b>' + p.answer + '</b>.</div>';
    return html;
}

function rulesTable(p) {
    // Highlight the applicable row for this problem
    var aSign = p.a >= 0 ? '+' : '-';
    var bSign = p.b >= 0 ? '+' : '-';
    var rows = [
        { a: '+', b: '+', r: '+' },
        { a: '+', b: '-', r: '-' },
        { a: '-', b: '+', r: '-' },
        { a: '-', b: '-', r: '+' }
    ];
    var sym = p.op === 'mul' ? '&times;' : '&divide;';
    var html = '<div class="rules-card"><table>';
    for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var hi = (row.a === aSign && row.b === bSign) ? ' class="highlight"' : '';
        var aCls = row.a === '+' ? 'pos' : 'neg';
        var bCls = row.b === '+' ? 'pos' : 'neg';
        var rCls = row.r === '+' ? 'pos' : 'neg';
        html += '<tr' + hi + '>';
        html += '<td class="' + aCls + '">(' + row.a + ')</td>';
        html += '<td>' + sym + '</td>';
        html += '<td class="' + bCls + '">(' + row.b + ')</td>';
        html += '<td>=</td>';
        html += '<td class="' + rCls + '">(' + row.r + ')</td>';
        html += '</tr>';
    }
    html += '</table></div>';
    return html;
}

/* =====================================================================
   Number line SVG (for add/sub explanations)
   ===================================================================== */
function numberLineSVG(from, jump, to) {
    // Choose a range that comfortably contains from and to
    var lo = Math.min(from, to) - 2;
    var hi = Math.max(from, to) + 2;
    // Keep the line wide enough to see even for small jumps
    if (hi - lo < 10) {
        var mid = (lo + hi) / 2;
        lo = Math.floor(mid - 5);
        hi = Math.ceil(mid + 5);
    }
    var W = 620, H = 130, pad = 25;
    var innerW = W - 2 * pad;
    var scale = innerW / (hi - lo);
    function xOf(v) { return pad + (v - lo) * scale; }
    var yLine = 80;

    // The arc restates the sentence underneath it, so it is decorative to a
    // screen reader rather than a second, symbol-soup reading of the problem.
    var s = '<div class="numline-wrap" aria-hidden="true"><svg class="numline-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    // Main line
    s += '<line x1="' + pad + '" y1="' + yLine + '" x2="' + (W - pad) + '" y2="' + yLine + '" stroke="#2e3d8f" stroke-width="2"/>';
    // Ticks + labels
    var step = 1;
    if (hi - lo > 20) step = 2;
    if (hi - lo > 40) step = 5;
    for (var v = Math.ceil(lo); v <= Math.floor(hi); v++) {
        if (v % step !== 0 && v !== 0) continue;
        var x = xOf(v);
        var isZero = v === 0;
        s += '<line x1="' + x + '" y1="' + (yLine - 5) + '" x2="' + x + '" y2="' + (yLine + 5)
           + '" stroke="' + (isZero ? '#7c3aed' : '#8b96d8') + '" stroke-width="' + (isZero ? 2 : 1) + '"/>';
        s += '<text x="' + x + '" y="' + (yLine + 22) + '" text-anchor="middle" font-size="12" fill="#4a5480" font-family="Consolas, monospace">' + v + '</text>';
    }

    // Arrow arc from `from` to `to`
    var x0 = xOf(from), x1 = xOf(to);
    var arcHeight = 42;
    // Curve upward
    var midX = (x0 + x1) / 2;
    var ctrlY = yLine - arcHeight;
    // arrowhead marker
    s += '<defs><marker id="arrhd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">';
    s += '<path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs>';
    s += '<path d="M ' + x0 + ' ' + yLine + ' Q ' + midX + ' ' + ctrlY + ' ' + x1 + ' ' + yLine
       + '" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrhd)"/>';

    // Jump label above the arc
    var jumpLabelY = ctrlY - 6;
    var jumpText = (jump >= 0 ? '+' + jump : String(jump));
    s += '<text x="' + midX + '" y="' + jumpLabelY + '" text-anchor="middle" font-size="14" font-weight="800" fill="#047857" font-family="Nunito, sans-serif">' + jumpText + '</text>';

    // Start & end markers
    s += '<circle cx="' + x0 + '" cy="' + yLine + '" r="5" fill="#2e3d8f"/>';
    s += '<text x="' + x0 + '" y="' + (yLine - 12) + '" text-anchor="middle" font-size="12" font-weight="800" fill="#2e3d8f" font-family="Consolas, monospace">start ' + from + '</text>';
    s += '<circle cx="' + x1 + '" cy="' + yLine + '" r="6" fill="#059669"/>';
    s += '<text x="' + x1 + '" y="' + (yLine + 45) + '" text-anchor="middle" font-size="13" font-weight="800" fill="#047857" font-family="Consolas, monospace">end ' + to + '</text>';

    s += '</svg></div>';
    return s;
}

/* =====================================================================
   Stats view
   ===================================================================== */
function showStats() {
    cancelAdvance();          // a pending advance would wipe the stats view
    var totalC = 0, totalT = 0;
    var ops = ['add', 'sub', 'mul', 'div'];
    ops.forEach(function (o) { totalC += stats[o].c; totalT += stats[o].t; });
    var overallPct = totalT > 0 ? Math.round((totalC / totalT) * 100) : 0;

    var html = '<div class="stats-view">';
    html += '<h2 id="stats-heading" tabindex="-1">My Stats</h2>';
    html += '<div class="stats-overall">';
    if (totalT > 0) {
        html += '<div class="big">' + escapeHtml(overallPct) + '%</div>';
        html += '<div class="lbl">' + escapeHtml(totalC) + ' correct on first try out of ' + escapeHtml(totalT) + ' problems</div>';
    } else {
        html += '<div class="big" style="color:#4a5480;">--</div>';
        html += '<div class="lbl">No problems attempted yet.</div>';
    }
    html += '<div class="lbl" style="margin-top:6px;">Best streak: ' + escapeHtml(bestStreak) + '</div>';
    html += '</div>';

    ops.forEach(function (o) {
        var s = stats[o];
        var pct = s.t > 0 ? Math.round((s.c / s.t) * 100) : 0;
        var barCls = 'none';
        if (s.t > 0) {
            if (pct >= 80) barCls = 'good';
            else if (pct >= 60) barCls = 'mid';
            else barCls = 'low';
        }
        var w = s.t > 0 ? Math.max(0, Math.min(100, pct)) : 0;
        html += '<div class="stat-row">';
        html += '<div class="stat-name">' + escapeHtml(opNames[o]) + '</div>';
        html += '<div class="stat-bar-wrap"><div class="stat-bar ' + barCls + '" style="width:' + w + '%;"></div></div>';
        if (s.t > 0) {
            html += '<div class="stat-num">' + escapeHtml(s.c) + '/' + escapeHtml(s.t) + ' (' + escapeHtml(pct) + '%)</div>';
        } else {
            html += '<div class="stat-num"><span class="stat-untried">not tried yet</span></div>';
        }
        html += '</div>';
        if (s.t > 0) {
            var samePct = s.sameT > 0 ? Math.round((s.sameC / s.sameT) * 100) : null;
            var diffPct = s.diffT > 0 ? Math.round((s.diffC / s.diffT) * 100) : null;
            html += '<div class="stat-sub">';
            html += '<span>Same signs: ' + (samePct === null ? '--' : escapeHtml(s.sameC) + '/' + escapeHtml(s.sameT) + ' (' + escapeHtml(samePct) + '%)') + '</span>';
            html += '<span>Different signs: ' + (diffPct === null ? '--' : escapeHtml(s.diffC) + '/' + escapeHtml(s.diffT) + ' (' + escapeHtml(diffPct) + '%)') + '</span>';
            html += '</div>';
        }
    });

    // Recommendation: find the weakest category with enough data
    var recommend = buildRecommendation();
    if (recommend) {
        html += '<div class="recommend">' + recommend + '</div>';
    }

    html += '<div class="stats-actions">';
    html += '<button class="submit-btn" onclick="hideStats()">Back to Practice</button>';
    html += '<button class="reset-btn" onclick="confirmReset()" style="margin-left:8px;">Reset Stats</button>';
    html += '</div>';
    html += '</div>';

    document.getElementById('main-content').innerHTML = html;
    document.getElementById('input-content').innerHTML = '';
    var fb = document.getElementById('feedback');
    fb.textContent = '';
    fb.className = 'feedback';
    document.getElementById('helper-buttons').style.display = 'none';
    setHelperState('hint', false);
    setHelperState('explain', false);
    setHelperState('answer-box', false);
    document.getElementById('announcer').textContent = 'My stats.';
    var h = document.getElementById('stats-heading');
    if (h) h.focus();
}

function buildRecommendation() {
    var ops = ['add', 'sub', 'mul', 'div'];
    var weakest = null;
    var weakestPct = 101;
    ops.forEach(function (o) {
        var s = stats[o];
        if (s.t < 1) return; // only skip if never attempted
        var p = s.c / s.t * 100;
        if (p < weakestPct) { weakestPct = p; weakest = o; }
    });
    if (!weakest) return null;
    if (weakestPct >= 85) {
        return '<b>Great work overall!</b> You are strong across all four operations. Try the Mixed mode to keep sharp.';
    }
    var name = opNames[weakest];
    // Same-sign vs different-sign sub-diagnosis
    var s = stats[weakest];
    var sub = '';
    if (s.sameT >= 2 && s.diffT >= 2) {
        var sameP = s.sameC / s.sameT * 100;
        var diffP = s.diffC / s.diffT * 100;
        if (sameP < diffP - 15) sub = ' Especially problems where both numbers have the same sign.';
        else if (diffP < sameP - 15) sub = ' Especially problems where the signs are different.';
    }
    return '<b>Focus area:</b> ' + escapeHtml(name) + ' is your weakest (' + escapeHtml(Math.round(weakestPct)) + '%).' + sub
         + ' Try the ' + escapeHtml(opShortNames[weakest]) + ' mode for focused practice.';
}

function hideStats() {
    cancelAdvance();
    generateProblem();
}

var resetArmed = false;
var resetTimer = null;
function confirmReset() {
    if (!resetArmed) {
        resetArmed = true;
        // Update the button label in place
        var btns = document.querySelectorAll('.reset-btn');
        for (var i = 0; i < btns.length; i++) btns[i].textContent = 'Tap again to confirm';
        resetTimer = setTimeout(function () {
            resetArmed = false;
            var b2 = document.querySelectorAll('.reset-btn');
            for (var j = 0; j < b2.length; j++) b2[j].textContent = 'Reset Stats';
        }, 4000);
        return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    stats = blankStats();
    streak = 0;
    bestStreak = 0;
    problemNum = 0;
    saveState();
    updateDisplay();
    showStats();
}

/* =====================================================================
   Skip, mode, display, persistence
   ===================================================================== */
function skipProblem() {
    cancelAdvance();
    problemNum++;
    generateProblem();
    updateDisplay();
}

function setMode(m) {
    cancelAdvance();
    mode = m;
    var btns = document.querySelectorAll('.mode-btn');
    var order = ['add', 'sub', 'mul', 'div', 'mix'];
    for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', order[i] === m);
        btns[i].setAttribute('aria-pressed', order[i] === m ? 'true' : 'false');
    }
    streak = 0;
    generateProblem();
    updateDisplay();
}

function updateDisplay() {
    document.getElementById('problemNum').textContent = problemNum + 1;
    document.getElementById('streak').textContent = streak;
    var sd = document.getElementById('streak-display');
    sd.className = streak >= 5 ? 'info-item streak-hot' : 'info-item';
    var totalC = 0, totalT = 0;
    ['add','sub','mul','div'].forEach(function (o) { totalC += stats[o].c; totalT += stats[o].t; });
    var accEl = document.getElementById('acc-display');
    if (totalT > 0) accEl.textContent = 'Accuracy: ' + Math.round(totalC / totalT * 100) + '%';
    else accEl.textContent = 'Accuracy: --';
}

/* --- Persistence hardening ---------------------------------------------
   Anything read back from localStorage is untrusted: a student can edit it
   in devtools, and every one of these counters is concatenated into the
   stats view's innerHTML. Coerce to bounded non-negative integers on load
   and escape on the way out. */
function escapeHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
var MAX_COUNT = 1000000;
function safeCount(v, max) {
    var n = Number(v);
    if (typeof v === 'boolean' || v === null || v === '' || !isFinite(n) || n < 0) return 0;
    n = Math.floor(n);
    return n > max ? max : n;
}
function blankStats() {
    return {
        add: { c:0, t:0, sameC:0, sameT:0, diffC:0, diffT:0 },
        sub: { c:0, t:0, sameC:0, sameT:0, diffC:0, diffT:0 },
        mul: { c:0, t:0, sameC:0, sameT:0, diffC:0, diffT:0 },
        div: { c:0, t:0, sameC:0, sameT:0, diffC:0, diffT:0 }
    };
}

function saveState() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            stats: stats, bestStreak: bestStreak, problemNum: problemNum
        }));
    } catch (e) { /* storage unavailable -- play without saving */ }
}
function loadState() {
    try {
        var raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        var st = JSON.parse(raw);
        if (st.stats && typeof st.stats === 'object') {
            ['add','sub','mul','div'].forEach(function (o) {
                var v = st.stats[o];
                if (!v || typeof v !== 'object') return;
                var t = safeCount(v.t, MAX_COUNT);
                var sameT = safeCount(v.sameT, t);
                var diffT = safeCount(v.diffT, t);
                if (sameT + diffT > t) { sameT = 0; diffT = 0; }
                stats[o] = {
                    c: Math.min(safeCount(v.c, MAX_COUNT), t),
                    t: t,
                    sameC: Math.min(safeCount(v.sameC, MAX_COUNT), sameT),
                    sameT: sameT,
                    diffC: Math.min(safeCount(v.diffC, MAX_COUNT), diffT),
                    diffT: diffT
                };
            });
        }
        // typeof NaN === 'number', so the old guards let NaN through and the
        // header rendered "Problem NaN".
        bestStreak = safeCount(st.bestStreak, MAX_COUNT);
        problemNum = safeCount(st.problemNum, MAX_COUNT);
    } catch (e) { /* ignore */ }
}

/* =====================================================================
   Confetti
   ===================================================================== */
/* Design item 9: the toggle lives under its own key, so clearing progress
   does not silently switch the animation back on. */
var CONFETTI_KEY = 'signedNumbersConfetti_v1';
var confettiEnabled = true;
function loadConfettiSetting() {
    try {
        var v = localStorage.getItem(CONFETTI_KEY);
        if (v === '0') confettiEnabled = false;
        else if (v === '1') confettiEnabled = true;
    } catch (e) { /* storage unavailable -- default to on */ }
}
function syncConfettiSwitch() {
    var btn = document.getElementById('confetti-switch');
    if (btn) btn.setAttribute('aria-pressed', confettiEnabled ? 'true' : 'false');
}
function toggleConfettiSetting() {
    confettiEnabled = !confettiEnabled;
    try { localStorage.setItem(CONFETTI_KEY, confettiEnabled ? '1' : '0'); } catch (e) {}
    syncConfettiSwitch();
}

function celebrateStreak(s) {
    // Signed Numbers variant of the sanctioned schedule: every 5th correct in
    // a row is a tier-2 burst, every 10th a tier-3 one. Nothing in between.
    if (prefersReducedMotion()) return;
    if (s === 0 || s % 5 !== 0) return;
    if (s % 10 === 0) createConfetti(200, 3);
    else createConfetti(100, 2);
}

function createConfetti(count, tier) {
    if (!confettiEnabled) return;
    var host = document.body;
    /* Design item 10: #ef4444 (red, not in the palette) and #f59e0b (orange,
       banned outright) replaced with mint and heritage rose. Still 8 colours. */
    var colors = ['#10b981', '#22c55e', '#3b82f6', '#c76b8f', '#a855f7', '#06b6d4', '#ec4899', '#84cc16'];
    var isMassive = tier === 3;
    for (var i = 0; i < count; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti';
        piece.setAttribute('aria-hidden', 'true');
        var base;
        if (tier === 1) base = 7 + Math.random() * 5;
        else if (tier === 2) base = 10 + Math.random() * 7;
        else base = 11 + Math.random() * 9;
        var color = colors[Math.floor(Math.random() * colors.length)];
        var shape = Math.floor(Math.random() * 4);
        if (shape === 0) {
            piece.style.width = base + 'px';
            piece.style.height = base + 'px';
            piece.style.background = color;
            piece.style.borderRadius = '50%';
        } else if (shape === 1) {
            piece.style.width = base + 'px';
            piece.style.height = base + 'px';
            piece.style.background = color;
            piece.style.borderRadius = '2px';
        } else if (shape === 2) {
            piece.style.width = Math.max(4, base * 0.35) + 'px';
            piece.style.height = (base * 1.7) + 'px';
            piece.style.background = color;
            piece.style.borderRadius = '2px';
        } else {
            piece.style.width = '0';
            piece.style.height = '0';
            piece.style.background = 'transparent';
            piece.style.borderLeft = (base * 0.6) + 'px solid transparent';
            piece.style.borderRight = (base * 0.6) + 'px solid transparent';
            piece.style.borderBottom = base + 'px solid ' + color;
        }
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-20px';
        var dur;
        if (tier === 1) dur = 1.6 + Math.random() * 1.0;
        else if (tier === 2) dur = 2.0 + Math.random() * 1.5;
        else dur = 2.5 + Math.random() * 2.0;
        piece.style.animation = (isMassive ? 'confetti-fall-slow' : 'confetti-fall') + ' ' + dur + 's ease-out forwards';
        piece.style.animationDelay = (Math.random() * (isMassive ? 0.8 : 0.4)) + 's';
        host.appendChild(piece);
        setTimeout(function (el) {
            return function () { if (el.parentNode) el.parentNode.removeChild(el); };
        }(piece), isMassive ? 6000 : 4500);
    }
}

/* =====================================================================
   Boot
   ===================================================================== */
loadState();
loadConfettiSetting();
syncConfettiSwitch();
generateProblem();
updateDisplay();
</script>
</body>
