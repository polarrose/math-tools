<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Arithmetic Practice</title>
<meta name="theme-color" content="#1b2450">
<meta name="referrer" content="no-referrer">
<!-- Locks the page to its own inline code plus the Google Fonts stylesheet:
     no external scripts, frames, or form posts can be introduced. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    /* ===== MIDNIGHT SCHOLAR - navy stage, white card, violet + teal accents ===== */
    * { box-sizing: border-box; }
    body {
        font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
        background:
            radial-gradient(900px 500px at 85% -10%, rgba(124, 58, 237, 0.28), transparent 60%),
            radial-gradient(800px 500px at -10% 110%, rgba(13, 148, 136, 0.18), transparent 55%),
            linear-gradient(160deg, #141b3d 0%, #1b2450 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px 12px;
        margin: 0;
    }
    .card {
        background: #ffffff;
        border-radius: 22px;
        box-shadow: 0 24px 60px rgba(8, 12, 40, 0.55);
        max-width: 720px;
        width: 100%;
        padding: 30px 24px 22px;
        position: relative;
        overflow: hidden;
        display: block;
    }
    .card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 6px;
        background: linear-gradient(90deg, #2e3d8f, #7c3aed, #0d9488);
    }
    h1 { text-align: center; margin: 0; }
    h1 span.title-inline {
        display: inline-block;
        color: #1e2a5e;
        margin: 4px 0 6px;
        font-size: 25px;
        letter-spacing: 0.3px;
    }
    /* Sample item S4: the gradient rule is exactly as wide as the title
       text, at any title length. The span is inline-block, so 100% of it
       is 100% of the title. */
    h1 span.title-inline::after {
        content: '';
        display: block;
        width: 100%;
        max-width: 100%;
        height: 4px;
        border-radius: 2px;
        margin: 8px auto 14px;
        background: linear-gradient(90deg, #2e3d8f, #7c3aed, #0d9488);
    }
    .info {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
    }
    .info-item {
        font-size: 12px;
        font-weight: 800;
        background: #eef0fb;
        color: #2e3d8f;
        padding: 6px 13px;
        border-radius: 999px;
    }
    .info-item.streak-hot {
        background: linear-gradient(135deg, #0b7a70, #2e3d8f);
        color: white;
    }

    /* ---- Primary operation buttons: navy, active green ---- */
    .mode-btns {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }
    /* Design item 20: the unselected pill was solid navy #2e3d8f with white
       text, so every operation looked chosen at once. The design system's
       inactive pill is #e6e9f6 / #4a5480 (7.09:1), which leaves only the
       active pill filled. */
    .mode-btn {
        background: #e6e9f6;
        color: #4a5480;
        border: none;
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.15s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        font-family: inherit;
    }
    .mode-btn:hover { background: #d9def2; }
    /* Active pill: mint family, darkened to #047857 so white text clears AA
       (mint #10b981 itself is only 2.54:1), with the system's mint ring. */
    .mode-btn.active {
        background: #047857 !important;
        color: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25), 0 6px 14px rgba(16, 185, 129, 0.35);
    }
    .mode-btn.active:hover { background: #065f46 !important; }

    /* ---- Sub-level buttons: lighter, secondary ---- */
    /* The level buttons sit in a panel with a caret pointing up at whichever
       operation is active, so the parent/child relationship is visible
       rather than something the student has to infer from position. */
    .level-panel {
        position: relative;
        background: #f2f4fc;
        border: 1px solid #dbe0f4;
        border-radius: 14px;
        padding: 13px 14px 14px;
        margin: 16px 0 4px;
    }
    .level-panel::before {
        content: '';
        position: absolute;
        top: -8px;
        left: 50%;
        margin-left: -8px;
        width: 15px;
        height: 15px;
        background: #f2f4fc;
        border-left: 1px solid #dbe0f4;
        border-top: 1px solid #dbe0f4;
        transform: rotate(45deg);
        transition: left 0.18s ease;
    }
    .level-label {
        text-align: center;
        font-size: 12.5px;
        font-weight: 800;
        color: #5d6798;
        margin: 0 0 11px;
    }
    .level-btns {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .level-btn {
        /* Favorite gradient, accessible variant: the teal end is darkened
           from #0d9488 (3.74:1 under white text) to #0b7a70 (5.21:1). */
        background: linear-gradient(135deg, #1e3a5f, #0b7a70);
        color: #ffffff;
        border: none;
        border-radius: 999px;
        padding: 9px 20px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: box-shadow 0.15s, transform 0.15s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        font-family: inherit;
    }
    .level-btn:hover { filter: brightness(1.12); }
    /* Both buttons are the same colour, so the selected one is marked by a
       ring rather than a fill change. White inner, navy outer, so it reads
       against both the dark button and the light panel behind it. */
    .level-btn.active {
        box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #1e2a5e;
    }

    .problem {
        font-size: 40px;
        font-weight: 800;
        text-align: center;
        margin: 16px auto;
        font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
        color: #1e2a5e;
        background: #eef0fb;
        border: 2px solid #c7cdf0;
        border-radius: 14px;
        padding: 26px 14px;
        max-width: 100%;
        overflow-wrap: break-word;
        letter-spacing: 1px;
    }
    .problem .op-sym { color: #6d28d9; margin: 0 8px; }
    .instructions {
        text-align: center;
        color: #5d6798;
        font-size: 14px;
        margin: 6px 0 12px;
    }
    .input-area {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 16px 0 4px;
        flex-wrap: wrap;
    }
    .eq-label { font-size: 26px; font-weight: 800; color: #1e2a5e; }
    input[type="text"] {
        width: 110px;
        font-size: 28px;
        font-weight: 800;
        text-align: center;
        padding: 10px;
        border: 3px solid #7c3aed;
        border-radius: 12px;
        color: #1e2a5e;
        background: #ffffff;
        font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
    }
    input[type="text"]:focus {
        outline: none;
        border-color: #0d9488;
        box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.18);
    }
    button {
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 800;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.15s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        font-family: inherit;
    }
    button:active { transform: scale(0.95); }
    .submit-btn {
        background: linear-gradient(135deg, #2e3d8f, #4b3bbd);
        color: white;
        box-shadow: 0 6px 16px rgba(46, 61, 143, 0.35);
    }
    .submit-btn:hover { filter: brightness(1.1); }
    .feedback {
        text-align: center;
        font-size: 21px;
        font-weight: 800;
        margin: 12px 0 8px;
        min-height: 32px;
    }
    .feedback:not(:empty) { padding: 8px 14px; border-radius: 10px; }
    .feedback.correct { background: #effbf9; border: 2px solid #5eccc0; color: #0b7a70; }
    .feedback.incorrect { background: #f5f0ff; border: 2px solid #a78bfa; color: #7c3aed; font-size: 17px; }

    /* ---- Bottom bar: My Stats + confetti toggle ---- */
    .bottom-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #e6e9f6;
        flex-wrap: wrap;
    }
    .small-btn {
        background: #eef0fb;
        color: #2e3d8f;
        padding: 8px 16px;
        font-size: 12.5px;
        border-radius: 999px;
    }
    .small-btn:hover { background: #dfe3f7; }
    .toggle-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 800;
        color: #3c456e;
    }
    .toggle-row input { width: 18px; height: 18px; accent-color: #0b7a70; cursor: pointer; }
    .stats-panel {
        margin-top: 14px;
        background: #f7f8fd;
        border: 1px solid #dfe3f7;
        border-radius: 12px;
        padding: 14px 16px;
    }
    .stats-panel h2 { font-size: 14px; color: #1e2a5e; margin: 0 0 10px; text-align: center; }
    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 700;
        color: #3c456e;
        padding: 5px 0;
        border-bottom: 1px dashed #e2e6f5;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-val { font-weight: 800; color: #1e2a5e; }
    /* Design item 21: the game had no reset control at all. Two-tap confirm
       from the design system -- never a browser confirm() dialog. Resting
       state #4a5480 on #eef0fb is 6.62:1; armed state is white on ink navy
       #1e2a5e, 13.0:1. */
    .stats-actions { text-align: center; margin-top: 14px; }
    .reset-btn {
        background: #eef0fb;
        color: #4a5480;
        padding: 9px 18px;
        font-size: 12.5px;
        border-radius: 999px;
    }
    .reset-btn:hover { background: #dfe3f7; }
    .reset-btn.armed {
        background: #1e2a5e;
        color: #ffffff;
    }
    .reset-btn.armed:hover { background: #16214d; }
    /* #6b74a0 on the #f7f8fd panel is 4.28:1 -- below AA for 13px text.
       #5d6798 is the design-system replacement and measures 5.13:1. */
    .stat-none { color: #5d6798; font-weight: 700; }
    .stat-tip {
        margin-top: 10px;
        font-size: 12.5px;
        font-weight: 700;
        color: #0b7a70;
        text-align: center;
    }

    /* Visually hidden, still read by screen readers */
    .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    /* Confetti */
    .confetti { position: fixed; opacity: 0; pointer-events: none; z-index: 9999; }
    @keyframes confetti-fall {
        0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 1; }
    }
    @keyframes confetti-fall-slow {
        0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
        100% { transform: translateY(115vh) rotate(1080deg) scale(0.85); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
        .confetti { display: none !important; }
        * { transition-duration: 0.01ms !important; }
    }
    @media (max-width: 480px) {
        .card { padding: 24px 14px 18px; }
        h1 span.title-inline { font-size: 21px; }
        .problem { font-size: 30px; padding: 20px 8px; }
        .mode-btn { padding: 9px 14px; font-size: 13px; }
        .level-btn { padding: 7px 12px; font-size: 12px; }
        input[type="text"] { width: 92px; font-size: 24px; }
    }
</style>
</head>
<body>
<main class="card" id="game-card">
    <h1><span class="title-inline">Basic Arithmetic Practice</span></h1>

    <div class="info">
        <div class="info-item">Problem: <span id="problemNum">1</span></div>
        <div class="info-item" id="streak-display">Streak: <span id="streak">0</span></div>
        <div class="info-item">Best: <span id="best">0</span></div>
        <div class="info-item" id="acc-display">Accuracy: --</div>
    </div>

    <div class="mode-btns" role="group" aria-label="Operation">
        <button class="mode-btn active" aria-pressed="true" onclick="setMode('add')">Add</button>
        <button class="mode-btn" aria-pressed="false" onclick="setMode('sub')">Subtract</button>
        <button class="mode-btn" aria-pressed="false" onclick="setMode('mult')">Multiply</button>
        <button class="mode-btn mixed" aria-pressed="false" onclick="setMode('mix')">Mixed</button>
    </div>

    <div class="level-panel" id="level-panel">
        <p class="level-label" id="level-label"></p>
        <div class="level-btns" id="level-btns" role="group" aria-label="Difficulty"></div>
    </div>

    <div id="main-content" aria-hidden="true"></div>
    <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>
    <div class="feedback" id="feedback" role="status" aria-live="assertive" aria-atomic="true"></div>
    <div id="input-content"></div>

    <div class="bottom-bar">
        <button class="small-btn" id="stats-btn" aria-expanded="false" aria-controls="stats-panel" onclick="toggleStats()">My Stats</button>
        <label class="toggle-row" for="confetti-toggle">
            <input type="checkbox" id="confetti-toggle" checked onchange="toggleConfetti()">
            <span>Confetti</span>
        </label>
    </div>
    <div id="stats-panel" hidden></div>
</main>

<script>
/* =====================================================================
   Configuration -- every category the game can practice
   ===================================================================== */
var MODES = {
    add:  { label: 'Add',      spoken: ' plus ', levels: [
              { key: 'add5', label: 'Level 1', name: 'Add Level 1',  level: 5 },
              { key: 'add9', label: 'Level 2', name: 'Add Level 2',  level: 9 }
          ] },
    sub:  { label: 'Subtract', spoken: ' minus ', levels: [
              { key: 'sub5', label: 'Level 1', name: 'Subtract Level 1', level: 5 },
              { key: 'sub9', label: 'Level 2', name: 'Subtract Level 2', level: 9 }
          ] },
    mult: { label: 'Multiply', spoken: ' times ', levels: [
              { key: 'multF', label: 'Level 1', name: 'Multiply Level 1',  level: 'found' },
              { key: 'multT', label: 'Level 2', name: 'Multiply Level 2', level: 'full' }
          ] }
};
// Mixed pulls from the harder level of each operation.
var MIX_POOL = [
    { op: 'add',  key: 'add9',  level: 9 },
    { op: 'sub',  key: 'sub9',  level: 9 },
    { op: 'mult', key: 'multT', level: 'full' }
];
var ALL_KEYS = ['add5', 'add9', 'sub5', 'sub9', 'multF', 'multT'];

/* =====================================================================
   State
   ===================================================================== */
var mode = 'add';
var levelIdx = 0;
var currentProblem = null;
var streak = 0;
var bestStreak = 0;
var problemNum = 0;
var missRecorded = false;
var confettiOn = true;

var stats = {};
ALL_KEYS.forEach(function (k) { stats[k] = { c: 0, t: 0 }; });

var SAVE_KEY = 'basicArithmeticPractice_v1';

// Anti-repeat. Deliberately NOT named `history` -- that collides with
// window.history, which cannot be shadowed by a var declaration.
var recentFacts = [];
var HISTORY_LEN = 3;

// Locked while a correct answer is on screen and the next problem is
// pending, so extra taps cannot re-grade the same problem.
var locked = false;
var lastSubmitAt = 0;
var TOUCH_DEBOUNCE_MS = 350;
var ADVANCE_MS = 1100;
// Handle for the pending "advance to the next problem" timer. Switching
// operation or level while a correct answer is still on screen used to let
// the old timer fire afterwards, throwing away the freshly generated
// problem and bumping the counter a second time.
var advanceTimer = null;
function cancelAdvance() {
    if (advanceTimer !== null) { clearTimeout(advanceTimer); advanceTimer = null; }
}

/* =====================================================================
   Utilities
   ===================================================================== */
function ri(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------------------------------------------------------------------
   Trivial facts.

   x+1, x-1, x1 and x10 are all answered by reading the problem, not by
   recalling a fact. They belong in the game, but rarely.

   Two traps, both hit during this build:

   1. Rationing each OPERAND separately gives a problem two chances to
      land a trivial one. 8% per operand became 15% per problem.
   2. Re-rolling the dice inside the anti-repeat retry loop biases toward
      the rare category, because rare facts are rarely in the recent list
      and so survive resampling more often. That pushed a 3% target to 4%.

   Both are fixed by deciding ONCE per problem, before the retry loop,
   and holding that decision across retries.
   --------------------------------------------------------------------- */

var TRIVIAL_ADD_RATE  = 0.03;   // problems containing +1
var TRIVIAL_MULT_RATE = 0.12;   // problems containing x1 or x10 (~6% each)

// Subtraction cannot be held to 3% everywhere. Within 1-5 there are only
// ten possible subtraction facts and four of them subtract 1, so a 3%
// cap would leave six facts and the game would visibly repeat itself.
// Held to 3% at 1-9, where 28 non-trivial facts exist, and to a looser
// rate at 1-5 where the space simply is not big enough.
function trivialSubRate(level) { return level <= 5 ? 0.12 : 0.03; }

function trivialRateFor(op, level) {
    if (op === 'add')  return TRIVIAL_ADD_RATE;
    if (op === 'sub')  return trivialSubRate(level);
    return level === 'full' ? TRIVIAL_MULT_RATE : 0;   // 2-5 tables have none
}

function addTerms(level, trivial) {
    if (trivial) return [1, ri(2, level)];
    return [ri(2, level), ri(2, level)];
}

// Pick the DIFFERENCE first. Picking a and b independently bunches the
// answers at 0 and 1 (over 40% of problems). The subtrahend is never 0,
// and a is never equal to b, so answers of 0 cannot occur at all.
function subTerms(level, trivial) {
    if (trivial) return [ri(3, level), 1];   // "x - 1", answer at least 2
    var maxD = level - 2;                    // leaves room for b >= 2
    // A difference of 1 is also on the easy side, but 1-5 needs it for
    // variety -- without it only three facts remain.
    var pOne = level <= 5 ? 0.45 : 0.08;
    var d = Math.random() < pOne ? 1 : ri(2, maxD);
    var b = ri(2, level - d);
    return [b + d, b];
}

function multTerms(level, trivial) {
    if (level === 'found') return [ri(2, 5), ri(2, 9)];
    if (trivial) return [Math.random() < 0.5 ? 1 : 10, ri(2, 9)];
    return [ri(2, 9), ri(2, 9)];
}

/* =====================================================================
   Mixed mode -- weight operations inversely to accuracy so the weakest
   skill comes up most often.
   ===================================================================== */
function pickAdaptive() {
    var weights = MIX_POOL.map(function (e) {
        var s = stats[e.key];
        if (s.t < 3) return 1.0;
        return Math.max(0.2, 1 - (s.c / s.t));
    });
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < MIX_POOL.length; i++) {
        r -= weights[i];
        if (r <= 0) return MIX_POOL[i];
    }
    return MIX_POOL[MIX_POOL.length - 1];
}

/* =====================================================================
   Problem generation
   ===================================================================== */
function makeFact(op, level, trivial) {
    var a, b, answer, key, t;
    if (op === 'add') {
        t = addTerms(level, trivial);
        a = t[0]; b = t[1];
        if (Math.random() < 0.5) { var s1 = a; a = b; b = s1; }
        answer = a + b;
        key = 'a' + Math.min(a, b) + '_' + Math.max(a, b);   // 3+4 == 4+3
    } else if (op === 'sub') {
        t = subTerms(level, trivial);
        a = t[0]; b = t[1];
        answer = a - b;
        key = 's' + a + '_' + b;
    } else {
        t = multTerms(level, trivial);
        a = t[0]; b = t[1];
        if (Math.random() < 0.5) { var s2 = a; a = b; b = s2; }
        answer = a * b;
        key = 'm' + Math.min(a, b) + '_' + Math.max(a, b);   // 3x5 == 5x3
    }
    return { op: op, a: a, b: b, answer: answer, key: key };
}

function generateProblem() {
    var op, level, statKey;
    if (mode === 'mix') {
        var e = pickAdaptive();
        op = e.op; level = e.level; statKey = e.key;
    } else {
        var lv = MODES[mode].levels[levelIdx];
        op = mode; level = lv.level; statKey = lv.key;
    }

    // Decided once, held across retries -- see the note on trivial facts.
    var trivial = Math.random() < trivialRateFor(op, level);
    var f, attempts = 0;
    do {
        f = makeFact(op, level, trivial);
        attempts++;
        // Some pools are tiny: "x - 1" within 1-5 is only three facts, so
        // holding the flag can exhaust every option that is not already in
        // the recent list. Fall back to the other category rather than let
        // a repeat through.
        if (attempts === 12) trivial = !trivial;
    } while (recentFacts.indexOf(f.key) !== -1 && attempts < 30);
    recentFacts.push(f.key);
    if (recentFacts.length > HISTORY_LEN) recentFacts.shift();

    currentProblem = { op: f.op, a: f.a, b: f.b, answer: f.answer, statKey: statKey };
    missRecorded = false;
    locked = false;
    renderProblem();
    var fb = document.getElementById('feedback');
    fb.textContent = '';
    fb.className = 'feedback';
}

function opSymbol(op) {
    // &minus; (U+2212) is the real minus sign; &ndash; looks similar but
    // screen readers read it as "dash" or skip it entirely.
    if (op === 'add') return '+';
    if (op === 'sub') return '&minus;';
    return '&times;';
}

function renderProblem() {
    var p = currentProblem;
    var problemHtml = '<div class="problem">' + p.a +
        ' <span class="op-sym">' + opSymbol(p.op) + '</span> ' + p.b + ' = ?</div>';

    var inputHtml = '';
    inputHtml += '<div class="instructions" aria-hidden="true">Type your answer</div>';
    inputHtml += '<div class="input-area">';
    inputHtml += '<span class="eq-label" aria-hidden="true">= </span>';
    inputHtml += '<label class="sr-only" for="answer">Your answer</label>';
    inputHtml += '<input type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" id="answer" placeholder="?" onkeypress="if(event.key===\'Enter\')checkAnswer()">';
    inputHtml += '<button class="submit-btn" onclick="checkAnswer()">Submit</button>';
    inputHtml += '</div>';

    document.getElementById('main-content').innerHTML = problemHtml;
    document.getElementById('input-content').innerHTML = inputHtml;

    // Spoken form. The visual problem is aria-hidden, so this is the only
    // thing announced -- it has to be self-contained.
    var spokenOp = p.op === 'add' ? ' plus ' : (p.op === 'sub' ? ' minus ' : ' times ');
    document.getElementById('announcer').textContent =
        'Problem ' + (problemNum + 1) + '. ' + p.a + spokenOp + p.b + ' equals what?';

    setTimeout(function () {
        var el = document.getElementById('answer');
        if (el) el.focus();
    }, 100);
}

/* =====================================================================
   Answer checking
   ===================================================================== */
function checkAnswer() {
    if (locked) return;                       // already right, advancing
    var now = Date.now();
    if (now - lastSubmitAt < TOUCH_DEBOUNCE_MS) return;
    lastSubmitAt = now;

    var el = document.getElementById('answer');
    if (!el) return;
    var raw = el.value.trim();
    if (raw === '') return;
    var feedback = document.getElementById('feedback');

    // Strict: whole numbers only. parseInt would accept "12abc" and "6.99".
    // A leading + is an equivalent way to write a positive whole number, so
    // it is accepted rather than rejected as a format error.
    if (!/^[+-]?\d+$/.test(raw)) {
        feedback.textContent = 'Whole numbers only.';
        feedback.className = 'feedback incorrect';
        el.select(); el.focus();
        return;
    }
    var userNum = parseInt(raw, 10);

    if (userNum === currentProblem.answer) {
        locked = true;
        if (!missRecorded) {
            var s = stats[currentProblem.statKey];
            s.c++; s.t++;
        }
        streak++;
        if (streak > bestStreak) bestStreak = streak;
        celebrateStreak(streak);
        feedback.textContent = pick(['Correct!', 'Nice!', 'Got it!', 'Perfect!', 'Nailed it!', 'Yes!']);
        feedback.className = 'feedback correct';
        updateDisplay();
        saveState();
        cancelAdvance();
        advanceTimer = setTimeout(function () {
            advanceTimer = null;
            problemNum++;
            generateProblem();
            updateDisplay();
        }, ADVANCE_MS);
    } else {
        if (!missRecorded) {
            missRecorded = true;
            stats[currentProblem.statKey].t++;
        }
        streak = 0;
        feedback.textContent = 'Not quite. Try again.';
        feedback.className = 'feedback incorrect';
        updateDisplay();
        saveState();
        el.select(); el.focus();
    }
}

/* =====================================================================
   Mode / level switching
   ===================================================================== */
function setMode(m) {
    cancelAdvance();
    mode = m;
    levelIdx = 0;
    recentFacts = [];
    streak = 0;
    var order = ['add', 'sub', 'mult', 'mix'];
    var btns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', order[i] === m);
        btns[i].setAttribute('aria-pressed', order[i] === m ? 'true' : 'false');
    }
    renderLevelButtons();
    generateProblem();
    updateDisplay();
}

function setLevel(i) {
    cancelAdvance();
    levelIdx = i;
    recentFacts = [];
    streak = 0;
    renderLevelButtons();
    generateProblem();
    updateDisplay();
}

function renderLevelButtons() {
    var host = document.getElementById('level-btns');
    var label = document.getElementById('level-label');

    if (mode === 'mix') {
        label.textContent = 'Mixed practice on addition, subtraction and multiplication';
        host.innerHTML = '';
        host.setAttribute('aria-label', 'Mixed practice');
        positionCaret();
        return;
    }

    var cfg = MODES[mode];
    label.textContent = 'Select the level';
    host.setAttribute('aria-label', cfg.label + ' - select the level');

    var lv = cfg.levels;
    var html = '';
    for (var i = 0; i < lv.length; i++) {
        html += '<button class="level-btn' + (i === levelIdx ? ' active' : '') + '"' +
                ' aria-pressed="' + (i === levelIdx ? 'true' : 'false') + '"' +
                ' onclick="setLevel(' + i + ')">' + lv[i].label + '</button>';
    }
    host.innerHTML = html;
    positionCaret();
}

// Point the caret at the centre of the active operation button, so it is
// obvious which one the panel belongs to. Recalculated on resize because
// the buttons wrap on narrow screens.
function positionCaret() {
    var panel = document.getElementById('level-panel');
    var active = document.querySelector('.mode-btn.active');
    if (!panel || !active) return;
    var pr = panel.getBoundingClientRect();
    var ar = active.getBoundingClientRect();
    var x = (ar.left + ar.width / 2) - pr.left;
    x = Math.max(18, Math.min(pr.width - 18, x));
    panel.style.setProperty('--caret-x', x + 'px');
    panel.style.cssText += ';';
    var st = document.getElementById('caret-style');
    if (!st) {
        st = document.createElement('style');
        st.id = 'caret-style';
        document.head.appendChild(st);
    }
    st.textContent = '.level-panel::before { left: ' + x + 'px; }';
}

window.addEventListener('resize', positionCaret);

/* =====================================================================
   Display
   ===================================================================== */
function activeKeys() {
    if (mode === 'mix') return MIX_POOL.map(function (e) { return e.key; });
    return [MODES[mode].levels[levelIdx].key];
}

function updateDisplay() {
    document.getElementById('problemNum').textContent = problemNum + 1;
    document.getElementById('streak').textContent = streak;
    document.getElementById('best').textContent = bestStreak;
    document.getElementById('streak-display').className =
        streak >= 5 ? 'info-item streak-hot' : 'info-item';

    var c = 0, t = 0;
    activeKeys().forEach(function (k) { c += stats[k].c; t += stats[k].t; });
    document.getElementById('acc-display').textContent =
        t > 0 ? 'Accuracy: ' + Math.round(c / t * 100) + '%' : 'Accuracy: --';

    if (!document.getElementById('stats-panel').hidden) renderStats();
}

/* =====================================================================
   My Stats
   ===================================================================== */
function toggleStats() {
    var panel = document.getElementById('stats-panel');
    var btn = document.getElementById('stats-btn');
    var show = panel.hidden;
    panel.hidden = !show;
    btn.setAttribute('aria-expanded', show ? 'true' : 'false');
    btn.textContent = show ? 'Hide Stats' : 'My Stats';
    if (show) renderStats();
    else disarmReset();
}

function renderStats() {
    var rows = '';
    var weakest = null, weakestAcc = 2;
    ['add', 'sub', 'mult'].forEach(function (m) {
        MODES[m].levels.forEach(function (lv) {
            var s = stats[lv.key];
            var val;
            if (s.t > 0) {
                var acc = s.c / s.t;
                val = '<span class="stat-val">' + Math.round(acc * 100) + '%</span>' +
                      ' <span class="stat-none">(' + escapeHtml(s.c) + '/' + escapeHtml(s.t) + ')</span>';
                if (s.t >= 5 && acc < weakestAcc) { weakestAcc = acc; weakest = lv.name; }
            } else {
                val = '<span class="stat-none">not tried yet</span>';
            }
            rows += '<div class="stat-row"><span>' + escapeHtml(lv.name) + '</span><span>' + val + '</span></div>';
        });
    });
    var tip = '';
    if (weakest && weakestAcc < 0.85) {
        tip = '<p class="stat-tip">Most worth practicing right now: ' + escapeHtml(weakest) + '</p>';
    }
    /* The label is rendered from resetArmed, so an armed button survives the
       re-render that updateDisplay() triggers while the panel is open. */
    var resetCls = resetArmed ? 'reset-btn armed' : 'reset-btn';
    var resetTxt = resetArmed ? 'Tap again to confirm' : 'Reset Stats';
    document.getElementById('stats-panel').innerHTML =
        '<div class="stats-panel"><h2>My Stats</h2>' + rows + tip +
        '<div class="stat-row" style="border-top:1px solid #e2e6f5;margin-top:8px;padding-top:8px">' +
        '<span>Best streak</span><span class="stat-val">' + escapeHtml(bestStreak) + '</span></div>' +
        '<div class="stats-actions">' +
        '<button class="' + resetCls + '" id="reset-btn" onclick="confirmReset()">' + resetTxt + '</button>' +
        '</div></div>';
}

/* =====================================================================
   Reset (design item 21)
   ===================================================================== */
var resetArmed = false;
var resetTimer = null;

function disarmReset() {
    resetArmed = false;
    if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
    var b = document.getElementById('reset-btn');
    if (b) { b.className = 'reset-btn'; b.textContent = 'Reset Stats'; }
}

function confirmReset() {
    if (!resetArmed) {
        resetArmed = true;
        var b = document.getElementById('reset-btn');
        if (b) { b.className = 'reset-btn armed'; b.textContent = 'Tap again to confirm'; }
        if (resetTimer) clearTimeout(resetTimer);
        // Auto-disarms after 3500ms so a stray first tap cannot sit primed.
        resetTimer = setTimeout(disarmReset, 3500);
        return;
    }
    disarmReset();
    ALL_KEYS.forEach(function (k) { stats[k] = { c: 0, t: 0 }; });
    bestStreak = 0;
    streak = 0;
    saveState();
    updateDisplay();
    renderStats();
    var ann = document.getElementById('announcer');
    if (ann) ann.textContent = 'Stats cleared. Every level is back to not tried yet.';
}

/* =====================================================================
   Persistence -- stats and best streak carry over; the problem counter
   deliberately does not, so each visit reads as a fresh practice run.
   ===================================================================== */
/* --- Persistence hardening ---------------------------------------------
   Anything read back from localStorage is untrusted: another script on the
   origin, a shared device, or a curious student can edit it in devtools.
   Stats values flow into innerHTML in the stats panel, so they are coerced
   to plain non-negative integers on load and escaped on the way out. */
function escapeHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function safeCount(v, max) {
    var n = Number(v);
    if (typeof v === 'boolean' || v === null || v === '' || !isFinite(n) || n < 0) return 0;
    n = Math.floor(n);
    return n > max ? max : n;
}
var MAX_COUNT = 1000000;

function saveState() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            stats: stats, bestStreak: bestStreak, confettiOn: confettiOn
        }));
    } catch (e) { /* storage unavailable -- play without saving */ }
}

function loadState() {
    try {
        var raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        var st = JSON.parse(raw);
        if (st.stats && typeof st.stats === 'object') {
            ALL_KEYS.forEach(function (k) {
                var v = st.stats[k];
                if (!v || typeof v !== 'object') return;
                // isFinite() alone lets strings and arrays through; coerce to a
                // bounded integer instead, then keep correct <= attempted.
                var t = safeCount(v.t, MAX_COUNT);
                var c = safeCount(v.c, MAX_COUNT);
                if (c > t) c = t;
                stats[k] = { c: c, t: t };
            });
        }
        bestStreak = safeCount(st.bestStreak, MAX_COUNT);
        if (typeof st.confettiOn === 'boolean') confettiOn = st.confettiOn;
    } catch (e) { /* ignore */ }
}

function toggleConfetti() {
    confettiOn = document.getElementById('confetti-toggle').checked;
    saveState();
}

/* =====================================================================
   Confetti
   ===================================================================== */
function celebrateStreak(s) {
    if (!confettiOn) return;
    if (s === 0 || s % 5 !== 0) return;
    if (s % 10 === 0) createConfetti(200, 3);
    else createConfetti(100, 2);
}

function createConfetti(count, tier) {
    /* Design item 10: '#ef4444' (red, not in the palette) and '#f59e0b'
       (orange, banned outright) swapped for mint '#10b981' and heritage
       rose '#c76b8f'. Still eight colours. */
    var colors = ['#7c3aed', '#22c55e', '#2e3d8f', '#c76b8f', '#10b981', '#ffeb3b', '#0d9488', '#a78bfa'];
    var isMassive = tier === 3;
    for (var i = 0; i < count; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti';
        piece.setAttribute('aria-hidden', 'true');
        var base;
        if (tier === 1) base = 7 + Math.random() * 5;
        else if (tier === 2) base = 10 + Math.random() * 7;
        else base = 11 + Math.random() * 9;
        var color = colors[Math.floor(Math.random() * colors.length)];
        var shape = Math.floor(Math.random() * 4);
        if (shape === 0) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '50%';
        } else if (shape === 1) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else if (shape === 2) {
            piece.style.width = Math.max(4, base * 0.35) + 'px';
            piece.style.height = (base * 1.7) + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else {
            piece.style.width = '0'; piece.style.height = '0';
            piece.style.background = 'transparent';
            piece.style.borderLeft = (base * 0.6) + 'px solid transparent';
            piece.style.borderRight = (base * 0.6) + 'px solid transparent';
            piece.style.borderBottom = base + 'px solid ' + color;
        }
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-20px';
        var dur;
        if (tier === 1) dur = 1.3 + Math.random() * 0.8;
        else if (tier === 2) dur = 1.6 + Math.random() * 1.2;
        else dur = 2.0 + Math.random() * 1.6;
        piece.style.animation = (isMassive ? 'confetti-fall-slow' : 'confetti-fall') + ' ' + dur + 's ease-out forwards';
        piece.style.animationDelay = (Math.random() * (isMassive ? 0.8 : 0.4)) + 's';
        document.body.appendChild(piece);
        setTimeout(function (el) {
            return function () { if (el.parentNode) el.parentNode.removeChild(el); };
        }(piece), isMassive ? 6000 : 4500);
    }
}

/* =====================================================================
   Boot
   ===================================================================== */
loadState();
document.getElementById('confetti-toggle').checked = confettiOn;
renderLevelButtons();
generateProblem();
updateDisplay();
setTimeout(positionCaret, 60);
</script>
