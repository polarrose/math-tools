<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finding the Slope</title>
<meta name="theme-color" content="#1b2450">
<!-- Midnight Scholar / Polar Rose Studio - Finding the Slope - build v5 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* ===== MIDNIGHT SCHOLAR - navy stage, white card, violet + mint accents ===== */
* { box-sizing: border-box; }
body {
    font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background:
        radial-gradient(900px 500px at 85% -10%, rgba(124, 58, 237, 0.28), transparent 60%),
        radial-gradient(800px 500px at -10% 110%, rgba(16, 185, 129, 0.18), transparent 55%),
        linear-gradient(160deg, #141b3d 0%, #1b2450 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px 12px;
    margin: 0;
}
.card {
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(8, 12, 40, 0.55);
    max-width: 700px;
    width: 100%;
    padding: 30px 24px 26px;
    position: relative;
    overflow: hidden;
}
.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #2e3d8f, #7c3aed, #10b981);
}
h1 {
    text-align: center;
    color: #1e2a5e;
    margin: 4px auto 6px;
    font-size: 25px;
    letter-spacing: 0.3px;
    display: table;
}
h1::after {
    content: '';
    display: block;
    /* design system: the rule matches the width of the title text. The h1 is
       display:table above, so its box is already shrink-to-fit. */
    width: 100%;
    height: 4px;
    border-radius: 2px;
    margin: 8px auto 14px;
    background: linear-gradient(90deg, #2e3d8f, #7c3aed, #10b981);
}
/* Screen-reader-only text (visually hidden, still announced) */
.sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}
.tiles-hint {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #5c6699;
    margin: 0 0 10px;
}
.tiles-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin: 14px auto 20px;
    padding: 0;
    max-width: 500px;
}
.tile {
    background: linear-gradient(135deg, #1e3a5f, #0f766e);
    color: #ffffff;
    border: 3px solid transparent;
    border-radius: 999px;
    padding: 6px 12px;
    text-align: center;
    cursor: pointer;
    /* a11y: 'all' animated outline-width too, so the focus ring faded in
       from 0px instead of appearing at once. Animate only what changes. */
    transition: filter 0.15s, border-color 0.15s;
    user-select: none;
    box-sizing: border-box;
    font-family: inherit;
    font-weight: 800;
    font-size: 12px;
    line-height: 1.25;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 56px;
}
.tile:hover { filter: brightness(1.12); }
.tile-input:focus-visible + .tile {
    outline: 3px solid #ffffff;
    outline-offset: 3px;
}
.tile-input:checked + .tile {
    /* design item 19: neon #39ff5e is not in the palette. Mint border plus the
       standard mint ring. Selection is border-presence + ring + the native
       radio's checked state, so it is not carried by hue alone. */
    border-color: #10b981;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25);
}
.equation {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin: 14px auto 18px;
    font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
    color: #1e2a5e;
    background: #eef0fb;
    border: 2px solid #c7cdf0;
    border-radius: 14px;
    padding: 16px 12px;
    max-width: 100%;
    overflow-wrap: break-word;
}
.points-row {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin: 14px auto 18px;
    font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
    color: #1e2a5e;
    background: #eef0fb;
    border: 2px solid #c7cdf0;
    border-radius: 14px;
    padding: 16px 10px;
    max-width: 100%;
    white-space: nowrap;
    overflow-x: auto;
}
.question-text {
    text-align: center;
    font-weight: 800;
    color: #3b3568;
    margin-bottom: 8px;
    font-size: 15px;
}
.frac {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    font-size: 0.82em;
    line-height: 1;
    text-align: center;
    margin: 0 2px;
    position: relative;
    top: 0.05em;
}
.frac .num { border-bottom: 2px solid currentColor; padding: 0 4px 2px; }
.frac .den { padding: 2px 4px 0; }
.frac sub { font-size: 0.7em; line-height: 0; vertical-align: baseline; position: relative; bottom: -0.25em; }
.input-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 8px 0 14px;
    flex-wrap: wrap;
}
.key-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 18px 0 0;
    flex-wrap: wrap;
}
input[type="text"] {
    /* design item 1: 140px clipped the placeholder example. */
    width: 180px;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    padding: 10px;
    border: 3px solid #7c3aed;
    border-radius: 12px;
    color: #1e2a5e;
    background: #ffffff;
    font-family: inherit;
}
input[type="text"]:focus {
    outline: none;
    border-color: #10b981;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
}
input[type="text"]:disabled { opacity: 0.5; }
button {
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 800;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    /* a11y: 'all' animated outline-width, so the focus ring grew from 0px
       over 200ms and read as absent. Animate only the hover/press props. */
    transition: background 0.2s, filter 0.2s, transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    font-family: inherit;
}
button:active { transform: scale(0.95); }
button:disabled { opacity: 0.5; cursor: default; }
button:focus-visible {
    outline: 3px solid #7c3aed;
    outline-offset: 2px;
}
.submit-btn {
    background: linear-gradient(135deg, #2e3d8f, #4b3bbd);
    color: white;
    box-shadow: 0 6px 16px rgba(46, 61, 143, 0.35);
    white-space: nowrap;
}
.submit-btn:hover { filter: brightness(1.1); }
.choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #f3eefe;
    border: 2px solid #8b6fe8;
    color: #2b2358;
    padding: 14px 16px;
    margin: 8px 0;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
}
.choice-btn:hover:not(:disabled) { background: #e9defc; }
.choice-btn.wrong-picked {
    background: #ede9fe;
    border-color: #6d5bb5;
    color: #4c3a80;
    text-decoration: line-through;
}
.choice-btn.correct-reveal { background: #d1fae5; border-color: #047857; color: #064e3b; }
.feedback {
    text-align: center;
    font-size: 19px;
    font-weight: 800;
    margin: 14px 0 8px;
    min-height: 30px;
}
.correct { color: #047857; }
/* design item 13: incorrect feedback is ink navy, 18px, weight 700 in every game. */
.incorrect { color: #1e2a5e; font-size: 18px; font-weight: 700; }
.victory {
    color: #7c3aed;
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}
.info {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.info-item {
    font-size: 12px;
    font-weight: 800;
    background: #eef0fb;
    color: #2e3d8f !important;
    padding: 6px 14px;
    border-radius: 999px;
}
.key-btn {
    background: #e6e9f6;
    color: #2e3d8f;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 800;
    border-radius: 12px;
}
.key-btn:hover { background: #d9def2; }
.hint-btn, .answer-btn, .skip-btn, .solution-btn, .stats-btn {
    background: #ede7fd;
    color: #5b21b6;
    border: 1px solid #8b6fe8;
    margin: 4px;
    font-size: 13px;
}
.hint-btn:hover, .answer-btn:hover, .skip-btn:hover, .solution-btn:hover, .stats-btn:hover {
    background: #e0d5fa;
}
.hint-box, .answer-box {
    background: #f3effe;
    border: 2px solid #8b6fe8;
    border-radius: 14px;
    padding: 15px;
    margin: 14px 0;
    color: #2b2358;
    font-size: 14px;
    line-height: 1.5;
}
/* ===== Settings row (design item 9: confetti is always paired with a toggle) ===== */
.settings-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 18px 0 0;
}
.settings-label {
    font-size: 13px;
    font-weight: 700;
    color: #4a5480;
}
.switch {
    position: relative;
    flex: 0 0 44px;
    width: 44px;
    height: 24px;
    padding: 0;
    border-radius: 999px;
    background: #d5d9e8;
    /* 1px navy-grey rim so the track boundary itself clears 3:1 on the white
       card in both states - the mint fill alone would not. */
    border: 1px solid #8a93b8;
    box-shadow: none;
    transition: background 0.2s;
}
.switch-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 3px rgba(8, 12, 40, 0.4);
    transition: transform 0.2s;
}
.switch[aria-pressed="true"] { background: #10b981; border-color: #0b7a70; }
.switch[aria-pressed="true"] .switch-knob { transform: translateX(20px); }
.reset-btn {
    display: block;
    margin: 10px auto 0;
    background: transparent;
    color: #5c6699;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 10px;
    text-decoration: underline;
}
/* ===== Studio insignia (decorative) ===== */
.insignia { display: block; margin: 20px auto 4px; width: 62px; opacity: 0.9; }
.insignia-caption {
    text-align: center;
    font-size: 6.5px;
    letter-spacing: 1.2px;
    color: #5d6798;
    opacity: 0.9;
    margin-top: 2px;
}
/* ===== Confetti ===== */
.confetti { position: fixed; opacity: 0; pointer-events: none; z-index: 9999; }
@keyframes confetti-fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 1; }
}
@keyframes confetti-fall-slow {
    0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(115vh) rotate(1080deg) scale(0.85); opacity: 1; }
}
.sparkle {
    position: fixed;
    width: 20px; height: 20px;
    background: radial-gradient(circle, #fff 0%, #ffeb3b 50%, transparent 70%);
    border-radius: 50%;
    animation: sparkle 0.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 100;
}
@keyframes sparkle {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.6); }
}
@media (prefers-reduced-motion: reduce) {
    .confetti, .sparkle { display: none !important; }
    .victory { animation: none; }
    * { transition: none !important; }
}
@media (max-width: 480px) {
    .card { padding: 24px 14px 20px; }
    h1 { font-size: 21px; }
    .equation { font-size: 19px; padding: 12px 8px; }
    .points-row { font-size: 16px; padding: 12px 6px; }
    input[type="text"] { width: 150px; font-size: 21px; }
    .tile { font-size: 11.5px; padding: 6px 10px; height: 50px; }
    .tiles-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; max-width: 100%; }
}
</style>
</head>
<body>
<main class="card" id="game-card">
    <h1>Finding the Slope</h1>

    <!-- a11y: the problem is announced here in words. The visual copy of the
         problem is aria-hidden so it is not read a second time. -->
    <p class="sr-only" id="problem-live" role="status" aria-live="polite" aria-atomic="true"></p>

    <p class="tiles-hint" id="tiles-hint">Pick a category to practice &mdash; or choose Mixed to review everything</p>
    <div id="category-tiles" class="tiles-grid" role="radiogroup" aria-labelledby="tiles-hint"></div>

    <div id="main-content"></div>

    <div id="numeric-input-section">
        <div class="key-row">
            <button type="button" class="key-btn" onclick="toggleSign()" aria-label="Toggle negative sign">+/-</button>
            <button type="button" class="key-btn" onclick="insertSlash()" aria-label="Insert fraction bar">/</button>
            <button type="button" class="key-btn" style="font-size:12px;" onclick="insertUndefined()">undefined</button>
        </div>
        <div class="input-area">
            <label for="answer" class="sr-only">Your answer for the slope</label>
            <!-- design item 2: the grader accepts decimal slopes, so the pad must
                 have a decimal point. pattern="[0-9]*" is dropped because it
                 forces the plain numeric pad back on iOS and rejects "2/3". -->
            <input type="text" id="answer" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   placeholder="3 or 2/3" onkeypress="if(event.key==='Enter'){checkAnswer();}">
            <button type="button" class="submit-btn" id="submit-btn" onclick="checkAnswer()">Submit</button>
        </div>
    </div>

    <div class="feedback" id="feedback" role="alert" aria-live="assertive" aria-atomic="true"></div>
    <button type="button" class="submit-btn" id="next-btn" onclick="goNextProblem()" style="display:none;">Next Problem &rarr;</button>

    <div id="helper-buttons" style="text-align: center; margin: 16px 0 4px;">
        <button type="button" class="hint-btn" id="hint-btn" onclick="toggleHint()" aria-expanded="false" aria-controls="hint">Show Hint</button>
        <button type="button" class="answer-btn" id="answer-btn" onclick="toggleAnswer()" aria-expanded="false" aria-controls="answer-box">Show Answer</button>
        <button type="button" class="solution-btn" id="solution-btn" onclick="toggleSolution()" aria-expanded="false" aria-controls="solution-box">Show Solution</button>
        <button type="button" class="skip-btn" onclick="generateProblem()">Skip</button>
        <button type="button" class="stats-btn" id="stats-btn" onclick="toggleStatsPanel()" aria-expanded="false" aria-controls="stats-box">Stats</button>
    </div>

    <div id="hint" style="display: none;"></div>
    <div id="answer-box" style="display: none;"></div>
    <div id="solution-box" style="display: none;"></div>
    <div id="stats-box" style="display: none;"></div>

    <div class="info" style="margin-top:18px;">
        <div class="info-item">Streak: <span id="streak">0</span></div>
        <div class="info-item">Best: <span id="best-streak">0</span></div>
        <div class="info-item">First-try: <span id="overall-pct">&mdash;</span></div>
    </div>

    <!-- design item 9: confetti is always paired with a settings toggle, stored
         per device. A real button, so it is keyboard reachable; aria-pressed
         carries the state and is re-synced from storage on every load. -->
    <div class="settings-row">
        <span class="settings-label" id="confetti-label">Confetti celebrations</span>
        <button type="button" class="switch" id="confetti-switch" aria-pressed="true"
                aria-label="Confetti celebrations" onclick="toggleConfettiSetting()"><span class="switch-knob" aria-hidden="true"></span></button>
    </div>

    <button type="button" class="reset-btn" id="reset-btn" onclick="resetProgress()">Reset Progress</button>

    <!-- Purely decorative studio mark: it carries no title, so it says nothing
         useful to a screen reader. Hidden, matching the rest of the suite. -->
    <svg class="insignia" viewBox="-28 -26 56 64" aria-hidden="true" focusable="false" role="presentation">
        <defs>
            <linearGradient id="pr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1e3a5f"/>
                <stop offset="100%" stop-color="#0d9488"/>
            </linearGradient>
        </defs>
        <path id="pr-path" fill="none" stroke="url(#pr-grad)" stroke-width="1.7"/>
    </svg>
    <div class="insignia-caption">POLAR ROSE STUDIO</div>
</main>

<script>
/* =====================================================================
   Polar rose insignia path  r = 2cos(1.5t)
   ===================================================================== */
(function () {
    var d = '';
    var steps = 240;
    for (var i = 0; i <= steps; i++) {
        var t = (i / steps) * 4 * Math.PI;
        var r = 2 * Math.cos(1.5 * t);
        var x = r * Math.cos(t) * 12;
        var y = r * Math.sin(t) * 12;
        d += (i === 0 ? 'M ' : 'L ') + x.toFixed(2) + ' ' + y.toFixed(2) + ' ';
    }
    var el = document.getElementById('pr-path');
    if (el) el.setAttribute('d', d.trim());
})();

/* =====================================================================
   Five practice categories plus a Mixed option. Exactly one tile is
   selected at a time; Mixed draws randomly from all five. Persists.
   ===================================================================== */
var STORAGE_KEY = 'midnightScholar_slope_v5';
var CATEGORIES = ['graph', 'two-points', 'equation', 'horiz-vert', 'meaning'];
var TILES = CATEGORIES.concat(['mixed']);
var CATEGORY_LABELS = {
    'graph': 'Slope from a graph',
    'two-points': 'Slope from two points',
    'equation': 'Slope of an equation',
    'horiz-vert': 'Slope of horizontal and vertical lines',
    'meaning': 'Meaning of slope',
    'mixed': 'Mixed review'
};

function encounterTier(n) {
    if (n <= 3) return 0;
    if (n <= 10) return 1;
    return 2;
}

/* =====================================================================
   State
   ===================================================================== */
var selectedCategory = 'graph';
var streak = 0;
var bestStreak = 0;
var currentProblem = null;
var lastProblemSignature = '';
var resetArmed = false;
var resetTimeoutId = null;
var categoryStats = {};
var categoryEncounters = {};
var overallStats = { c: 0, t: 0 };

/* =====================================================================
   Utilities
   ===================================================================== */
function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
}
function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { var t = b; b = a % b; a = t; }
    return a || 1;
}
function simplifyFrac(num, den) {
    if (den < 0) { den = -den; num = -num; }
    var g = gcd(num, den);
    return { num: num / g, den: den / g };
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
}
function pctText(c, t) {
    if (!isFinite(c) || !isFinite(t) || t <= 0) return ' - ';
    return Math.round(c / t * 100) + '%';
}

function fracText(f) {
    if (!f) return 'undefined';
    if (f.den === 1) return String(f.num);
    return f.num + '/' + f.den;
}
/* Spoken form for screen readers - never let a stacked fraction read as "3 4" */
function fracSpoken(f) {
    if (!f) return 'undefined';
    if (f.den === 1) return String(f.num);
    return (f.num < 0 ? 'negative ' : '') + Math.abs(f.num) + ' over ' + f.den;
}
/* Real stacked fraction with a horizontal bar.
   The minus is drawn OUTSIDE the fraction bar (correct typography) and is
   hidden from the accessibility tree: a bare ASCII hyphen is skipped or
   mispronounced by screen readers, and leaving it exposed alongside the
   label announced the sign twice. The word "negative" is carried exactly
   once, inside the fraction's own label. */
function fracHTML(f) {
    if (!f) return 'undefined';
    if (f.den === 1) return String(f.num);
    var sign = f.num < 0 ? '<span aria-hidden="true">-</span>' : '';
    return sign + '<span class="frac" role="img" aria-label="' + esc(fracSpoken(f)) + '">'
        + '<span class="num">' + Math.abs(f.num) + '</span>'
        + '<span class="den">' + f.den + '</span></span>';
}
/* Stacked fraction shown exactly as written, before simplifying */
function fracHTMLRaw(num, den) {
    return fracHTMLParts(String(num), String(den), spokenNum(num) + ' over ' + spokenNum(den));
}
/* Stacked fraction where the parts may contain markup (subscripts, etc.).
   spoken is what a screen reader hears instead of the markup. */
function fracHTMLParts(numHTML, denHTML, spoken) {
    return '<span class="frac" role="img" aria-label="' + esc(spoken) + '">'
        + '<span class="num">' + numHTML + '</span>'
        + '<span class="den">' + denHTML + '</span></span>';
}
function slopeTermHTML(m) {
    if (m.den === 1) {
        if (m.num === 1) return 'x';
        if (m.num === -1) return '-x';
        return m.num + 'x';
    }
    /* Same rule as fracHTML: the visual minus is decorative, the sign is
       spoken once inside the label. */
    var sign = m.num < 0 ? '<span aria-hidden="true">-</span>' : '';
    var an = Math.abs(m.num);
    return sign + '<span class="frac" role="img" aria-label="' + esc(fracSpoken(m)) + '">'
        + '<span class="num">' + an + '</span><span class="den">' + m.den + '</span></span>x';
}
function slopeTermPlain(m) {
    if (m.den === 1) {
        if (m.num === 1) return 'x';
        if (m.num === -1) return '-x';
        return m.num + 'x';
    }

        svg += '<text x="' + (sx(0) - 7) + '" y="' + (sy(j) + 3) + '" font-size="9" fill="#5c6699" text-anchor="end">' + j + '</text>';
    }

    var x1 = problem.data.x1, y1 = problem.data.y1, x2 = problem.data.x2, y2 = problem.data.y2;
    var ends;
    if (x1 === x2) {
        ends = [{ x: x1, y: -limit }, { x: x1, y: limit }];
    } else {
        var m = (y2 - y1) / (x2 - x1);
        if (m === 0) {
            ends = [{ x: -limit, y: y1 }, { x: limit, y: y1 }];
        } else {
            var b = y1 - m * x1;
            var cand = [
                { x: -limit, y: m * (-limit) + b },
                { x: limit, y: m * limit + b },
                { x: (-limit - b) / m, y: -limit },
                { x: (limit - b) / m, y: limit }
            ];
            cand = cand.filter(function (pt) { return pt.x >= -limit - 1e-9 && pt.x <= limit + 1e-9 && pt.y >= -limit - 1e-9 && pt.y <= limit + 1e-9; });
            cand.sort(function (a, c) { return a.x - c.x; });
            ends = [cand[0], cand[cand.length - 1]];
        }
    }
    svg += '<line x1="' + sx(ends[0].x) + '" y1="' + sy(ends[0].y) + '" x2="' + sx(ends[1].x) + '" y2="' + sy(ends[1].y) + '" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>';

    if (showHelpers && !problem.undefinedSlope) {
        var riseVal = y2 - y1, runVal = x2 - x1;
        svg += '<line x1="' + sx(x1) + '" y1="' + sy(y1) + '" x2="' + sx(x1) + '" y2="' + sy(y2) + '" stroke="#0d9488" stroke-width="2" stroke-dasharray="5,4"/>';
        svg += '<line x1="' + sx(x1) + '" y1="' + sy(y2) + '" x2="' + sx(x2) + '" y2="' + sy(y2) + '" stroke="#0d9488" stroke-width="2" stroke-dasharray="5,4"/>';
        svg += '<text x="' + (sx(x1) - 6) + '" y="' + (sy((y1 + y2) / 2) + 3) + '" font-size="11" font-weight="800" fill="#0f766e" text-anchor="end">' + riseVal + '</text>';
        svg += '<text x="' + (sx((x1 + x2) / 2)) + '" y="' + (sy(y2) + (riseVal < 0 ? -8 : 16)) + '" font-size="11" font-weight="800" fill="#0f766e" text-anchor="middle">' + runVal + '</text>';
    }

    /* design item 19: the marked points were mint-green #059669, and green is
       reserved for success - a green dot on an unanswered question reads as
       "already right". Ink navy instead: 13.6:1 on the white grid, and much
       darker than the violet line, so the dots stay easy to tell from the
       curve. The 2px white halo keeps them readable where they sit on it. */
    svg += '<circle cx="' + sx(x1) + '" cy="' + sy(y1) + '" r="5.5" fill="#1e2a5e" stroke="white" stroke-width="2"/>';
    svg += '<circle cx="' + sx(x2) + '" cy="' + sy(y2) + '" r="5.5" fill="#1e2a5e" stroke="white" stroke-width="2"/>';
    svg += '</svg>';
    return svg;
}

function getHintText(p) {
    switch (p.subtype) {
        case 'graph-simple':
        case 'graph-fraction':
            return 'Find the two marked points. Count how many units you move up or down (rise) and how many units right (run) to get from one point to the other. Slope = rise / run.';
        case 'graph-horizontal':
            return 'This line is perfectly flat. A flat line never rises, so its slope is always 0.';
        case 'graph-vertical':
            return 'This line goes straight up and down without ever moving left or right. Lines like this have an undefined slope.';
        case 'two-points':
        case 'two-points-fraction':
            return 'Use the slope formula: the change in y goes on top, the change in x goes on the bottom. Subtract the y-values, then subtract the x-values in the same order, and divide.';
        case 'eq-horizontal-line':
            return 'There is no x in this equation. Every point on it has the same y-value, so the line is perfectly flat and its slope is 0.';
        case 'eq-slope-intercept':
            return 'This equation is written as y = mx + b. The slope is the number in front of x (the coefficient of x).';
        case 'eq-standard-form':
            return 'Solve the equation for y. Move the x-term to the other side, then divide every term by the number in front of y. Once it looks like y = mx + b, the number in front of x is the slope.';
        case 'eq-standard-vertical':
            return 'There is no y in this equation, which means it describes a vertical line. Vertical lines have an undefined slope.';
        case 'meaning':
            return 'Slope represents a constant RATE of change - how much the output changes for each one-unit increase in the input. A one-time fee or starting amount is NOT the slope; that is the intercept.';
    }
    return '';
}
function setExpanded(btnId, isOpen) {

/* Revealing the answer (Show Answer) or walking the worked solution
   (Show Solution) costs exactly what a wrong first attempt costs: the problem
   is booked as attempted, it can no longer earn the correct tally, and the
   streak ends. Without this a student could reveal, type the slope straight
   back and score a clean 1/1 with the streak intact, which quietly inflated
   every accuracy figure on the stats panel.

   It works by setting currentProblem.attempted, the same flag a first
   submission sets, so handleAnswer() below sees firstTry === false and its
   existing bookkeeping withholds the credit for us -- no grading logic is
   restructured. Show HINT stays free: every hint here is strategy
   ("count the rise, then the run"), never the answer. */
function recordReveal() {
    if (!currentProblem || currentProblem.attempted || currentProblem.locked) return;
    currentProblem.attempted = true;

function buildSolutionHTML(p) {
    var d = p.data;
    var html = '<div style="font-weight:800;margin-bottom:8px;">Solution</div>';
    if (p.subtype === 'graph-simple' || p.subtype === 'graph-fraction') {

        html += '<div>Moving from one marked point to the other:</div>';
        html += '<div style="margin:6px 0;">Rise = ' + rise + ' &nbsp;&nbsp; Run = ' + run + '</div>';
        html += '<div>Slope = ' + fracHTMLParts('rise', 'run', 'rise over run')

    } else if (p.subtype === 'graph-vertical') {
        html += '<div>This line never runs left or right (run = 0). Since we cannot divide by 0, the slope is <b>undefined</b>.</div>';
    } else if (p.subtype === 'two-points' || p.subtype === 'two-points-fraction') {

            'y<sub>2</sub> - y<sub>1</sub>',

        html += '<div><b>Step 2.</b> Substitute the two points '

        html += '<div style="margin:4px 0 10px;">slope = ' + fracHTMLParts(

        html += '<div><b>Step 3.</b> Subtract on the top and on the bottom:</div>';
        html += '<div style="margin:4px 0 10px;">slope = ' + fracHTMLRaw(rise2, run2) + '</div>';

    } else if (p.subtype === 'eq-horizontal-line') {
        html += '<div>The equation <b>y = ' + d.C + '</b> has no x-term, so y is always ' + d.C + ' no matter what x is.</div>';
        html += '<div style="margin:6px 0;">That describes a horizontal line, which never rises.</div>';
        html += '<div>Rise = 0, so slope = <b>0</b>.</div>';
    } else if (p.subtype === 'eq-slope-intercept') {
        html += '<div>This equation is already in y = mx + b form:</div>';
        html += '<div style="margin:6px 0;">' + equationHTML(p) + '</div>';
        html += '<div>The coefficient of x is the slope: m = <b>' + fracHTML(p.correctSlope) + '</b></div>';
    } else if (p.subtype === 'eq-standard-form') {
        var A = d.A, B = d.B, C = d.C;
        var slope = simplifyFrac(-A, B);
        var inter = simplifyFrac(C, B);
        var moveWord = (A > 0 ? 'Subtract ' + termStr(A, 'x') + ' from' : 'Add ' + termStr(-A, 'x') + ' to') + ' both sides';
        var rhs = termStr(-A, 'x') + (C !== 0 ? (C > 0 ? ' + ' + C : ' - ' + Math.abs(C)) : '');

        html += '<div style="margin:4px 0 10px;"><b>' + termStr(B, 'y') + ' = ' + rhs + '</b></div>';
        var xTerm;
        if (slopeStr === '1') xTerm = 'x';
        else if (slopeStr === '-1') xTerm = '-x';
        else if (slope.den === 1) xTerm = slopeStr + 'x';
        else xTerm = fracHTML(slope) + 'x';
        /* dividing by 1 changes nothing, so skip that step entirely */
        if (B !== 1) {
            html += '<div><b>Step ' + (st++) + '.</b> Divide every term by ' + B + ' to get y alone:</div>';
            html += '<div style="margin:4px 0 10px;"><b>y = ' + xTerm + interPart + '</b></div>';
        }
        html += '<div><b>Step ' + (st++) + '.</b> The equation is now in y = mx + b form. The number in front of x is the slope:</div>';
        html += '<div style="margin:4px 0 0;">slope = <b>' + fracHTML(p.correctSlope) + '</b></div>';
    } else if (p.subtype === 'eq-standard-vertical') {

        html += '<div style="margin:6px 0;"><b>' + escUnits(correctChoice.text) + '</b></div>';
        html += '<div>The other choices describe a fixed starting amount, a total, or a swapped rate - not the rate of change itself.</div>';

}

/* =====================================================================
   Answer parsing & checking (numeric problems)
   ===================================================================== */
function parseSlopeInput(str) {
    if (str == null) return null;
    var s = str.trim().toLowerCase();
    if (s === '') return null;
    if (s === 'undefined' || s === 'no slope' || s === 'none' || s === 'und' || s === 'n/a') return { undefinedSlope: true };
    s = s.replace(/\s+/g, '');
    var neg = false;
    if (s.charAt(0) === '+') { s = s.slice(1); }
    if (s.charAt(0) === '-') { neg = true; s = s.slice(1); }
    /* A sign is now allowed on the denominator too: a student who writes 3/-4
       or -3/-4 has given a correct equivalent form and was previously told the
       answer was unreadable. */
    if (!/^\d*\.?\d+(\/[+-]?\d*\.?\d+)?$/.test(s)) return null;
    var numV, denV;
    if (s.indexOf('/') !== -1) {
        var parts = s.split('/');
        if (parts.length !== 2) return null;
        numV = parseFloat(parts[0]); denV = parseFloat(parts[1]);
    } else {
        numV = parseFloat(s); denV = 1;
    }
    if (!isFinite(numV) || !isFinite(denV)) return null;
    if (denV === 0) return { dividedByZero: true };
    if (neg) numV = -numV;
    return { num: numV, den: denV };
}
function isAnswerCorrect(problem, userParsed) {
    if (!userParsed) return false;
    if (userParsed.dividedByZero) return false;
    if (problem.undefinedSlope) return !!userParsed.undefinedSlope;
    if (userParsed.undefinedSlope) return false;
    var correctVal = problem.correctSlope.num / problem.correctSlope.den;
    var userVal = userParsed.num / userParsed.den;
    return Math.abs(correctVal - userVal) < 1e-6;
}
/* Pass 4: a wrong answer should say WHERE the mistake is, not merely that one
   exists. These are the four errors this topic actually produces. */
function diagnoseSlope(problem, userParsed) {
    if (!userParsed) return '';
    if (problem.undefinedSlope) {
        if (!userParsed.undefinedSlope) {
            return ' This line has no run at all - the two points share the same x-value, so the fraction would divide by zero.';
        }
        return '';
    }
    if (userParsed.undefinedSlope) {
        return ' This line does have a run, so its slope is a number. Only a vertical line has an undefined slope.';
    }
    var c = problem.correctSlope.num / problem.correctSlope.den;
    var u = userParsed.num / userParsed.den;
    if (c !== 0 && Math.abs(u + c) < 1e-6) {
        return ' The size is right but the sign is wrong: this line ' + (c > 0 ? 'rises' : 'falls')
            + ' from left to right, so the slope must be ' + (c > 0 ? 'positive' : 'negative') + '.';
    }
    if (u !== 0 && c !== 0 && Math.abs(u - 1 / c) < 1e-6) {
        return ' That is run over rise. Slope is rise over run - divide the change in y by the change in x, not the other way round.';
    }
    if (Math.abs(u) < 1e-6 && c !== 0) {
        return ' A slope of 0 means a perfectly flat line. This line does change height as it moves right.';
    }
    if ((u > 0) === (c > 0) && Math.abs(u) > 1e-6) {
        return ' The sign is right, so check the numbers: count the rise between the two points, then the run.';
    }
    return ' Check the rise and the run between the two points, and watch the sign.';
}
function ensureStats(cat) {
    if (!categoryStats[cat]) categoryStats[cat] = { c: 0, t: 0 };
    return categoryStats[cat];
}

/* =====================================================================
   Shared answer handling.
   Scoring rule: each problem counts ONCE, scored on the first attempt.
   Retries are unlimited and never add to the denominator.
   ===================================================================== */
var PRAISE_FIRST = ['Correct!', 'Nice work!', 'Exactly right!', 'Well done!', 'You got it!', 'Perfect!'];
var PRAISE_RETRY = ['That\'s it!', 'Got it!', 'Yes  -  nice recovery!', 'There you go!'];

function handleAnswer(isCorrect, detailText, whyWrong) {
    var feedback = document.getElementById('feedback');
    var stats = ensureStats(currentProblem.category);
    var firstTry = !currentProblem.attempted;
    currentProblem.attempted = true;

    if (firstTry) {
        stats.t++; overallStats.t++;
        if (isCorrect) { stats.c++; overallStats.c++; }
    }

    if (isCorrect) {
        currentProblem.locked = true;
        var tail = detailText ? ' ' + detailText : '';
        if (firstTry) {
            streak++;
            if (streak > bestStreak) bestStreak = streak;
            /* innerHTML on the success path only: detailText carries a stacked
               fraction built purely from numbers. The incorrect path stays on
               textContent - whyWrong is plain prose and nothing there is
               generated markup. */
            if (streak % 10 === 0) {
                feedback.className = 'feedback correct victory';
                feedback.innerHTML = streak + ' IN A ROW!' + tail;
                createConfetti(200, 3);
            } else if (streak % 5 === 0) {
                feedback.className = 'feedback correct victory';
                feedback.innerHTML = streak + ' in a row!' + tail;
                createConfetti(120, 2);
            } else {
                feedback.className = 'feedback correct';
                feedback.innerHTML = pick(PRAISE_FIRST) + tail;
            }
        } else {
            feedback.className = 'feedback correct';
            feedback.innerHTML = pick(PRAISE_RETRY) + tail;
        }
        document.getElementById('next-btn').style.display = 'inline-block';
    } else {
        if (firstTry) { streak = 0; }
        feedback.className = 'feedback incorrect';
        feedback.textContent = 'Not quite.' + (whyWrong ? whyWrong : ' Try again!');
    }
    updateDisplay();
    saveState();
}

function checkAnswer() {
    if (currentProblem.locked) return;
    var ansEl = document.getElementById('answer');
    var val = ansEl.value;
    if (val === '') return;
    var parsed = parseSlopeInput(val);
    var feedback = document.getElementById('feedback');
    if (!parsed) {
        feedback.className = 'feedback incorrect';
        feedback.textContent = 'Enter a number, a fraction like 2/3, or the word undefined.';
        return;
    }
    if (parsed.dividedByZero) {
        feedback.className = 'feedback incorrect';
        feedback.textContent = 'A fraction cannot have 0 on the bottom. If the run is 0, the slope is undefined - type the word undefined.';
        return;
    }
    var correct = isAnswerCorrect(currentProblem, parsed);
    if (correct) {
        ansEl.disabled = true;
        document.getElementById('submit-btn').disabled = true;
    } else {
        ansEl.value = '';
        ansEl.focus();
    }
    handleAnswer(correct, 'Slope = ' + fracHTML(currentProblem.correctSlope),
                 diagnoseSlope(currentProblem, parsed));
}

function selectChoice(idx) {
    if (currentProblem.locked) return;
    var choice = currentProblem.data.choices[idx];
    var btn = document.getElementById('choice-' + idx);
    if (choice.correct) {
        btn.className = 'choice-btn correct-reveal';
        currentProblem.data.choices.forEach(function (c, i) {
            document.getElementById('choice-' + i).disabled = true;
        });
        handleAnswer(true, '');
    } else {
        btn.className = 'choice-btn wrong-picked';
        btn.disabled = true;
        handleAnswer(false, '',
            ' That choice names a starting amount, a total, or a swapped rate. The slope is the amount that is added or removed for each single unit of the input.');
    }
}

/* =====================================================================
   Category tiles: native radios (single-select, arrow-key navigable)
   ===================================================================== */
function renderCategoryTiles() {
    var html = '';
    TILES.forEach(function (cat) {
        var sel = (selectedCategory === cat);
        var id = 'cat-' + cat;
        html += '<input type="radio" name="slope-category" class="tile-input sr-only" id="' + id + '"'
            + (sel ? ' checked' : '')
            + ' onchange="selectCategory(\'' + cat + '\')">'
            + '<label class="tile' + (cat === 'mixed' ? ' tile-mixed' : '') + '" for="' + id + '">'
            + esc(CATEGORY_LABELS[cat])
            + '</label>';
    });
    document.getElementById('category-tiles').innerHTML = html;
}
function selectCategory(cat) {
    if (TILES.indexOf(cat) === -1) return;
    if (selectedCategory === cat) return;
    selectedCategory = cat;
    renderCategoryTiles();
    saveState();
    generateProblem();
}
function activePool() {
    return selectedCategory === 'mixed' ? CATEGORIES : [selectedCategory];
}

/* =====================================================================
   Problem selection
   ===================================================================== */
function pickWeightedCategory(pool) {
    var weights = pool.map(function (cat) {
        var s = categoryStats[cat];
        if (!s || s.t < 3) return 1.0;
        return Math.max(0.2, 1 - (s.c / s.t));
    });
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < pool.length; i++) {
        r -= weights[i];
        if (r <= 0) return pool[i];
    }
    return pool[pool.length - 1];
}
function generateProblem() {
    document.getElementById('hint').style.display = 'none';
    document.getElementById('answer-box').style.display = 'none';
    document.getElementById('solution-box').style.display = 'none';
    setExpanded('hint-btn', false);
    setExpanded('answer-btn', false);
    setExpanded('solution-btn', false);
    var ansEl = document.getElementById('answer');
    if (ansEl) { ansEl.value = ''; ansEl.disabled = false; }
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('feedback').textContent = '';

    var cat = pickWeightedCategory(activePool());
    categoryEncounters[cat] = (categoryEncounters[cat] || 0) + 1;
    /* Anti-repeat: never serve the identical problem twice running. Bounded to
       12 attempts so a narrow generator can never spin forever. */
    var candidate = null, tries = 0;
    do {
        candidate = buildProblem(cat, categoryEncounters[cat]);
        tries++;
    } while (tries < 12 && lastProblemSignature && problemSignature(candidate) === lastProblemSignature);
    lastProblemSignature = problemSignature(candidate);
    currentProblem = candidate;
    renderProblem(currentProblem);
    announceProblem(currentProblem);
    updateDisplay();
}
function problemSignature(p) {
    if (!p) return '';
    if (p.kind === 'choice') return 'choice|' + p.data.scenario;
    if (p.kind === 'equation') return p.subtype + '|' + equationPlain(p);
    return p.subtype + '|' + p.data.x1 + ',' + p.data.y1 + ',' + p.data.x2 + ',' + p.data.y2;
}
function goNextProblem() {
    generateProblem();
}

/* =====================================================================
   Display
   ===================================================================== */
function updateDisplay() {
    document.getElementById('streak').textContent = streak;
    document.getElementById('best-streak').textContent = bestStreak;
    document.getElementById('overall-pct').textContent = pctText(overallStats.c, overallStats.t);
    renderCategoryTiles();
}

/* =====================================================================
   Confetti (8-colour Midnight Scholar palette)
   ===================================================================== */
function createConfetti(count, tier) {
    if (!confettiEnabled) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var host = document.body;
    /* design item 10: #ef4444 (red, not in the palette) and #f59e0b (orange,
       banned outright) swapped for mint and heritage rose. Still 8 colours. */
    var colors = ['#7c3aed', '#22c55e', '#2e3d8f', '#10b981', '#c76b8f', '#ffeb3b', '#0d9488', '#a78bfa'];
    var isMassive = tier === 3;
    for (var i = 0; i < count; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti';
        piece.setAttribute('aria-hidden', 'true');
        var base;
        if (tier === 1) base = 7 + Math.random() * 5;
        else if (tier === 2) base = 10 + Math.random() * 7;
        else base = 11 + Math.random() * 9;
        var color = colors[Math.floor(Math.random() * colors.length)];
        var shape = Math.floor(Math.random() * 4);
        if (shape === 0) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '50%';
        } else if (shape === 1) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else if (shape === 2) {
            piece.style.width = Math.max(4, base * 0.35) + 'px'; piece.style.height = (base * 1.7) + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else {
            piece.style.width = '0'; piece.style.height = '0'; piece.style.background = 'transparent';
            piece.style.borderLeft = (base * 0.6) + 'px solid transparent';
            piece.style.borderRight = (base * 0.6) + 'px solid transparent';
            piece.style.borderBottom = base + 'px solid ' + color;
        }
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-20px';
        var dur;
        if (tier === 1) dur = 1.3 + Math.random() * 0.8;
        else if (tier === 2) dur = 1.6 + Math.random() * 1.2;
        else dur = 2.0 + Math.random() * 1.6;
        piece.style.animation = (isMassive ? 'confetti-fall-slow' : 'confetti-fall') + ' ' + dur + 's ease-out forwards';
        piece.style.animationDelay = (Math.random() * (isMassive ? 0.8 : 0.4)) + 's';
        host.appendChild(piece);
        setTimeout((function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; })(piece), isMassive ? 6000 : 4500);
    }
    if (isMassive) {
        for (var j = 0; j < 15; j++) {
            var sp = document.createElement('div');
            sp.className = 'sparkle';
            sp.setAttribute('aria-hidden', 'true');
            sp.style.left = (Math.random() * 90 + 5) + '%';
            sp.style.top = (Math.random() * 55 + 10) + 'vh';
            sp.style.animationDelay = (Math.random() * 0.5) + 's';
            host.appendChild(sp);
            setTimeout((function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; })(sp), 3500);
        }
    }
}

/* =====================================================================
   Confetti setting (design item 9) - its own key so clearing progress
   does not silently turn the animation back on.
   ===================================================================== */
var CONFETTI_KEY = 'midnightScholar_slope_confetti_v1';
var confettiEnabled = true;
function loadConfettiSetting() {
    try {
        var v = localStorage.getItem(CONFETTI_KEY);
        if (v === '0') confettiEnabled = false;
        else if (v === '1') confettiEnabled = true;
    } catch (e) {}
}
function syncConfettiSwitch() {
    var btn = document.getElementById('confetti-switch');
    if (btn) btn.setAttribute('aria-pressed', confettiEnabled ? 'true' : 'false');
}
function toggleConfettiSetting() {
    confettiEnabled = !confettiEnabled;
    try { localStorage.setItem(CONFETTI_KEY, confettiEnabled ? '1' : '0'); } catch (e) {}
    syncConfettiSwitch();
}

/* =====================================================================
   Persistence (values sanitised on load - never trusted raw)
   ===================================================================== */
function safeCount(v) {
    var n = Number(v);
    if (!isFinite(n) || n < 0) return 0;
    return Math.floor(n);
}
function sanitizeStatBucket(obj) {
    var out = {};
    if (!obj || typeof obj !== 'object') return out;
    CATEGORIES.forEach(function (cat) {
        var s = obj[cat];
        if (s && typeof s === 'object') {
            var c = safeCount(s.c), t = safeCount(s.t);
            if (c > t) c = t;
            out[cat] = { c: c, t: t };
        }
    });
    return out;
}
function sanitizeEncounters(obj) {
    var out = {};
    if (!obj || typeof obj !== 'object') return out;
    CATEGORIES.forEach(function (cat) {
        if (Object.prototype.hasOwnProperty.call(obj, cat)) out[cat] = safeCount(obj[cat]);
    });
    return out;
}
function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            selectedCategory: selectedCategory,
            categoryStats: categoryStats,
            categoryEncounters: categoryEncounters,
            bestStreak: bestStreak,
            overallStats: overallStats
        }));
    } catch (e) {}
}
function loadState() {
    try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var s = JSON.parse(raw);
        if (typeof s.selectedCategory === 'string' && TILES.indexOf(s.selectedCategory) !== -1) {
            selectedCategory = s.selectedCategory;
        } else if (Object.prototype.toString.call(s.selectedCategories) === '[object Array]') {
            // migrate from the earlier multi-select format
            var filtered = s.selectedCategories.filter(function (c) { return CATEGORIES.indexOf(c) !== -1; });
            if (filtered.length > 1) selectedCategory = 'mixed';
            else if (filtered.length === 1) selectedCategory = filtered[0];
        }
        categoryStats = sanitizeStatBucket(s.categoryStats);
        categoryEncounters = sanitizeEncounters(s.categoryEncounters);
        bestStreak = safeCount(s.bestStreak);
        var oc = s.overallStats && typeof s.overallStats === 'object' ? s.overallStats : {};
        var c = safeCount(oc.c), t = safeCount(oc.t);
        if (c > t) c = t;
        overallStats = { c: c, t: t };
    } catch (e) {}
}
function resetProgress() {
    var btn = document.getElementById('reset-btn');
    if (!resetArmed) {
        resetArmed = true;
        btn.textContent = 'Tap again to confirm reset';
        if (resetTimeoutId) clearTimeout(resetTimeoutId);
        resetTimeoutId = setTimeout(function () {
            resetArmed = false;
            btn.textContent = 'Reset Progress';
        }, 3000);
        return;
    }
    if (resetTimeoutId) { clearTimeout(resetTimeoutId); resetTimeoutId = null; }
    resetArmed = false;
    categoryStats = {};
    categoryEncounters = {};
    bestStreak = 0;
    overallStats = { c: 0, t: 0 };
    selectedCategory = 'graph';
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    btn.textContent = 'Reset Progress';
    streak = 0;
    generateProblem();
    updateDisplay();
}

/* =====================================================================
   Input helpers
   ===================================================================== */
function toggleSign() {
    var el = document.getElementById('answer');
    if (!el || el.disabled) return;
    el.value = el.value.charAt(0) === '-' ? el.value.slice(1) : '-' + el.value;
    el.focus();
}
function insertSlash() {
    var el = document.getElementById('answer');
    if (!el || el.disabled) return;
    if (el.value.indexOf('/') === -1) el.value = el.value + '/';
    el.focus();
}
function insertUndefined() {
    var el = document.getElementById('answer');
    if (!el || el.disabled) return;
    el.value = 'undefined';
    el.focus();
}

/* =====================================================================
   Boot
   ===================================================================== */
loadState();
loadConfettiSetting();
syncConfettiSwitch();
renderCategoryTiles();
generateProblem();
updateDisplay();
setInterval(saveState, 5000);
</script>
