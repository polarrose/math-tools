        html += '<div style="text-align:center; margin-top:10px; font-weight:800; color:#047857;">That is the whole method. Try the next one yourself.</div>';
    }
    box.innerHTML = html;
    box.style.display = 'block';
}

function toggleAnswer() {
    var box = document.getElementById('answer-box');
    var btn = document.getElementById('answer-toggle');
    var p = currentProblem;
    if (box.style.display === 'none') {
        forfeitProblem();
        var visual = 'Corner box ' + p.a + '&nbsp; &middot;&nbsp; Top row ' + p.coeffs.join(', ') +
            '<br>Bottom row ' + p.sums.join(', ') +
            '<br>Quotient ' + polyHtml(p.quotient) + ', remainder ' + p.remainder;
        var spoken = 'Corner box ' + sayNum(p.a) + '. Top row ' + sayList(p.coeffs) +
            '. Bottom row ' + sayList(p.sums) + '. The quotient is ' + polySpoken(p.quotient) +
            ' with a remainder of ' + sayNum(p.remainder) + '.';
        box.innerHTML = '<div aria-hidden="true"><b>Answer:</b><br>' + visual + '</div>' +
            '<p class="sr-only">Answer. ' + escHtml(spoken) + '</p>';
        box.style.display = 'block';
        btn.setAttribute('aria-expanded', 'true');
        btn.textContent = 'Hide Answer';
    } else {
        box.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
        btn.textContent = 'Show Answer';
    }
}

function skipProblem() {
    forfeitProblem();
    problemNum++;
    newProblem();
    updateDisplay();
}

/* Turns a fragment of the problem markup into a sentence. The stacked fraction
   is a flex column and the exponent is a <sup>: both carry their meaning in
   layout alone, so neither says anything on its own. */
function spokenFromHtml(html) {
    var s = String(html);
    s = s.replace(/<span class="frac">\s*<span class="frac-num">([\s\S]*?)<\/span>\s*<span class="frac-bar"><\/span>\s*<span class="frac-den">([\s\S]*?)<\/span>\s*<\/span>/gi,
        function (m, num, den) { return ' the fraction ' + spokenFromHtml(num) + ' over ' + spokenFromHtml(den) + ' '; });
    s = s.replace(/<sup[^>]*>([\s\S]*?)<\/sup>/gi, ' to the power of $1 ');
    s = s.replace(/<br\s*\/?>/gi, '. ');
    s = s.replace(/<[^>]+>/g, ' ');
    s = s.replace(/&minus;/g, ' minus ').replace(/&times;/g, ' times ')
         .replace(/&middot;/g, ' ').replace(/&plusmn;/g, ' plus or minus ')
         .replace(/&nbsp;/g, ' ').replace(/&rarr;/g, ' gives ').replace(/&amp;/g, ' and ');
    s = s.replace(/\(/g, ' open parenthesis ').replace(/\)/g, ' close parenthesis ');
    s = s.replace(/=/g, ' equals ');
    s = s.replace(/(^|[\s(])-(\d)/g, '$1negative $2');
    /* Each <br> becomes a sentence break, so a paragraph gap turns into ".. ."
       and a screen reader reads the stutter aloud. Collapse any run of stops
       back to one. */
    s = s.replace(/(\.\s*){2,}/g, '. ');
    return s.replace(/\s+/g, ' ').trim();
}

/* =====================================================================
   Modes and display
   ===================================================================== */
function setMode(m) {
    mode = m;
    ['std', 'miss'].forEach(function (k) {
        var b = document.getElementById('mode-' + k);
        if (!b) return;
        var on = (k === m);
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    /* The streak deliberately survives a change of category. A problem here is
       eleven to fifteen boxes, so a student might only do two or three of one
       kind before moving on -- zeroing the count on the way would mean they
       could work steadily all session and never reach the first celebration at
       3. The streak counts consecutive problems solved, not consecutive
       problems of one type. */
    newProblem();
    updateDisplay();
}
function toggleConfettiSetting() {
    confettiEnabled = document.getElementById('confettiToggle').checked;
    saveState();
}
function updateDisplay() {
    document.getElementById('problemNum').textContent = problemNum + 1;
    document.getElementById('streak').textContent = streak;
    var sd = document.getElementById('streak-display');
    sd.className = streak >= 4 ? 'info-item streak-hot' : 'info-item';
    var tc = 0, tt = 0, i;
    for (i = 0; i < CATS.length; i++) { tc += stats[CATS[i]].c; tt += stats[CATS[i]].t; }
    var acc = document.getElementById('acc-display');
    acc.textContent = tt > 0 ? 'Accuracy: ' + Math.round(tc / tt * 100) + '%' : 'Accuracy: --';
}

/* =====================================================================
   Stats panel
   ===================================================================== */
function showStats() {
    var clean = sanitizeStats(stats);
    var tc = 0, tt = 0, i;
    for (i = 0; i < CATS.length; i++) { tc += clean[CATS[i]].c; tt += clean[CATS[i]].t; }
    var overall = tt > 0 ? Math.round(tc / tt * 100) : 0;

    var html = '<h2 id="stats-heading">My Stats</h2>';
    html += '<div class="stats-overall">';
    if (tt > 0) {
        html += '<div class="big">' + escHtml(overall) + '%</div>';
        html += '<div class="lbl">' + escHtml(tc) + ' solved out of ' + escHtml(tt) + ' problems</div>';
    } else {
        html += '<div class="big" style="color:#4a5480;" aria-hidden="true">--</div>';
        html += '<div class="lbl">No problems attempted yet.</div>';
    }
    html += '<div class="lbl" style="margin-top:6px;">Best streak: ' + escHtml(bestStreak) + '</div>';
    html += '</div>';

    for (i = 0; i < CATS.length; i++) {
        var k = CATS[i], s = clean[k];
        var pct = s.t > 0 ? Math.round(s.c / s.t * 100) : 0;
        /* Addendum item 2: three tiers, hue AND lightness, always with the
           numbers beside them so the tier survives greyscale. */
        var cls = 'none';
        if (s.t > 0) cls = (pct >= 80) ? 'full' : (pct >= 55 ? 'mid' : 'low');
        /* Addendum item 5: a category never attempted reads "not tried yet",
           never 0/0 -- a zero there looks like failure at something unseen. */
        var numText = s.t > 0 ? s.c + '/' + s.t + ' (' + pct + '%)' : 'not tried yet';
        var spokenRow = s.t > 0
            ? CAT_LABELS[k] + ': ' + s.c + ' solved out of ' + s.t + ', ' + pct + ' percent'
            : CAT_LABELS[k] + ': not tried yet';
        html += '<div class="stat-row">';
        html += '<div class="stat-name" aria-hidden="true">' + escHtml(CAT_LABELS[k]) + '</div>';
        html += '<div class="stat-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
            escHtml(s.t > 0 ? pct : 0) + '" aria-label="' + escHtml(spokenRow) + '">' +
            '<div class="stat-bar ' + cls + '" style="width:' + escHtml(s.t > 0 ? pct : 0) + '%;"></div></div>';
        html += '<div class="stat-num" aria-hidden="true">' + escHtml(numText) + '</div>';
        html += '</div>';
    }

    var rec = buildRecommendation(clean);
    if (rec) html += '<div class="recommend">' + rec + '</div>';

    html += '<div class="stats-actions">';
    html += '<button type="button" class="close-btn" onclick="hideStats()">Close</button>';
    html += '<button type="button" class="reset-btn' + (resetConfirming ? ' armed' : '') + '" id="reset-btn" onclick="resetProgress()">' +
        (resetConfirming ? 'Tap again to confirm' : 'Reset Progress') + '</button>';
    html += '</div>';

    var panel = document.getElementById('stats-panel');
    panel.innerHTML = html;
    document.getElementById('stats-overlay').style.display = 'flex';
    panel.focus();
}
function buildRecommendation(clean) {
    var untried = CATS.filter(function (k) { return clean[k].t === 0; });
    var tried = CATS.filter(function (k) { return clean[k].t > 0; });
    if (tried.length === 0) return null;
    /* The row for that category already reads "not tried yet" two lines above,
       so spelling out that the overall figure is incomplete just says it twice. */
    if (untried.length > 0) {
        return '<b>Try this next:</b> ' + escHtml(CAT_LABELS[untried[0]]) + '.';
    }
    var weakest = null, weakestPct = 101;
    CATS.forEach(function (k) {
        if (clean[k].t < 3) return;
        var p = clean[k].c / clean[k].t * 100;
        if (p < weakestPct) { weakestPct = p; weakest = k; }
    });
    if (!weakest) return null;
    if (weakestPct >= 85) return '<b>Strong across both categories!</b> Keep going.';
    /* Names the category to practise next without labelling the student weak at
       it -- the percentage beside it already says where they are. */
    return '<b>Practise next:</b> ' + escHtml(CAT_LABELS[weakest]) + ' (' +
        Math.round(weakestPct) + '%). Switch to that category for some focused practice.';
}
function hideStats() {
    document.getElementById('stats-overlay').style.display = 'none';
    disarmReset();
    var opener = document.getElementById('stats-btn');
    if (opener) opener.focus();
}
/* Two-tap confirm that re-arms after 3.5s, so a stray tap minutes later cannot
   wipe the record. The label is rewritten in place rather than by re-rendering
   the panel, so the timer never steals focus. Never a browser confirm(). */
var RESET_DISARM_MS = 3500;
var resetDisarmTimer = null;
function disarmReset() {
    if (resetDisarmTimer) { clearTimeout(resetDisarmTimer); resetDisarmTimer = null; }
    if (!resetConfirming) return;
    resetConfirming = false;
    var btn = document.getElementById('reset-btn');
    if (btn) { btn.textContent = 'Reset Progress'; btn.className = 'reset-btn'; }
}
function resetProgress() {
    if (!resetConfirming) {
        resetConfirming = true;
        var btn = document.getElementById('reset-btn');
        if (btn) { btn.textContent = 'Tap again to confirm'; btn.className = 'reset-btn armed'; }
        announce('Tap Reset Progress again within 3.5 seconds to erase your stats.');
        if (resetDisarmTimer) clearTimeout(resetDisarmTimer);
        resetDisarmTimer = setTimeout(disarmReset, RESET_DISARM_MS);
        return;
    }
    disarmReset();
    stats = { std: { c: 0, t: 0 }, miss: { c: 0, t: 0 } };
    streak = 0; bestStreak = 0; problemNum = 0;
    stdCount = 0; missCount = 0;
    saveState();
    updateDisplay();
    showStats();
}
document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var ov = document.getElementById('stats-overlay');
    if (ov && ov.style.display !== 'none') hideStats();
});

/* =====================================================================
   Confetti
   ===================================================================== */
function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
/* Confetti schedule: 3, 5, 8, 10, and on for ever -- 13, 15, 18, 20, 23, 25...
   Every streak that is 3 or 0 past a multiple of five, which is what makes the
   alternating +2 / +3 rhythm carry on indefinitely instead of stopping at a
   hand-written last entry. Milestones only, never every problem.

   The tier mapping matches Polynomial Operations, the reference implementation
   of this schedule: the 3-mark is the small burst, the 5-mark the fuller one,
   and the round tens the big slow one. Tier 1 uses 50 pieces rather than 40 so
   a real celebration is never identical to the toggle's preview burst. */
function confettiTierFor(s) {
    if (s < 3) return 0;
    if (s % 10 === 0) return 3;               // 10, 20, 30 -- the big one
    if (s % 5 === 0) return 2;                // 5, 15, 25
    if (s % 5 === 3) return 1;                // 3, 8, 13, 18
    return 0;
}
function confettiCountFor(tier) {
    return tier === 1 ? 50 : tier === 2 ? 100 : 200;
}
function celebrateStreak(s) {
    if (!confettiEnabled || prefersReducedMotion()) return;
    var tier = confettiTierFor(s);
    if (!tier) return;
    createConfetti(confettiCountFor(tier), tier);
}
function createConfetti(count, tier) {
    var host = document.body;
    /* Eight colours, eight hue families -- the palette chosen for Polynomial
       Operations and now the suite standard. The previous set put three
       greens/teals and two violets in eight slots, so at 200 pieces it averaged
       into one greenish-purple haze and only the yellow read as separate.
       Violet and mint stay as the brand anchors; the redundant teal and green go.

       The orange and the red here are a DOCUMENTED EXEMPTION from the suite's
       no-orange, no-red rule, not a relaxation of it. That rule exists because
       those colours mean error and warning everywhere else -- incorrect feedback
       is deliberately ink navy so being wrong never reads as an alarm. Confetti
       never shares the screen with a wrong-answer message, so the exemption does
       not collide with it. Do not "fix" these back. */
    var colors = ['#7c3aed', '#a78bfa', '#2e3d8f', '#10b981',
                  '#ffeb3b', '#fb923c', '#ef4444', '#ec4899'];
    var isMassive = tier === 3, i, j;
    for (i = 0; i < count; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti';
        piece.setAttribute('aria-hidden', 'true');
        var base;
        if (tier === 1) base = 7 + Math.random() * 5;
        else if (tier === 2) base = 10 + Math.random() * 7;
        else base = 11 + Math.random() * 9;
        var color = colors[Math.floor(Math.random() * colors.length)];
        var shape = Math.floor(Math.random() * 4);
        if (shape === 0) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '50%';
        } else if (shape === 1) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else if (shape === 2) {
            piece.style.width = Math.max(4, base * 0.35) + 'px'; piece.style.height = (base * 1.7) + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else {
            piece.style.width = '0'; piece.style.height = '0'; piece.style.background = 'transparent';
            piece.style.borderLeft = (base * 0.6) + 'px solid transparent';
            piece.style.borderRight = (base * 0.6) + 'px solid transparent';
            piece.style.borderBottom = base + 'px solid ' + color;
        }
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-20px';
        var dur;
        if (tier === 1) dur = 1.6 + Math.random() * 1.0;
        else if (tier === 2) dur = 2.0 + Math.random() * 1.5;
        else dur = 2.5 + Math.random() * 2.0;
        piece.style.animation = (isMassive ? 'confetti-fall-slow' : 'confetti-fall') + ' ' + dur + 's ease-out forwards';
        piece.style.animationDelay = (Math.random() * (isMassive ? 0.8 : 0.4)) + 's';
        host.appendChild(piece);
        setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(piece), isMassive ? 6000 : 4500);
    }
    if (isMassive) {
        for (j = 0; j < 15; j++) {
            var sp = document.createElement('div');
            sp.className = 'sparkle';
            sp.setAttribute('aria-hidden', 'true');
            sp.style.left = (Math.random() * 90 + 5) + '%';
            sp.style.top = (Math.random() * 55 + 10) + 'vh';
            sp.style.animationDelay = (Math.random() * 0.5) + 's';
            host.appendChild(sp);
            setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(sp), 3500);
        }
    }
}

/* =====================================================================
   Boot
   ===================================================================== */
/* Polar Rose Studio insignia: r = 2cos(3/2 theta) */
function drawInsignia() {
    var el = document.getElementById('pr-rose');
    if (!el) return;
    var pts = [], steps = 240, i;
    for (i = 0; i <= steps; i++) {
        var t = (i / steps) * 4 * Math.PI;
        var r = 2 * Math.cos(1.5 * t);
        pts.push((i === 0 ? 'M' : 'L') + (r * Math.cos(t) * 12).toFixed(2) + ' ' + (r * Math.sin(t) * 12).toFixed(2));
    }
    el.setAttribute('d', pts.join(' '));
}

drawInsignia();
loadState();
newProblem();
updateDisplay();
</script>
