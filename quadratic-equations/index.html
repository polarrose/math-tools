}


function incorrectFeedbackText(checkShift) {
    if (checkShift && !shiftHintGiven && currentProblem.isShifted) {
        shiftHintGiven = true;
        return 'Did you remember to move everything to one side and get zero on the other side?';
    }
    return 'Not quite right. Try again!';
}

/* The violet ring alone is colour-only error signalling; aria-invalid gives a
   screen reader the same information. */
function markField(el, ok) {
    if (!el) return;
    el.classList.toggle('field-error', !ok);
    if (ok) el.removeAttribute('aria-invalid'); else el.setAttribute('aria-invalid', 'true');
}
function checkAnswer() {
    var cat = currentProblem.category;
    var feedback = document.getElementById('feedback');

    if (currentProblem.inputMode === 'radicalStructured') {
        if (quadFormulaPart === 1) {
            var elNum = document.getElementById('ansNum');
            var elRad = document.getElementById('ansRad');
            var elDen = document.getElementById('ansDen');
            var rawNum = elNum.value, rawRad = elRad.value, rawDen = elDen.value;
            if (rawNum.trim() === '' || rawRad.trim() === '' || rawDen.trim() === '') {
                setFeedback('Fill in all three boxes first.', 'incorrect');
                return;
            }
            var uNum = parseFraction(rawNum), uRad = parseFraction(rawRad), uDen = parseFraction(rawDen);
            if (isNaN(uNum) || isNaN(uRad) || isNaN(uDen)) {
                feedback.textContent = "Couldn't read that as a number \u2014 check your entries and try again.";
                feedback.className = 'feedback incorrect';
                return;
            }
            var sa = currentProblem.structuredAnswer;
            var numOk = closeEnough(uNum, sa.numerator, 0.001);
            var radOk = closeEnough(uRad, sa.radicand, 0.001);
            var denOk = closeEnough(uDen, sa.denominator, 0.001);
            var part1Correct = numOk && radOk && denOk;
            markField(elNum, numOk); markField(elRad, radOk); markField(elDen, denOk);
            /* chargeReveal() already booked this problem as attempted, so do
               not book it a second time -- and do not credit it below. */
            if (!revealCharged) stats[cat].t++;

            if (!part1Correct) {
                streak = 0;
                stopTimer();
                updateDisplay();
                feedback.textContent = incorrectFeedbackText(true) + ' Check the highlighted box(es).';
                feedback.className = 'feedback incorrect';
                saveState();
                return;
            }

            if (!revealCharged) stats[cat].c++;
            saveState();

            if (currentProblem.needsSimplification) {
                quadFormulaPart = 2;
                document.getElementById('hint').style.display = 'none';
                document.getElementById('answer-box').style.display = 'none';
                document.getElementById('solution-box').style.display = 'none';
                setFeedback('Part 1 correct. Now simplify completely.', 'correct');
                render();
                var mc = document.getElementById('main-content');
                if (mc && mc.scrollIntoView) mc.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                recordFullCorrectAnswer(feedback);
            }
            return;
        } else {
            var elNum2 = document.getElementById('ansNum2');
            var elCoeff2 = document.getElementById('ansCoeff2');
            var elRad2 = document.getElementById('ansRad2');
            var elDen2 = document.getElementById('ansDen2');
            var rawNum2 = elNum2.value, rawCoeff2 = elCoeff2.value, rawRad2 = elRad2.value, rawDen2 = elDen2.value;
            if (rawNum2.trim() === '' || rawRad2.trim() === '' || rawDen2.trim() === '') {
                setFeedback('Fill in the numerator, the number under the root and the denominator first.', 'incorrect');
                return;
            }
            if (rawCoeff2 === '') rawCoeff2 = '1';
            var uNum2 = parseFraction(rawNum2), uCoeff2 = parseFraction(rawCoeff2), uRad2 = parseFraction(rawRad2), uDen2 = parseFraction(rawDen2);
            if (isNaN(uNum2) || isNaN(uCoeff2) || isNaN(uRad2) || isNaN(uDen2)) {
                feedback.textContent = "Couldn't read that as a number \u2014 check your entries and try again.";
                feedback.className = 'feedback incorrect';
                return;
            }
            var sa2 = currentProblem.simplifiedAnswer;
            var numOk2 = closeEnough(uNum2, sa2.numerator, 0.001);
            var coeffOk2 = closeEnough(uCoeff2, sa2.coeff, 0.001);
            var radOk2 = closeEnough(uRad2, sa2.radicand, 0.001);
            var denOk2 = closeEnough(uDen2, sa2.denominator, 0.001);
            var part2Correct = numOk2 && coeffOk2 && radOk2 && denOk2;
            markField(elNum2, numOk2); markField(elCoeff2, coeffOk2);
            markField(elRad2, radOk2); markField(elDen2, denOk2);
            if (!revealCharged) stats[cat].t++;

            if (part2Correct) {
                if (!revealCharged) stats[cat].c++;
                saveState();
                recordFullCorrectAnswer(feedback);
            } else {
                feedback.textContent = incorrectFeedbackText(false) + ' Check the highlighted box(es).';
                feedback.className = 'feedback incorrect';
                saveState();
            }
            return;
        }
    }

    var correct = false;
    if (currentProblem.answerType === 'single') {
        var elS = document.getElementById('answer');
        var raw = elS.value;
        if (raw.trim() === '') {
            setFeedback('Enter your answer first.', 'incorrect');
            return;
        }

        if (currentProblem.requiresFraction) {
            if (raw.indexOf('.') !== -1) {
                feedback.textContent = 'Please enter the exact answer as a fraction, not a decimal.';
                feedback.className = 'feedback incorrect';
                return;
            }
            var fparts = raw.split('/');
            if (fparts.length !== 2) {
                feedback.textContent = 'This answer is a fraction \u2014 enter it in the form a/b.';
                feedback.className = 'feedback incorrect';
                return;
            }
            var nsRaw = fparts[0].trim(), dsRaw = fparts[1].trim();
            var uN = /^[+-]?\d+$/.test(nsRaw) ? parseInt(nsRaw, 10) : NaN;
            var uD = /^[+-]?\d+$/.test(dsRaw) ? parseInt(dsRaw, 10) : NaN;
            if (isNaN(uN) || isNaN(uD) || uD === 0) {
                feedback.textContent = 'That is not a valid fraction \u2014 try again.';
                feedback.className = 'feedback incorrect';
                return;
            }
            var valueMatches = closeEnough(uN / uD, currentProblem.answer, 0.0001);
            var inLowestTerms = (uN === currentProblem.fractionNum && uD === currentProblem.fractionDen);
            if (valueMatches && !inLowestTerms) {
                feedback.textContent = 'Right value \u2014 now write it in lowest terms.';
                feedback.className = 'feedback incorrect';
                return;
            }
            correct = valueMatches && inLowestTerms;
        } else {
            var userNum = parseFraction(raw);
            correct = !isNaN(userNum) && closeEnough(userNum, currentProblem.answer, 0.001);
        }
    } else {
        var el1 = document.getElementById('ans1');
        var el2 = document.getElementById('ans2');
        var raw1 = el1.value, raw2 = el2.value;
        if (raw1.trim() === '' || raw2.trim() === '') {
            setFeedback('Enter both solutions first.', 'incorrect');
            return;
        }
        var u1 = parseFraction(raw1), u2 = parseFraction(raw2);
        if (isNaN(u1) || isNaN(u2)) {
            var fbBad = document.getElementById('feedback');
            fbBad.textContent = "Couldn't read that as a number \u2014 check your entries and try again.";
            fbBad.className = 'feedback incorrect';
            return;
        }
        correct = checkPair(currentProblem.roots, u1, u2, 0.01);
    }

    if (!revealCharged) stats[cat].t++;

    if (correct) {
        if (!revealCharged) stats[cat].c++;
        saveState();
        recordFullCorrectAnswer(feedback);
    } else {
        streak = 0;
        stopTimer();
        updateDisplay();
        feedback.textContent = incorrectFeedbackText(true);
        feedback.className = 'feedback incorrect';
        saveState();
    }
}

function recordFullCorrectAnswer(feedback) {
    /* A problem whose answer was shown is not a clean solve: chargeReveal() has
       already ended the streak and booked the attempt, so this one neither
       earns credit (above) nor restarts the streak here. */
    if (revealCharged) {
        updateDisplay();
        feedback.textContent = 'Correct - but the answer was shown, so this one does not count.';
        feedback.className = 'feedback correct';
        lockInputsAndShowNext(false);
        return;
    }
    streak++;
    updateDisplay();

    if (streak === 1 && !isTimerRunning) startTimer();

    if (streak === 10) {
        stopTimer();
        celebrateStreak(10);
        feedback.textContent = '10 IN A ROW! AMAZING! Time: ' + formatTime(timer);
        feedback.className = 'feedback victory';
        lockInputsAndShowNext(true);
    } else {
        celebrateStreak(streak);
        feedback.textContent = 'Correct!';
        feedback.className = 'feedback correct';
        lockInputsAndShowNext(false);
    }
}

function lockInputsAndShowNext(isStreakTen) {
    ['answer', 'ans1', 'ans2', 'ansNum', 'ansRad', 'ansDen', 'ansNum2', 'ansCoeff2', 'ansRad2', 'ansDen2'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.disabled = true;
    });
    var submitBtn = document.querySelector('.submit-btn');
    if (submitBtn) submitBtn.style.display = 'none';
    var keyRow = document.querySelector('.key-row');
    if (keyRow) keyRow.style.display = 'none';

    var row = document.getElementById('next-btn-row');
    row.innerHTML = '<button class="submit-btn next-btn" onclick="advanceToNextProblem(' + isStreakTen + ')">Next Question <span aria-hidden="true">&rarr;</span></button>';
    var nextBtn = row.querySelector('.next-btn');
    if (nextBtn) nextBtn.focus();
}

function advanceToNextProblem(isStreakTen) {
    if (isStreakTen) streak = 0;
    problemCount++;
    updateDisplay();
    generateProblem();
}

/* =====================================================================
   Hint / Answer / Solution reveal
   ===================================================================== */
/* Show Answer, Show Solution and Skip must cost the same as a wrong answer:
   one attempt against this problem's category and the end of the streak.
   Without this a student could reveal the worked answer, type it back and
   score a clean 1/1 with the streak intact. Show Hint stays free -- it gives
   strategy, not the answer. */
var revealCharged = false;
function chargeReveal() {
    if (!revealCharged) {
        revealCharged = true;
        var cat = currentProblem.category;
        if (stats[cat]) { stats[cat].t++; saveState(); }
    }
    streak = 0;
    stopTimer();
    updateDisplay();
}
function skipProblem() {
    chargeReveal();
    problemCount++;
    generateProblem();
    updateDisplay();
}
function toggleHint() {
    var hint = document.getElementById('hint');
    if (hint.style.display === 'none') {
        hint.innerHTML = '<strong>Hint:</strong><br>' + currentProblem.hint;
        hint.style.display = 'block';
    } else {
        hint.style.display = 'none';
    }
}

function toggleAnswer() {
    var box = document.getElementById('answer-box');
    if (box.style.display === 'none') {
        chargeReveal();
        var text;
        if (currentProblem.inputMode === 'radicalStructured') {
            text = (quadFormulaPart === 1) ? currentProblem.answerDisplayPart1 : currentProblem.answerDisplayPart2;
        } else {
            text = currentProblem.answerDisplay;
        }
        box.innerHTML = '<strong>Answer:</strong> <span aria-hidden="true">' + text + '</span>' +
            '<span class="sr-only">' + escHtml(speakEquation(text)) + '</span>';
        box.style.display = 'block';
    } else {
        box.style.display = 'none';
    }
}

function toggleSolution() {
    var box = document.getElementById('solution-box');
    if (box.style.display === 'none') {
        chargeReveal();
        solutionRevealed = 1;
        renderSolutionBox();
    } else {
        box.style.display = 'none';
    }
}
function showNextSolutionStep() {
    solutionRevealed++;
    renderSolutionBox();
}
function renderSolutionBox() {
    var box = document.getElementById('solution-box');
    var steps = currentProblem.solutionSteps;
    var total = steps.length;
    var shown = Math.min(solutionRevealed, total);
    var html = '<div style="font-weight:bold; margin-bottom:8px;">Step-by-Step Solution (' + shown + ' of ' + total + ')</div>';
    for (var i = 0; i < shown; i++) {
        var parts = steps[i].split(':  ');
        var label = parts[0];
        var eq = parts.length > 1 ? parts.slice(1).join(':  ') : '';
        html += '<div class="solution-step">';
        html += '<div><b>' + (i + 1) + '.</b> ' + label + (eq ? ':' : '') + '</div>';
        if (eq) html += '<div class="solution-eq" role="img" aria-label="' + escHtml(speakEquation(eq)) + '">' + eq + '</div>';
        html += '</div>';
    }
    if (shown < total) {
        html += '<div style="text-align:center; margin-top:10px;"><button class="submit-btn" onclick="showNextSolutionStep()">Next Step</button></div>';
    } else {
        html += '<div style="text-align:center; margin-top:10px; font-weight:bold; color:#047857;">That\'s the complete solution. Try the next one yourself!</div>';
    }
    box.style.display = 'block';
    box.innerHTML = html;
}

/* =====================================================================
   Timer
   ===================================================================== */
function startTimer() {
    isTimerRunning = true;
    timer = 0;
    timerInterval = setInterval(function () {
        timer++;
        updateDisplay();
    }, 1000);
}
function stopTimer() {
    isTimerRunning = false;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function formatTime(seconds) {
    var mins = Math.floor(seconds / 60);
    var secs = seconds % 60;
    return mins + ':' + (secs < 10 ? '0' : '') + secs;
}

function updateDisplay() {
    document.getElementById('problemNum').textContent = problemCount + 1;
    document.getElementById('streak').textContent = streak;
    var timerDisplay = document.getElementById('timer-display');
    if (isTimerRunning) {
        timerDisplay.textContent = 'Time: ' + formatTime(timer);
        timerDisplay.style.display = 'block';
    } else {
        timerDisplay.style.display = 'none';
    }
}

/* =====================================================================
   Confetti
   ===================================================================== */
function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function createConfetti(count, tier) {
    if (prefersReducedMotion()) return;
    var host = document.body;
    /* Design item 10: #ef4444 (red, not in the palette) and #f59e0b (orange,
       banned) swapped for mint and heritage rose. Still eight colours. */
    var colors = ['#10b981', '#22c55e', '#3b82f6', '#c76b8f', '#a855f7', '#06b6d4', '#ec4899', '#84cc16'];
    var isMassive = tier === 3;
    for (var i = 0; i < count; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti';
        piece.setAttribute('aria-hidden', 'true');
        var base;
        if (tier === 1) base = 7 + Math.random() * 5;
        else if (tier === 2) base = 10 + Math.random() * 7;
        else base = 11 + Math.random() * 9;
        var color = colors[Math.floor(Math.random() * colors.length)];
        var shape = Math.floor(Math.random() * 4);
        if (shape === 0) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '50%';
        } else if (shape === 1) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else if (shape === 2) {
            piece.style.width = Math.max(4, base * 0.35) + 'px'; piece.style.height = (base * 1.7) + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else {
            piece.style.width = '0'; piece.style.height = '0'; piece.style.background = 'transparent';
            piece.style.borderLeft = (base * 0.6) + 'px solid transparent';
            piece.style.borderRight = (base * 0.6) + 'px solid transparent';
            piece.style.borderBottom = base + 'px solid ' + color;
        }
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-20px';
        var dur;
        if (tier === 1) dur = 1.6 + Math.random() * 1.0;
        else if (tier === 2) dur = 2.0 + Math.random() * 1.5;
        else dur = 2.5 + Math.random() * 2.0;
        piece.style.animation = (isMassive ? 'confetti-fall-slow' : 'confetti-fall') + ' ' + dur + 's ease-out forwards';
        piece.style.animationDelay = (Math.random() * (isMassive ? 0.8 : 0.4)) + 's';
        host.appendChild(piece);
        setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(piece), isMassive ? 6000 : 4500);
    }
    if (isMassive) {
        for (var j = 0; j < 15; j++) {
            var sp = document.createElement('div');
            sp.className = 'sparkle';
            sp.setAttribute('aria-hidden', 'true');
            sp.style.left = (Math.random() * 90 + 5) + '%';
            sp.style.top = (Math.random() * 55 + 10) + 'vh';
            sp.style.animationDelay = (Math.random() * 0.5) + 's';
            host.appendChild(sp);
            setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(sp), 3500);
        }
    }
}
function celebrateStreak(s) {
    if (!confettiEnabled) return;
    if (s === 10) createConfetti(200, 3);
    else if (s >= 4) createConfetti(100, 2);
    else if (s >= 2) createConfetti(40, 1);
}

var challengeModeOn = false;        // toggle state; applies to whichever of factoring/formula is active

function updateTabUI() {
    var mainOrder = ['linear', 'quadratic', 'mixed'];
    var mainBtns = document.querySelectorAll('#main-tabs .mode-btn');
    mainBtns.forEach(function (btn, idx) {
        var on = mainOrder[idx] === mainCategory;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    var quadRow = document.getElementById('quadratic-subtabs');
    var toggleRow = document.getElementById('challenge-toggle-row');
    var mixedToggleRow = document.getElementById('mixed-challenge-toggle-row');
    if (mainCategory === 'quadratic') {
        quadRow.style.display = 'flex';
        toggleRow.style.display = 'flex';
        mixedToggleRow.style.display = 'none';
        var quadOrder = ['factoring', 'formula'];
        var quadBtns = document.querySelectorAll('#quadratic-subtabs .sub-btn');
        quadBtns.forEach(function (btn, idx) {
            var on = quadOrder[idx] === quadraticSubMode;
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });

        document.getElementById('challengeToggle').checked = challengeModeOn;
        document.getElementById('challengeToggleLabel').textContent = (quadraticSubMode === 'factoring')
            ? 'Challenge mode (a \u2260 1)'
            : 'Challenge mode (needs simplifying)';
    } else if (mainCategory === 'mixed') {
        quadRow.style.display = 'none';
        toggleRow.style.display = 'none';
        mixedToggleRow.style.display = 'flex';
        document.getElementById('mixedChallengeToggle').checked = mixedChallengeOn;
    } else {
        quadRow.style.display = 'none';
        toggleRow.style.display = 'none';
        mixedToggleRow.style.display = 'none';
    }

    requestAnimationFrame(drawQuadConnector);
    requestAnimationFrame(alignMixedToggle);
}

function drawQuadConnector() {
    var svg = document.getElementById('quad-connector-svg');
    if (!svg) return;
    if (mainCategory !== 'quadratic') { svg.innerHTML = ''; return; }

    var mainBtns = document.querySelectorAll('#main-tabs .mode-btn');
    var quadBtn = mainBtns[1];
    var subBtns = document.querySelectorAll('#quadratic-subtabs .sub-btn');
    if (!quadBtn || subBtns.length < 2) { svg.innerHTML = ''; return; }

    var wrap = document.getElementById('quad-connector-wrap');
    var wrapRect = wrap.getBoundingClientRect();
    var quadRect = quadBtn.getBoundingClientRect();
    var sub1Rect = subBtns[0].getBoundingClientRect();
    var sub2Rect = subBtns[1].getBoundingClientRect();

    if (wrapRect.width === 0) { svg.innerHTML = ''; return; }

    var startX = quadRect.left + quadRect.width / 2 - wrapRect.left;
    var end1X = sub1Rect.left + sub1Rect.width / 2 - wrapRect.left;
    var end2X = sub2Rect.left + sub2Rect.width / 2 - wrapRect.left;
    var midY = 6;
    var endY = 14;

    svg.setAttribute('viewBox', '0 0 ' + wrapRect.width + ' ' + endY);
    svg.style.height = endY + 'px';

    var color = '#b7c0ea';
    svg.innerHTML =
        '<path d="M ' + startX + ' 0 L ' + startX + ' ' + midY + '" stroke="' + color + '" stroke-width="2" fill="none"/>' +
        '<path d="M ' + startX + ' ' + midY + ' L ' + end1X + ' ' + midY + ' L ' + end1X + ' ' + endY + '" stroke="' + color + '" stroke-width="2" fill="none"/>' +
        '<path d="M ' + startX + ' ' + midY + ' L ' + end2X + ' ' + midY + ' L ' + end2X + ' ' + endY + '" stroke="' + color + '" stroke-width="2" fill="none"/>';
}
window.addEventListener('resize', function () {
    if (mainCategory === 'quadratic') drawQuadConnector();
    if (mainCategory === 'mixed') alignMixedToggle();
});

function alignMixedToggle() {
    var row = document.getElementById('mixed-challenge-toggle-row');
    if (!row || mainCategory !== 'mixed') return;
    var linearBtn = document.querySelectorAll('#main-tabs .mode-btn')[0];
    if (!linearBtn) return;
    var rowRect = row.getBoundingClientRect();
    var linearRect = linearBtn.getBoundingClientRect();
    var offset = linearRect.left - rowRect.left;
    row.style.paddingLeft = Math.max(0, offset) + 'px';
}

/* =====================================================================
   Stats panel
   ===================================================================== */
function pct(s) { return s.t > 0 ? Math.round((s.c / s.t) * 100) : 0; }

function showStats() {
    var names = { linear: 'Linear Equations', factoring: 'Quadratic (Factoring, Standard)', quadFormula: 'Quadratic (Formula)', challenge: 'Quadratic (Factoring, Challenge)' };
    var html = '<h2 id="stats-heading">My Stats</h2>';
    STAT_KEYS.forEach(function (k) {
        // Second coercion at the render boundary: these numbers originate from
        // localStorage and are interpolated into innerHTML.
        var s = sanitizeStats(stats)[k];
        var p = pct(s);
        html += '<div class="stat-row">';
        html += '<div class="stat-name">' + escHtml(names[k]) + '</div>';
        html += '<div class="stat-bar-wrap"><div class="stat-bar" style="width:' + p + '%;"></div></div>';
        /* Design item 11: a mode that was never attempted reads "not tried yet",
           never "0/0" -- a zero score there looks like failure at something the
           student has not even seen. */
        html += '<div class="stat-num">' + (s.t > 0 ? s.c + '/' + s.t + ' (' + p + '%)' : 'not tried yet') + '</div>';
        html += '</div>';
    });

    var weakest = null, weakestAcc = 1.0;
    ['linear', 'factoring', 'quadFormula'].forEach(function (k) {
        var s = sanitizeStats(stats)[k];
        if (s.t >= 3) {
            var acc = s.c / s.t;
            if (acc < weakestAcc) { weakestAcc = acc; weakest = k; }
        }
    });
    if (weakest && weakestAcc < 0.8) {
        html += '<div class="recommend">The Mixed category will give you extra practice on ' + escHtml(names[weakest]) + ' since that\'s where you\'re struggling most.</div>';
    }

    html += '<div class="stats-actions">';
    html += '<button class="close-btn" onclick="hideStats()">Close</button>';
    html += '<button class="reset-btn' + (resetConfirming ? ' armed' : '') + '" id="reset-btn" onclick="resetProgress()">' + (resetConfirming ? 'Tap again to confirm' : 'Reset Progress') + '</button>';
    html += '</div>';

    var panel = document.getElementById('stats-panel');
    panel.innerHTML = html;
    document.getElementById('stats-overlay').style.display = 'flex';
    // The panel is a modal dialog: move focus into it, and give it back on close.
    panel.focus();
}
function hideStats() {
    document.getElementById('stats-overlay').style.display = 'none';
    disarmReset();
    var opener = document.getElementById('stats-btn');
    if (opener) opener.focus();
}
/* Design item 16: the armed confirm state used to stay loaded forever, so a
   stray tap minutes later wiped the student's record. It now re-arms itself
   after 3500ms, matching the design system's two-tap pattern. The label is
   rewritten in place rather than by re-rendering the panel, so the timer never
   steals focus from whatever the student is on. */
var RESET_DISARM_MS = 3500;
var resetDisarmTimer = null;
function disarmReset() {
    if (resetDisarmTimer) { clearTimeout(resetDisarmTimer); resetDisarmTimer = null; }
    if (!resetConfirming) return;
    resetConfirming = false;
    var btn = document.getElementById('reset-btn');
    if (btn) {
        btn.textContent = 'Reset Progress';
        btn.className = 'reset-btn';
    }
}
document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var ov = document.getElementById('stats-overlay');
    if (ov && ov.style.display !== 'none') hideStats();
});
function resetProgress() {
    if (!resetConfirming) {
        resetConfirming = true;
        var btn = document.getElementById('reset-btn');
        if (btn) {
            btn.textContent = 'Tap again to confirm';
            btn.className = 'reset-btn armed';
        }
        announceProblem('Tap Reset Progress again within 3.5 seconds to erase your stats.');
        if (resetDisarmTimer) clearTimeout(resetDisarmTimer);
        resetDisarmTimer = setTimeout(disarmReset, RESET_DISARM_MS);
        return;
    }
    disarmReset();
    stats = {
        linear: { c: 0, t: 0 },
        factoring: { c: 0, t: 0 },
        quadFormula: { c: 0, t: 0 },
        challenge: { c: 0, t: 0 }
    };
    resetConfirming = false;
    saveState();
    showStats();
}

/* =====================================================================
   Init
   ===================================================================== */
function drawInsignia() {
    var el = document.getElementById('pr-rose');
    if (!el) return;
    var pts = [];
    var steps = 240;
    for (var i = 0; i <= steps; i++) {
        var t = (i / steps) * 4 * Math.PI;
        var r = 2 * Math.cos(1.5 * t);
        var x = r * Math.cos(t) * 12;
        var y = r * Math.sin(t) * 12;
        pts.push((i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2));
    }
    el.setAttribute('d', pts.join(' '));
}
drawInsignia();

loadState();
generateProblem();
updateDisplay();
</script>
