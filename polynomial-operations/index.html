    if (!currentProblem) return;
    /* Enter in a blank after the problem is graded means "next", not "grade it
       again" -- so a keyboard user never has to reach for the button. */
    if (currentProblem.done) { nextProblem(); return; }
    if (currentProblem.stage === 1) { checkSigns(); return; }
    gradeBlanks();
}

function nextProblem() {
    problemNum++;
    generateProblem();
    updateDisplay();
}

/* Stage 1 of a subtraction problem. An unset key is treated exactly like an
   empty blank -- the problem is simply not graded yet -- so a student is
   never marked wrong for a term they have not answered. */
function checkSigns() {
    var p = currentProblem, i, el, v, unset = 0, firstWrong = -1;
    for (i = 0; i < p.signTerms.length; i++) {
        el = document.getElementById('sg' + i);
        v = el ? el.getAttribute('data-sign') : '?';
        if (v === '?') { unset++; continue; }
        if (firstWrong === -1 && v !== p.signTerms[i].correct) firstWrong = i;
    }
    if (unset > 0) {
        setFeedback('Set a sign for every term first.', 'feedback');
        return;
    }
    if (firstWrong !== -1) {
        recordMiss();
        setFeedback('Not quite. Check the sign on the ' + p.signTerms[firstWrong].name + ' term.', 'feedback incorrect');
        return;
    }
    advanceToStage2('Signs are right. Now combine the like terms.');
}

function advanceToStage2(msg) {
    var p = currentProblem;
    p.stage = 2;
    var vis = document.getElementById('problem-visual');
    if (!vis) return;
    var html = renderSubStage2(p);
    vis.innerHTML = html;
    hideDecorativeMath(vis);
    labelBlanks(p);
    renderInputArea();     /* stage 2 has answer boxes, so the minus key returns */
    if (msg) {
        setFeedback(msg, 'feedback correct');
        announce(msg + ' ' + spokenFromHtml(html));
    }
    scheduleFocus();
}

function gradeBlanks() {
    var p = currentProblem, i, b, el, raw, wrong = [], empty = 0, signOnly = 0;
    for (i = 0; i < p.blanks.length; i++) {
        b = p.blanks[i];
        el = document.getElementById(b.id);
        raw = el ? String(el.value).trim() : '';
        if (raw === '') { empty++; continue; }
        /* A box holding nothing but a sign is an UNFINISHED entry, not a wrong
           answer. It is the most natural slip in the game: -x^2 really does
           mean -1x^2, so a student who has been taught to write the minus and
           no number types exactly that. Marking it wrong would cost an attempt
           and a streak for correct notation habits. It is nudged instead. */
        if (raw === '+' || raw === '-') { signOnly++; continue; }
        if (!blankCorrect(b.kind, raw, p.answers[b.key])) wrong.push(b);
    }
    /* Never coerce an empty box to 0: the student has not answered, and
       grading it would hand out a free correct on any zero coefficient. */
    if (signOnly > 0) {
        /* Teaches the rule without stating this problem's answer -- saying
           "the coefficient is -1" would be a hint, and wrong whenever the
           box actually wanted -7. */
        setFeedback('A sign on its own is not a number yet. Writing ' +
            '-x is shorthand for -1x, so if you mean negative one, type -1.', 'feedback');
        return;
    }
    if (empty > 0) {
        setFeedback(empty === 1 ? 'One blank is still empty.' : 'Fill in every blank first.', 'feedback');
        return;
    }

    if (wrong.length === 0) {
        if (!missRecorded) {
            missRecorded = true;
            stats[p.trackCategory].t++;
            stats[p.trackCategory].c++;
            streak++;
            if (streak > bestStreak) bestStreak = streak;
            celebrateStreak(streak);
        } else {
            /* Already charged for a wrong try or a reveal on this problem:
               the attempt is booked, no credit is given, and the streak stays
               at zero. */
            streak = 0;
        }
        p.done = true;
        setFeedback('Correct!', 'feedback correct');
        announce('Correct. ' + spokenFromHtml(p.answerLine));
        updateDisplay();
        saveState();
        renderInputArea();      /* Check Answer becomes Next Problem */
        return;
    }

    recordMiss();
    if (wrong.length === 1) {
        setFeedback('Not quite. Check ' + wrong[0].label + '.', 'feedback incorrect');
    } else {
        setFeedback('Not quite. ' + wrong.length + ' of the ' + p.blanks.length +
            ' boxes are not right yet.', 'feedback incorrect');
    }
    updateDisplay();
    saveState();
}

/* A wrong answer costs the same as a reveal: one attempt, no credit, streak
   back to zero. Booked once per problem, on whichever path gets there first,
   so a student cannot pay twice or slip through without paying at all. */
function recordMiss() {
    if (missRecorded || !currentProblem) return;
    missRecorded = true;
    if (stats[currentProblem.trackCategory]) stats[currentProblem.trackCategory].t++;
    streak = 0;
    updateDisplay();
    saveState();
}

/* =====================================================================
   Helper boxes
   ===================================================================== */
function toggleHint() {
    if (!currentProblem) return;
    toggleHelperBox('hint', 'hint-toggle', 'Show Hint', 'Hide Hint', 'hint-box',
        '<b>Hint:</b> ' + currentProblem.hint);
}
function toggleExplanation() {
    if (!currentProblem) return;
    toggleHelperBox('explain', 'explain-toggle', 'Show Explanation', 'Hide Explanation', 'explain-box',
        currentProblem.explanation);
}
/* Show Answer charges an attempt and ends the streak. On a subtraction
   problem still in stage 1 it also unlocks stage 2 with the correct signs
   filled in -- otherwise revealing the answer would leave the student unable
   to reach the boxes the answer is about. */
function toggleAnswer() {
    if (!currentProblem) return;
    var box = document.getElementById('answer-box');
    if (box && box.style.display === 'none') {
        recordReveal();
        if (currentProblem.stage === 1) {
            var p = currentProblem, i, el;
            for (i = 0; i < p.signTerms.length; i++) {
                el = document.getElementById('sg' + i);
                if (el) el.setAttribute('data-sign', p.signTerms[i].correct);
            }
            advanceToStage2(null);
        }
    }
    toggleHelperBox('answer-box', 'answer-toggle', 'Show Answer', 'Hide Answer', 'answer-box',
        '<b>Answer:</b> ' + currentProblem.answerLine);
}

/* No level pills in this game: every category ramps on its own from the
   number of problems served. The row stays in the markup, hidden, so the
   component is available if a future category ever needs it. */
function renderSubModeButtons() {
    var c = document.getElementById('sub-mode-btns');
    if (!c) return;
    c.style.display = 'none';
    c.innerHTML = '';
}

/* =====================================================================
   Spoken math
   =====================================================================
   The rendered markup is the single source of truth: everything a student
   can see -- the problem, a hint, an explanation, the revealed answer -- is
   turned into words by this one function, so no panel can go mute the way
   the hint and answer boxes did across the rest of the suite.

   Order matters. The sign keys carry meaning and become "sign blank"; the
   +/- keys carry none and are stripped whole, because tag-stripping alone
   left their glyph in the sentence and every signed blank was announced as
   "...equals x blank plus or minus". */
function spokenFromHtml(html) {
    var s = String(html == null ? '' : html);

    /* Block structure first, so sentences do not run together. */
    s = s.replace(/<div class="stage-tag">([\s\S]*?)<\/div>/g, '. $1 . ');
    s = s.replace(/<div class="rewrite[^"]*">/g, '. ');
    s = s.replace(/<div class="stage-line">/g, '. ');

    /* The student's own sign choices. */
    s = s.replace(/<button[^>]*class="[^"]*sign-toggle[^"]*"[^>]*>[\s\S]*?<\/button>/g, ' sign blank ');
    s = s.replace(/<span class="sign-locked">([\s\S]*?)<\/span>/g, ' $1 ');

    /* Every other button is a control, not part of the expression. */
    s = s.replace(/<button[\s\S]*?<\/button>/g, ' ');

    /* Inputs are the blanks the student fills. */
    s = s.replace(/<input[^>]*>/g, ' blank ');

    /* A stacked fraction carries its meaning in layout, so it must be said. */
    s = s.replace(/<span class="frac[^"]*"><span class="frac-num">([\s\S]*?)<\/span><span class="frac-bar"><\/span><span class="frac-den">([\s\S]*?)<\/span><\/span>/g,
        function (m, n, d) { return ' the fraction ' + spokenFromHtml(n) + ' over ' + spokenFromHtml(d) + ' '; });

    /* An exponent slot holds a blank; a <sup> holds a printed exponent. */
    s = s.replace(/<span class="exp-slot">([\s\S]*?)<\/span>/g, ' to the power of $1 ');
    s = s.replace(/<sup>([\s\S]*?)<\/sup>/g, ' to the power of $1 ');

    s = s.replace(/<[^>]+>/g, ' ');

    s = s.replace(/&minus;/g, ' minus ')
        .replace(/&times;/g, ' times ')
        .replace(/&plusmn;/g, ' ')
        .replace(/&nbsp;/g, ' ')
        .replace(/&mdash;/g, ' , ')
        .replace(/&ne;/g, ' is not equal to ')
        .replace(/&rsquo;/g, "'")
        .replace(/&amp;/g, ' and ')
        .replace(/&lt;/g, ' ')
        .replace(/&gt;/g, ' ')
        .replace(/&quot;/g, ' ')
        .replace(/&#39;/g, "'");

    s = s.replace(/=/g, ' equals ');
    s = s.replace(/\(/g, ' open parenthesis ').replace(/\)/g, ' close parenthesis ');

    /* A minus that opens an expression is a negative, not a subtraction. */
    s = s.replace(/(^|open parenthesis|equals|:|\.)(\s*)minus\s+/g, '$1$2negative ');

    s = s.replace(/\s+/g, ' ').trim();
    return s;
}

/* Shared disclosure plumbing -- keep, it is not game-specific. */
function toggleHelperBox(boxId, btnId, showLabel, hideLabel, cls, htmlContent) {
    var box = document.getElementById(boxId);
    var btn = document.getElementById(btnId);
    if (!box) return;
    if (box.style.display === 'none') {
        box.className = cls;
        // Visual copy is aria-hidden; a spoken sibling carries the same content in words
        box.innerHTML = '<div aria-hidden="true">' + htmlContent + '</div>' +
            '<p class="sr-only">' + escapeHtml(spokenFromHtml(htmlContent)) + '</p>';
        box.style.display = 'block';
        if (btn) { btn.setAttribute('aria-expanded', 'true'); btn.textContent = hideLabel; }
    } else {
        box.style.display = 'none';
        if (btn) { btn.setAttribute('aria-expanded', 'false'); btn.textContent = showLabel; }
    }
}

/* Revealing the answer records the problem as attempted, exactly like a wrong
   try, and ends the streak. Without this a student could reveal, type it back
   and take clean first-try credit, which quietly inflated every accuracy
   figure. Hint and Explanation stay free, matching the rest of the suite. */
function recordReveal() {
    if (missRecorded || !currentProblem) return;
    missRecorded = true;
    if (stats[currentProblem.trackCategory]) stats[currentProblem.trackCategory].t++;
    streak = 0;
    updateDisplay();
    saveState();
}

/* =====================================================================
   Skip, mode, display
   ===================================================================== */
function skipProblem() {
    problemNum++;
    generateProblem();
    updateDisplay();
}

/* Reads data-mode off each pill rather than an index-ordered array, so adding
   or reordering pills never desynchronises the active state. */
function setMode(m) {
    mode = m;
    var btns = document.querySelectorAll('#main-mode-btns .mode-btn');
    for (var i = 0; i < btns.length; i++) {
        var on = btns[i].getAttribute('data-mode') === m;
        btns[i].classList.toggle('active', on);
        btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    renderSubModeButtons();
    /* The streak deliberately SURVIVES a category switch. Mixed already lets
       a streak span all three categories, so resetting it here punished
       exactly the student who was exploring by hand. */
    generateProblem();
    updateDisplay();
}

function updateDisplay() {
    document.getElementById('problemNum').textContent = problemNum + 1;
    document.getElementById('streak').textContent = streak;
    var sd = document.getElementById('streak-display');
    sd.className = streak >= 5 ? 'info-item streak-hot' : 'info-item';
    var totalC = 0, totalT = 0;
    CATS.forEach(function (c) { if (stats[c]) { totalC += stats[c].c; totalT += stats[c].t; } });
    var accEl = document.getElementById('acc-display');
    if (totalT > 0) accEl.textContent = 'Accuracy: ' + Math.round(totalC / totalT * 100) + '%';
    else accEl.textContent = 'Accuracy: --';
}

/* =====================================================================
   Persistence hardening
   ===================================================================== */
/* Anything read back from localStorage is untrusted: another script on the
   origin, a shared device, or a curious student can edit it. Stats values
   flow into innerHTML in the stats panel, so they are coerced to plain
   non-negative integers on load and escaped on the way out. */
function escapeHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function safeCount(v, max) {
    var n = Number(v);
    if (!isFinite(n) || n < 0) return 0;
    n = Math.floor(n);
    return n > max ? max : n;
}

function saveState() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            stats: stats, served: served, bestStreak: bestStreak,
            problemNum: problemNum, confettiOn: confettiOn
        }));
    } catch (e) { /* storage unavailable -- play without saving */ }
}
function loadState() {
    try {
        var raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        var st = JSON.parse(raw);
        if (st && typeof st === 'object' && st.stats && typeof st.stats === 'object') {
            CATS.forEach(function (c) {
                var s = st.stats[c];
                if (!s || typeof s !== 'object') return;
                var t = safeCount(s.t, 1e6);
                var correct = safeCount(s.c, t);   // correct can never exceed attempts
                stats[c] = { c: correct, t: t };
            });
        }
        /* The ramp counters are user-writable like everything else in
           storage, so they are clamped the same way. A poisoned value can
           only ever move a student further along a ramp, never past a
           category that does not exist. */
        if (st && st.served && typeof st.served === 'object') {
            CATS.forEach(function (c) {
                served[c] = safeCount(st.served[c], 1e6);
            });
        }
        if (st) {
            bestStreak = safeCount(st.bestStreak, 1e6);
            problemNum = safeCount(st.problemNum, 1e6);
            confettiOn = st.confettiOn !== false;
        }
    } catch (e) { /* corrupt or unreadable -- start fresh rather than fail */ }
}

/* =====================================================================
   Stats view
   ===================================================================== */
function showStats() {
    var totalC = 0, totalT = 0;
    CATS.forEach(function (c) { if (stats[c]) { totalC += stats[c].c; totalT += stats[c].t; } });
    var overallPct = totalT > 0 ? Math.round((totalC / totalT) * 100) : 0;

    var html = '<div class="stats-view">';
    html += '<h2 id="stats-heading" tabindex="-1">My Stats</h2>';
    html += '<div class="stats-overall">';
    if (totalT > 0) {
        html += '<div class="big">' + escapeHtml(overallPct) + '%</div>';
        html += '<div class="lbl">' + escapeHtml(totalC) + ' correct on first try out of ' + escapeHtml(totalT) + ' problems</div>';
    } else {
        html += '<div class="big" style="color:#4a5480;" aria-hidden="true">--</div>';
        html += '<div class="lbl">No problems attempted yet.</div>';
    }
    html += '<div class="lbl" style="margin-top:6px;">Best streak: ' + escapeHtml(bestStreak) + '</div>';
    html += '</div>';

    CATS.forEach(function (c) {
        var s = stats[c] || { c: 0, t: 0 };
        var pct = s.t > 0 ? Math.round((s.c / s.t) * 100) : 0;
        var barCls = 'none';
        if (s.t > 0) {
            if (pct >= 80) barCls = 'good';
            else if (pct >= 60) barCls = 'mid';
            else barCls = 'low';
        }
        var w = s.t > 0 ? pct : 0;
        var name = CAT_LABELS[c] || c;
        var spokenRow = s.t > 0
            ? name + ': ' + s.c + ' correct out of ' + s.t + ', ' + pct + ' percent'
            : name + ': not tried yet';
        html += '<div class="stat-row">';
        html += '<div class="stat-name" aria-hidden="true">' + escapeHtml(name) + '</div>';
        html += '<div class="stat-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
                escapeHtml(w) + '" aria-label="' + escapeHtml(spokenRow) + '">' +
                '<div class="stat-bar ' + barCls + '" style="width:' + escapeHtml(w) + '%;"></div></div>';
        html += '<div class="stat-num" aria-hidden="true">' +
                (s.t > 0 ? escapeHtml(s.c) + '/' + escapeHtml(s.t) + ' (' + escapeHtml(pct) + '%)' : 'not tried yet') +
                '</div>';
        html += '</div>';
    });

    var recommend = buildRecommendation();
    if (recommend) html += '<div class="recommend">' + recommend + '</div>';

    html += '<div class="stats-actions">';
    html += '<button type="button" class="submit-btn" onclick="hideStats()">Back to Practice</button>';
    html += '<button type="button" class="reset-btn" onclick="confirmReset()" style="margin-left:8px;">Reset Stats</button>';
    html += '</div>';
    html += '</div>';

    document.getElementById('main-content').innerHTML = html;
    document.getElementById('input-content').innerHTML = '';
    setFeedback('', 'feedback');
    document.getElementById('problem-spoken').textContent = '';
    document.getElementById('helper-buttons').style.display = 'none';
    hideHelperBox('hint', 'hint-toggle', 'Show Hint');
    hideHelperBox('explain', 'explain-toggle', 'Show Explanation');
    hideHelperBox('answer-box', 'answer-toggle', 'Show Answer');
    var h = document.getElementById('stats-heading');
    if (h) h.focus();
}

/* ==== GAME-SPECIFIC wording, generic shape: keep the "untried first" rule. ==== */
function buildRecommendation() {
    var totalT = 0;
    CATS.forEach(function (c) { if (stats[c]) totalT += stats[c].t; });
    if (totalT === 0) return null;

    var untried = CATS.filter(function (c) { return !stats[c] || stats[c].t === 0; });
    if (untried.length > 0) {
        var names = untried.map(function (c) { return CAT_LABELS[c] || c; });
        var list = names.length > 1 ? (names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1]) : names[0];
        return '<b>Try these next:</b> you haven&rsquo;t attempted ' + escapeHtml(list) + ' yet, so it&rsquo;s too soon to call this a strong overall score. Give them a shot!';
    }

    var weakest = null, weakestPct = 101;
    CATS.forEach(function (c) {
        var s = stats[c];
        var p = s.c / s.t * 100;
        if (p < weakestPct) { weakestPct = p; weakest = c; }
    });
    if (weakestPct >= 85) {
        return '<b>Great work overall!</b> You are strong across every category. Try the Mixed mode to keep sharp.';
    }
    return '<b>Focus area:</b> ' + escapeHtml(CAT_LABELS[weakest] || weakest) + ' is your weakest (' +
        escapeHtml(Math.round(weakestPct)) + '%). Try the ' + escapeHtml(CAT_SHORT[weakest] || weakest) +
        ' mode for focused practice.';
}

function hideStats() { generateProblem(); updateDisplay(); }

/* Two-tap reset: the first tap arms the button and relabels it, the second
   inside 3.5s performs the reset. No confirm() dialog -- it is blocked in some
   embedded webviews and reads badly to a screen reader. */
var resetArmed = false;
var resetTimer = null;
function confirmReset() {
    if (!resetArmed) {
        resetArmed = true;
        var btns = document.querySelectorAll('.reset-btn');
        for (var i = 0; i < btns.length; i++) btns[i].textContent = 'Tap again to confirm';
        resetTimer = setTimeout(function () {
            resetArmed = false;
            var b2 = document.querySelectorAll('.reset-btn');
            for (var j = 0; j < b2.length; j++) b2[j].textContent = 'Reset Stats';
        }, 3500);
        return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    stats = blankStats();
    served = blankServed();
    streak = 0;
    bestStreak = 0;
    problemNum = 0;
    saveState();
    updateDisplay();
    showStats();
}

/* =====================================================================
   Confetti
   ===================================================================== */
function prefersReducedMotion() {
    try {
        return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) { return false; }
}
function toggleConfetti() {
    confettiOn = !confettiOn;
    syncConfettiButton();
    saveState();
    announce('Confetti ' + (confettiOn ? 'on' : 'off') + '.');
    if (confettiOn) createConfetti(40, 1);
}
/* Milestones: every 5 in a row is a tier-2 burst, every 10 a tier-3 burst.
   Called only from the correct-answer path, and only for a clean first try. */
function celebrateStreak(s) {
    if (s <= 0) return;
    if (!confettiOn || prefersReducedMotion()) return;
    /* 3, 5, 8, 10, 13, 15, 18, 20, ... -- every multiple of 5, and every
       3 past one. Two celebrations per five, escalating in size. */
    var m = s % 5;
    if (m === 0) {
        if (s % 10 === 0) createConfetti(200, 3);   /* 10, 20, 30 - the big one */
        else createConfetti(100, 2);                /* 5, 15, 25 */
    } else if (m === 3) {
        createConfetti(50, 1);                      /* 3, 8, 13, 18 */
    }
}

function createConfetti(count, tier) {
    if (prefersReducedMotion()) return;
    var host = document.body;
    // Midnight Scholar 8-colour confetti palette (the only place yellow is allowed)
    /* Confetti is the one documented exemption from the suite's no-orange,
       no-red rule (IRA, 2026-09-01). That rule exists because those colours
       mean error and warning everywhere else -- incorrect feedback is ink
       navy, never red -- and confetti never shares the screen with feedback
       about a wrong answer, so the exemption does not collide with it. */
    var colors = ['#7c3aed', '#a78bfa', '#2e3d8f', '#10b981', '#ffeb3b', '#fb923c', '#ef4444', '#ec4899'];
    var isMassive = tier === 3;
    for (var i = 0; i < count; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti';
        piece.setAttribute('aria-hidden', 'true');
        var base;
        if (tier === 1) base = 7 + Math.random() * 5;
        else if (tier === 2) base = 10 + Math.random() * 7;
        else base = 11 + Math.random() * 9;
        var color = colors[Math.floor(Math.random() * colors.length)];
        var shape = Math.floor(Math.random() * 4);
        if (shape === 0) {
            piece.style.width = base + 'px';
            piece.style.height = base + 'px';
            piece.style.background = color;
            piece.style.borderRadius = '50%';
        } else if (shape === 1) {
            piece.style.width = base + 'px';
            piece.style.height = base + 'px';
            piece.style.background = color;
            piece.style.borderRadius = '2px';
        } else if (shape === 2) {
            piece.style.width = Math.max(4, base * 0.35) + 'px';
            piece.style.height = (base * 1.7) + 'px';
            piece.style.background = color;
            piece.style.borderRadius = '2px';
        } else {
            piece.style.width = '0';
            piece.style.height = '0';
            piece.style.background = 'transparent';
            piece.style.borderLeft = (base * 0.6) + 'px solid transparent';
            piece.style.borderRight = (base * 0.6) + 'px solid transparent';
            piece.style.borderBottom = base + 'px solid ' + color;
        }
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-20px';
        var dur;
        if (tier === 1) dur = 1.6 + Math.random() * 1.0;
        else if (tier === 2) dur = 2.0 + Math.random() * 1.5;
        else dur = 2.5 + Math.random() * 2.0;
        piece.style.animation = (isMassive ? 'confetti-fall-slow' : 'confetti-fall') + ' ' + dur + 's ease-out forwards';
        piece.style.animationDelay = (Math.random() * (isMassive ? 0.8 : 0.4)) + 's';
        host.appendChild(piece);
        setTimeout(function (el) {
            return function () { if (el.parentNode) el.parentNode.removeChild(el); };
        }(piece), isMassive ? 6000 : 4500);
    }
}

/* =====================================================================
   Boot
   ===================================================================== */
/* Polar Rose Studio insignia: r = 2cos(3/2 theta) */
function drawInsignia() {
    var el = document.getElementById('pr-path');
    if (!el) return;
    var d = '', steps = 240, maxT = 4 * Math.PI;
    for (var i = 0; i <= steps; i++) {
        var t = (i / steps) * maxT;
        var r = 2 * Math.cos(1.5 * t);
        var x = (r * Math.cos(t) * 12).toFixed(2);
        var y = (r * Math.sin(t) * 12).toFixed(2);
        d += (i === 0 ? 'M' : 'L') + x + ' ' + y + ' ';
    }
    el.setAttribute('d', d.trim());
}

/* The saved preference is read before the button is painted, so the switch's
   ARIA state and its visual state are set from the SAME value at boot. Without
   this the markup's hard-coded aria-checked="true" lied whenever confetti had
   been turned off in an earlier session. */
function syncConfettiButton() {
    var btn = document.getElementById('confetti-toggle');
    var track = document.getElementById('confetti-track');
    if (btn) btn.setAttribute('aria-checked', confettiOn ? 'true' : 'false');
    if (track) track.classList.toggle('on', confettiOn);
}

loadState();
drawInsignia();
syncConfettiButton();
renderSubModeButtons();
generateProblem();
updateDisplay();
</script>
