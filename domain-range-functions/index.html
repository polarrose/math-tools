function renderIsFunctionUI(problem) {
    var svg = buildIsFunctionGraphSVG(problem);
    var html = '<div class="graph-wrap" role="img" aria-label="' + escAttr(describeIsFunctionGraph(problem)) + '">' + svg + '</div>';
    html += '<div class="dr-question">Is this a function?</div>';
    html += '<div class="yesno-row">';
    html += '<button class="yesno-btn yes-btn" onclick="checkIsFunctionAnswer(true)">Yes <span class="yesno-sub">(passes the vertical line test)</span></button>';
    html += '<button class="yesno-btn no-btn" onclick="checkIsFunctionAnswer(false)">No <span class="yesno-sub">(fails the vertical line test)</span></button>';
    html += '</div>';
    document.getElementById('main-content').innerHTML = html;
}

var bootComplete = false;
function renderMainContent() {
    if (currentMode === 'domain-range') renderDomainRangeUI(currentProblem);
    else if (currentMode === 'read-graph') renderReadGraphUI(currentProblem);
    else if (currentMode === 'evaluate') renderEvaluateUI(currentProblem);
    else renderIsFunctionUI(currentProblem);
    /* "Next Problem" hides the button that has focus, which used to drop focus
       to <body> -- a keyboard student was returned to the top of the document
       on every problem, and only Domain & Range ever placed focus at all.
       Nothing is focused during boot, so the page does not scroll or raise a
       mobile keyboard on load. */
    if (!bootComplete) return;
    var target = document.getElementById('domain-input') ||
                 document.getElementById('rg-input') ||
                 document.getElementById('ev-input') ||
                 document.getElementById('main-content');
    if (target) { try { target.focus(); } catch (e) {} }
}

/* =====================================================================
   Input helpers
   ===================================================================== */
function insertSymbol(fieldId, sym) {
    var el = document.getElementById(fieldId);
    if (!el) return;
    var start = el.selectionStart != null ? el.selectionStart : el.value.length;
    var end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
    var val = el.value;
    el.value = val.slice(0, start) + sym + val.slice(end);
    el.focus();
    var pos = start + sym.length;
    try { el.setSelectionRange(pos, pos); } catch (e) {}
}

function setAllReals(fieldId) {
    var el = document.getElementById(fieldId);
    if (!el) return;
    el.value = '(-\u221e, \u221e)';
    el.focus();
}

function toggleSignField(fieldId) {
    var el = document.getElementById(fieldId);
    if (!el) return;
    el.value = el.value.charAt(0) === '-' ? el.value.slice(1) : '-' + el.value;
    el.focus();
}

/* =====================================================================
   Answer checking
   ===================================================================== */
/* This wrote only to the visual div, so "Please enter a number." was silent to
   a screen reader while every other validation message was announced. */
function handleFormatIssue(msg) {
    var feedback = document.getElementById('feedback');
    feedback.textContent = msg;
    feedback.className = 'feedback incorrect';
    announceFeedback(msg);
}

var isFunctionExplanations = {
    'line': 'a line \u2014 every vertical line crosses it exactly once.',
    'parabola': 'a parabola opening up or down \u2014 every vertical line crosses it exactly once.',
    'circle': 'a circle \u2014 a vertical line through the middle crosses it twice (once on top, once on bottom).',
    'ellipse': 'an ellipse \u2014 just like a circle, a vertical line through the middle crosses it twice.',
    'sideways-parabola': 'a parabola that opens sideways (left or right) \u2014 a vertical line through it crosses it twice.',
    'wavy': 'a wavy curve \u2014 a vertical line through it crosses more than once.'
};

function getAnswerHtml() {
    if (currentMode === 'domain-range') {
        var d = { lower: currentProblem.dom.lower, lowerInclusive: currentProblem.dom.lowerInclusive,
                  upper: currentProblem.dom.upper, upperInclusive: currentProblem.dom.upperInclusive };
        var r = currentProblem.range;
        return '<strong>Domain:</strong> ' + toIntervalStr(d) + '<br>' +
               '<strong>Range:</strong> ' + toIntervalStr(r);
    } else if (currentMode === 'read-graph') {
        var ansStr = currentProblem.answer.join(', ');
        return currentProblem.isEval
            ? '<strong>Answer:</strong> f(' + currentProblem.askX + ') = ' + ansStr
            : '<strong>Answer:</strong> x = ' + ansStr;
    } else if (currentMode === 'evaluate') {
        return currentProblem.isSolve
            ? '<strong>Answer:</strong> x = ' + currentProblem.answer.join(', ')
            : '<strong>Answer:</strong> f(' + currentProblem.k + ') = ' + currentProblem.answer;
    } else {
        var verdict = currentProblem.isFunction ? 'Yes' : 'No';
        return '<strong>Answer:</strong> ' + verdict + ' \u2014 this is ' + isFunctionExplanations[currentProblem.subtype];
    }
}

function getHintHtml() {
    if (currentMode === 'domain-range') {
        return '<strong>Hint:</strong><br>Domain = all the x-values the graph covers.<br>' +
               'Range = all the y-values the graph covers.<br>' +
               'A <strong>filled</strong> dot means that endpoint IS included \u2014 use a square bracket, like [3.<br>' +
               'A <strong>hollow</strong> dot means that endpoint is NOT included \u2014 use a parenthesis, like (3.<br>' +
               'An arrow means the graph keeps going forever that way \u2014 always a parenthesis next to \u221e.<br>' +
               'Write your answer in interval notation, like <strong>[-3, 5)</strong> or <strong>(-\u221e, 4]</strong>.';
    } else if (currentMode === 'read-graph') {
        if (currentProblem.isEval) {
            return '<strong>Hint:</strong><br>Find x = ' + currentProblem.askX + ' on the x-axis, trace straight up or down to the graph, then read the y-value at that point.';
        }
        return '<strong>Hint:</strong><br>Find y = ' + currentProblem.askY + ' on the y-axis, trace straight across to where the graph crosses that height, then read the x-value(s) there. A parabola can cross the same height twice!';
    } else if (currentMode === 'evaluate') {
        if (currentProblem.isSolve) {
            if (currentProblem.type === 'linear') {
                return '<strong>Hint:</strong><br>Set the function equal to ' + currentProblem.targetV + ', then solve like a regular equation: undo addition/subtraction first, then undo multiplication.';
            }
            return '<strong>Hint:</strong><br>Set the function equal to ' + currentProblem.targetV + ', move everything to one side so it equals 0, then factor. A quadratic can have two solutions!';
        }
        if (currentProblem.type === 'linear') {
            return '<strong>Hint:</strong><br>Substitute x = ' + currentProblem.k + ' into the function, then multiply first and add second.';
        }
        return '<strong>Hint:</strong><br>Substitute x = ' + currentProblem.k + '. Square it FIRST \u2014 watch the sign! \u2014 then multiply by the leading coefficient, then add the rest.';
    } else {
        return '<strong>Hint:</strong><br>Picture a vertical line sweeping across the graph from left to right. If it EVER crosses the curve more than once at the same time, the graph is NOT a function \u2014 that x-value would have two different outputs.';
    }
}

/* ---------------------------------------------------------------------
   Revealing the answer, or opening the step-by-step solution, books the
   problem as attempted and ends the streak -- exactly like a wrong try.
   Without this a student could press Show Answer, read the interval off the
   panel, type it back and take clean first-try credit with the streak intact,
   which quietly inflated every accuracy figure on the stats cups.

   Show HINT is deliberately NOT charged: every hint in this game is strategy
   ("trace across to where the graph crosses that height"), never the answer.

   In Domain & Range the panel reveals BOTH intervals, so both still-unresolved
   fields are booked here; checkIntervalField() then knows not to book again.
   --------------------------------------------------------------------- */
var missRecorded = false;

function recordReveal() {
    if (missRecorded || !currentProblem) return;
    missRecorded = true;
    if (currentMode === 'domain-range') {
        if (!domainResolved) recordStat('domain-range', currentProblem.subtype, false);
        if (!rangeResolved) recordStat('domain-range', currentProblem.subtype, false);
    } else {
        recordStat(currentMode, currentProblem.subtype, false);
    }
    streak = 0;
    updateDisplay();
    saveState();
    announceFeedback('Answer shown. This problem counts as attempted and the streak resets.');
}

function toggleHint() {
    var hint = document.getElementById('hint');
    if (hint.style.display === 'none') { hint.innerHTML = getHintHtml(); hint.style.display = 'block'; }
    else hint.style.display = 'none';
}

function toggleAnswer() {
    var box = document.getElementById('answer-box');
    if (box.style.display === 'none') {
        recordReveal();
        box.innerHTML = getAnswerHtml() +
            '<div style="margin-top:8px;font-size:12.5px;font-weight:700;color:#3b3568;">' +
            'Shown answers count as an attempt, and the streak restarts.</div>';
        box.style.display = 'block';
    } else {
        box.style.display = 'none';
    }
}

var solutionRevealed = 0;
function toggleSolution() {
    var box = document.getElementById('solution-box');
    if (box.style.display === 'none') {
        if (!currentProblem || !currentProblem.solutionSteps) return;
        /* The walkthrough ends on the answer, so opening it is a reveal too --
           the same rule Radical Expressions needed for Show Steps. */
        recordReveal();
        if (!solutionRevealed) solutionRevealed = 1;   // reopening keeps your place
        renderSolutionBox();
    } else {
        box.style.display = 'none';
    }
}

function showNextSolutionStep() {
    solutionRevealed++;
    renderSolutionBox();
}

function renderSolutionBox() {
    var box = document.getElementById('solution-box');
    var steps = currentProblem.solutionSteps;
    var total = steps.length;
    var shown = Math.min(solutionRevealed, total);
    var html = '<div style="font-weight: bold; margin-bottom: 8px;">Step-by-Step Solution (' + shown + ' of ' + total + ')</div>';
    html += '<div style="font-size: 13px;">Start with:</div>';
    html += '<div style="font-family: Consolas, monospace; font-weight: bold; font-size: 17px; margin: 4px 0 10px 8px; color: #1e2a5e;">' + currentProblem.fnLabel + '</div>';
    for (var i = 0; i < shown; i++) {
        var parts = steps[i].split(':  ');
        var stepLabel = parts[0];
        var stepEq = parts.length > 1 ? parts.slice(1).join(':  ') : '';
        html += '<div style="padding: 8px 0 4px; border-top: 1px dashed rgba(0,0,0,0.15);">';
        html += '<div><b>' + (i + 1) + '.</b> ' + stepLabel + (stepEq ? ':' : '') + '</div>';
        if (stepEq) {
            html += '<div style="font-family: Consolas, monospace; font-weight: bold; font-size: 17px; margin: 5px 0 4px 8px; color: #1e2a5e;">' + stepEq + '</div>';
        }
        html += '</div>';
    }
    if (shown < total) {
        html += '<div style="text-align: center; margin-top: 10px;"><button class="submit-btn" onclick="showNextSolutionStep()">Next Step</button></div>';
    } else {
        html += '<div style="text-align: center; margin-top: 10px; font-weight: bold; color: #047857;">That\'s the complete solution!</div>';
    }
    box.className = 'answer-box';
    box.style.display = 'block';
    box.innerHTML = html;
}

function stripTags(html) { return String(html).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }

function handleResolution(success, customMsg) {
    var feedback = document.getElementById('feedback');
    if (success) {
        problemCount++;
        if (!missRecorded) {
            recordStat(currentMode, currentProblem.subtype, true);
            streak++;
            if (streak > bestStreak) bestStreak = streak;
            celebrateStreak(streak);
            feedback.innerHTML = 'Correct!';
            feedback.className = 'feedback correct';
            announceFeedback('Correct! Streak ' + streak + '. Select Next Problem to continue.');
        } else {
            /* Right, but the answer had already been shown: the attempt is
               already booked, so do not book it again and do not restart the
               streak on a revealed problem. */
            feedback.innerHTML = 'That\'s the right value \u2014 but the answer was shown, so this one is not counted.';
            feedback.className = 'feedback incorrect';
            announceFeedback('That is the right value, but the answer was shown, so this one is not counted. Select Next Problem to continue.');
        }
        updateDisplay(); saveState();
        showNextButton();
    } else {
        chancesLeft--;
        if (chancesLeft > 0) {
            feedback.textContent = customMsg || 'Not quite \u2014 try again!';
            feedback.className = 'feedback incorrect';
            announceFeedback((customMsg || 'Not quite, try again.') + ' You have one more try.');
        } else {
            /* problemCount was only advanced on the success path, so the
               "Problem: N" counter used to stall on every missed problem. */
            problemCount++;
            if (!missRecorded) { missRecorded = true; recordStat(currentMode, currentProblem.subtype, false); }
            streak = 0;
            feedback.innerHTML = 'Not quite. ' + getAnswerHtml();
            feedback.className = 'feedback incorrect';
            updateDisplay(); saveState();
            showNextButton();
            announceFeedback('Not quite. ' + stripTags(getAnswerHtml()) + '. Select Next Problem to continue.');
        }
    }
}

function getChancesLeft(which) { return which === 'domain' ? domainChancesLeft : rangeChancesLeft; }
function decrementFieldChances(which) { if (which === 'domain') domainChancesLeft--; else rangeChancesLeft--; }
function isFieldResolved(which) { return which === 'domain' ? domainResolved : rangeResolved; }
function setFieldResolved(which) { if (which === 'domain') domainResolved = true; else rangeResolved = true; }

function setFieldFeedback(which, msg, cls) {
    var el = document.getElementById(which + '-feedback');
    if (!el) return;
    el.innerHTML = msg;
    el.className = 'field-feedback' + (cls ? ' ' + cls : '');
    var label = (which === 'domain') ? 'Domain' : 'Range';
    announceFeedback(label + ': ' + stripTags(msg));
}

function disableIntervalField(which) {
    var input = document.getElementById(which + '-input');
    if (input) input.disabled = true;
}

function getFieldTargetBounds(which) {
    if (which === 'domain') {
        return { lower: currentProblem.dom.lower, lowerInclusive: currentProblem.dom.lowerInclusive,
                 upper: currentProblem.dom.upper, upperInclusive: currentProblem.dom.upperInclusive };
    }
    return currentProblem.range;
}

function maybeAdvanceAfterBothFieldsResolved() {
    if (!domainResolved || !rangeResolved) return;
    problemCount++;
    updateDisplay(); saveState();
    var feedback = document.getElementById('feedback');
    feedback.textContent = 'Nice work \u2014 both done!';
    feedback.className = 'feedback correct';
    showNextButton();
    announceFeedback('Domain and range are both done. Select Next Problem to continue.');
}

// Detects a bracket (rather than parenthesis) sitting right next to an
// infinity symbol -- mathematically harmless (infinity can't be "included"
// either way) but worth a gentle style note since it's never correct notation.
function hasWrongBracketNearInfinity(raw) {
    var s = normalizeAnswerText(raw);
    return /\[\s*-?\u221e/.test(s) || /\u221e\s*\]/.test(s);
}

// Detects the specific near-miss where both boundary NUMBERS are exactly
// right, but the open/closed choice on a finite side doesn't match --
// worth a targeted hint instead of a generic "not quite".
function valuesMatchButBracketWrong(parsed, target) {
    function valEq(a, b) {
        if (a === Infinity && b === Infinity) return true;
        if (a === -Infinity && b === -Infinity) return true;
        if (!isFinite(a) || !isFinite(b)) return false;
        return Math.abs(a - b) < 1e-6;
    }
    if (!valEq(parsed.lower, target.lower) || !valEq(parsed.upper, target.upper)) return false;
    var lowerMismatch = isFinite(target.lower) && parsed.lowerInclusive !== target.lowerInclusive;
    var upperMismatch = isFinite(target.upper) && parsed.upperInclusive !== target.upperInclusive;
    return lowerMismatch || upperMismatch;
}

function checkIntervalField(which) {
    if (currentMode !== 'domain-range' || isFieldResolved(which)) return;
    var label = (which === 'domain') ? 'Domain' : 'Range';
    var raw = document.getElementById(which + '-input').value;
    if (!raw.trim()) { setFieldFeedback(which, 'Please enter the ' + which + '.', 'incorrect'); return; }
    var parsed = parseAnswer(raw);
    if (!parsed) { setFieldFeedback(which, 'Please use interval notation, e.g., [2, \u221e) or (-3, 5].', 'incorrect'); return; }

    var target = getFieldTargetBounds(which);
    var ok = boundsEqual(parsed, target);
    if (ok) {
        setFieldResolved(which);
        var note = hasWrongBracketNearInfinity(raw)
            ? ' <span style="color:#3b3568;font-weight:600;">(Small note: infinity is never actually reached, so always use a parenthesis next to \u221e, not a bracket.)</span>'
            : '';
        setFieldFeedback(which, 'Correct! ' + toIntervalStr(target) + note +
            (missRecorded ? ' <span style="color:#3b3568;font-weight:600;">(The answer was shown, so this one is not counted.)</span>' : ''), 'correct');
        disableIntervalField(which);
        if (!missRecorded) {
            streak++; if (streak > bestStreak) bestStreak = streak;
            celebrateStreak(streak);
            recordStat('domain-range', currentProblem.subtype, true);
        }
        maybeAdvanceAfterBothFieldsResolved();
    } else {
        var bracketHint = valuesMatchButBracketWrong(parsed, target);
        decrementFieldChances(which);
        if (getChancesLeft(which) > 0) {
            var msg = bracketHint
                ? 'Your number is right \u2014 check whether that endpoint should use [ ] (included) or ( ) (not included).'
                : 'Not quite \u2014 try again!';
            setFieldFeedback(which, msg, 'incorrect');
        } else {
            setFieldResolved(which);
            var revealMsg = (bracketHint ? 'So close \u2014 just the bracket type was off. ' : '') + label + ': ' + toIntervalStr(target);
            setFieldFeedback(which, revealMsg, 'incorrect');
            disableIntervalField(which);
            streak = 0;
            if (!missRecorded) recordStat('domain-range', currentProblem.subtype, false);
            maybeAdvanceAfterBothFieldsResolved();
        }
    }
    updateDisplay(); saveState();
}

function checkReadGraphAnswer() {
    var raw = document.getElementById('rg-input').value;
    if (!raw.trim()) { handleFormatIssue('Please enter a value.'); return; }
    var parts = raw.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
    var nums = parts.map(parseStrictNumber);
    if (!nums.length || nums.some(isNaN)) { handleFormatIssue('Please enter number(s) only, separated by a comma if more than one.'); return; }
    nums.sort(function (a, b) { return a - b; });
    var expected = currentProblem.answer.slice().sort(function (a, b) { return a - b; });
    var ok = nums.length === expected.length && nums.every(function (v, i) { return Math.abs(v - expected[i]) < 1e-6; });
    if (ok) { handleResolution(true); return; }
    var msg = (expected.length > 1 && nums.length < expected.length) ? 'You found one, but there\'s another value too \u2014 look again!' : undefined;
    handleResolution(false, msg);
}

function checkEvaluateAnswer() {
    var raw = document.getElementById('ev-input').value;
    if (!raw.trim()) { handleFormatIssue('Please enter a value.'); return; }
    if (currentProblem.isSolve) {
        var parts = raw.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
        var nums = parts.map(parseStrictNumber);
        if (!nums.length || nums.some(isNaN)) { handleFormatIssue('Please enter number(s) only, separated by a comma if more than one.'); return; }
        nums.sort(function (a, b) { return a - b; });
        var expected = currentProblem.answer.slice().sort(function (a, b) { return a - b; });
        var ok = nums.length === expected.length && nums.every(function (v, i) { return Math.abs(v - expected[i]) < 1e-6; });
        if (ok) { handleResolution(true); return; }
        var msg = (expected.length > 1 && nums.length < expected.length) ? 'You found one, but there\'s another value too \u2014 look again!' : undefined;
        handleResolution(false, msg);
    } else {
        var val = parseStrictNumber(raw);
        if (isNaN(val)) { handleFormatIssue('Please enter a number.'); return; }
        var ok = Math.abs(val - currentProblem.answer) < 1e-6;
        handleResolution(ok);
    }
}

function checkIsFunctionAnswer(userSaysYes) {
    if (currentMode !== 'is-function') return;
    var ok = (userSaysYes === currentProblem.isFunction);
    handleResolution(ok);
}

function checkAnswer() {
    if (currentMode === 'read-graph') checkReadGraphAnswer();
    else if (currentMode === 'evaluate') checkEvaluateAnswer();
}

/* =====================================================================
   Mode switching, stats panel, display, persistence
   ===================================================================== */
function setMode(mode) {
    currentMode = mode;
    var btns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < btns.length; i++) {
        var isActive = btns[i].getAttribute('data-mode') === mode;
        btns[i].classList.toggle('active', isActive);
        btns[i].setAttribute('aria-pressed', isActive ? 'true' : 'false');
    }
    renderStatsPanel();
    generateProblem();
}

function renderStatsPanel() {
    var html = '<div class="progress-cups">';
    modeOrder.forEach(function (mode) {
        var totalAttempts = 0, totalCorrect = 0;
        Object.keys(stats[mode]).forEach(function (t) {
            totalAttempts += stats[mode][t].attempts;
            totalCorrect += stats[mode][t].correct;
        });
        var acc = totalAttempts > 0 ? totalCorrect / totalAttempts : 0;
        var fillClass = totalAttempts === 0 ? '' : (acc >= 0.8 ? 'full' : (acc >= 0.5 ? 'half' : 'partial'));
        var fillHeight = totalAttempts === 0 ? 0 : Math.round(acc * 100);
        html += '<div class="cup-container"><div class="cup-label">' + modeLabels[mode] + '</div>' +
                '<div class="cup"><div class="cup-fill ' + fillClass + '" style="height:' + fillHeight + '%"></div></div>' +
                '<div class="cup-stats">' + (totalAttempts > 0 ? totalCorrect + '/' + totalAttempts : 'no data yet') + '</div></div>';
    });
    html += '</div>';
    document.getElementById('stats-panel').innerHTML = html;
}

function updateDisplay() {
    document.getElementById('problemNum').textContent = problemCount + 1;
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('bestStreakVal').textContent = bestStreak;
    var sd = document.getElementById('streak-display');
    sd.className = streak >= 5 ? 'info-item streak-hot' : 'info-item';
    var totalC = 0, totalT = 0;
    Object.keys(stats).forEach(function (m) {
        Object.keys(stats[m]).forEach(function (t) { totalC += stats[m][t].correct; totalT += stats[m][t].attempts; });
    });
    document.getElementById('accVal').textContent = totalT > 0 ? Math.round(totalC / totalT * 100) + '%' : '--';
    renderStatsPanel();
}

function saveState() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ stats: stats, bestStreak: bestStreak, problemCount: problemCount }));
    } catch (e) { /* storage unavailable -- play without saving */ }
}

/* Coerce anything read back from localStorage to a plain bounded integer.
   Flooring alone still let 1e308 (or 1e9) through into the header and the cup
   labels; MAX_COUNT keeps every derived figure printable and finite. */
var MAX_COUNT = 1000000;
function sanitizeCount(v) {
    var n = Number(v);
    if (!isFinite(n) || n < 0) return 0;
    n = Math.floor(n);
    return n > MAX_COUNT ? MAX_COUNT : n;
}

function loadState() {
    try {
        var raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        var st = JSON.parse(raw);
        if (st && st.stats) {
            Object.keys(stats).forEach(function (m) {
                Object.keys(stats[m]).forEach(function (t) {
                    var src = st.stats[m] && st.stats[m][t];
                    if (!src || typeof src !== 'object') return;
                    var attempts = sanitizeCount(src.attempts);
                    var correct = sanitizeCount(src.correct);
                    if (correct > attempts) correct = attempts;
                    stats[m][t] = { attempts: attempts, correct: correct };
                });
            });
        }
        bestStreak = sanitizeCount(st && st.bestStreak);
        problemCount = sanitizeCount(st && st.problemCount);
    } catch (e) { /* corrupt or unavailable storage -- start fresh */ }
}

var resetArmed = false;
var resetTimer = null;
function confirmReset() {
    if (!resetArmed) {
        resetArmed = true;
        var btns = document.querySelectorAll('.reset-btn');
        for (var i = 0; i < btns.length; i++) btns[i].textContent = 'Tap again to confirm';
        resetTimer = setTimeout(function () {
            resetArmed = false;
            var b2 = document.querySelectorAll('.reset-btn');
            for (var j = 0; j < b2.length; j++) b2[j].textContent = 'Reset Progress';
        }, 4000);
        return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    Object.keys(stats).forEach(function (m) {
        Object.keys(stats[m]).forEach(function (t) { stats[m][t] = { attempts: 0, correct: 0 }; });
    });
    streak = 0;
    bestStreak = 0;
    problemCount = 0;
    saveState();
    var btns2 = document.querySelectorAll('.reset-btn');
    for (var k = 0; k < btns2.length; k++) btns2[k].textContent = 'Reset Progress';
    generateProblem();
    updateDisplay();
}

/* =====================================================================
   Confetti
   ===================================================================== */
function celebrateStreak(s) {
    if (s === 0 || s % 5 !== 0) return;
    if (s % 10 === 0) createConfetti(200, 3);
    else createConfetti(100, 2);
}

/* Design item 9: the switch lives under its own localStorage key, so clearing
   progress does not silently switch the animation back on. Every access is
   wrapped -- storage can throw outright in private-mode Safari. */
var CONFETTI_KEY = 'domainRangeConfetti_v1';
var confettiEnabled = true;
function loadConfettiSetting() {
    try {
        var v = localStorage.getItem(CONFETTI_KEY);
        if (v === '0') confettiEnabled = false;
        else if (v === '1') confettiEnabled = true;
    } catch (e) { /* storage unavailable -- default to on */ }
}
function syncConfettiSwitch() {
    var btn = document.getElementById('confetti-switch');
    if (btn) btn.setAttribute('aria-pressed', confettiEnabled ? 'true' : 'false');
}
function toggleConfettiSetting() {
    confettiEnabled = !confettiEnabled;
    try { localStorage.setItem(CONFETTI_KEY, confettiEnabled ? '1' : '0'); } catch (e) {}
    syncConfettiSwitch();
}

function createConfetti(count, tier) {
    if (!confettiEnabled) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var host = document.body;
    /* Design-system confetti palette (the one place orange is permitted). */
    /* Design item 10: '#ef4444' (red, not in the palette) and '#f59e0b'
       (orange, banned outright) swapped for mint '#10b981' and heritage
       rose '#c76b8f'. Still eight colours. */
    var colors = ['#7c3aed', '#22c55e', '#2e3d8f', '#c76b8f', '#10b981', '#ffeb3b', '#0d9488', '#a78bfa'];
    var isMassive = tier === 3;
    for (var i = 0; i < count; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti';
        piece.setAttribute('aria-hidden', 'true');
        var base;
        if (tier === 1) base = 7 + Math.random() * 5;
        else if (tier === 2) base = 10 + Math.random() * 7;
        else base = 11 + Math.random() * 9;
        var color = colors[Math.floor(Math.random() * colors.length)];
        var shape = Math.floor(Math.random() * 4);
        if (shape === 0) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '50%';
        } else if (shape === 1) {
            piece.style.width = base + 'px'; piece.style.height = base + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else if (shape === 2) {
            piece.style.width = Math.max(4, base * 0.35) + 'px'; piece.style.height = (base * 1.7) + 'px';
            piece.style.background = color; piece.style.borderRadius = '2px';
        } else {
            piece.style.width = '0'; piece.style.height = '0'; piece.style.background = 'transparent';
            piece.style.borderLeft = (base * 0.6) + 'px solid transparent';
            piece.style.borderRight = (base * 0.6) + 'px solid transparent';
            piece.style.borderBottom = base + 'px solid ' + color;
        }
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-20px';
        var dur;
        if (tier === 1) dur = 1.6 + Math.random() * 1.0;
        else if (tier === 2) dur = 2.0 + Math.random() * 1.5;
        else dur = 2.5 + Math.random() * 2.0;
        piece.style.animation = (isMassive ? 'confetti-fall-slow' : 'confetti-fall') + ' ' + dur + 's ease-out forwards';
        piece.style.animationDelay = (Math.random() * (isMassive ? 0.8 : 0.4)) + 's';
        host.appendChild(piece);
        setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(piece), isMassive ? 6000 : 4500);
    }
}

/* =====================================================================
   Boot
   ===================================================================== */
loadState();
loadConfettiSetting();
syncConfettiSwitch();
renderStatsPanel();
generateProblem();
updateDisplay();
bootComplete = true;
</script>
</body>
</html>
